<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081430">
<title>ナガレを越えて 体験版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one full-height canvas (sub window → map → Jupiter stage) with a glass header and thin DOM panels on top.
   Deep-sea neon outside the game, warm paper-craft valley inside it. */
:root {
  --night: #081430;
  --night-2: #0f2150;
  --gold: #ffd28a;
  --gold-deep: #c58a3e;
  --pink: #ff6fc0;
  --cyan: #58e6ff;
  --violet: #8b6bff;
  --ink: #fff6ea;
  --ink-dim: #bcc6ea;
  --line: rgba(255,255,255,.14);
  --font-pop: "Dela Gothic One", "Zen Maru Gothic", "Hiragino Sans", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; background: var(--night); }
body { color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
.app { position: relative; height: 100%; max-width: 460px; margin: 0 auto; overflow: hidden; background: var(--night); isolation: isolate; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

/* header */
.top { position: absolute; top: 0; left: 0; right: 0; height: 56px; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(8,20,48,.92), rgba(10,24,60,.66)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(88,230,255,.2); box-shadow: 0 1px 0 rgba(255,111,192,.14), 0 8px 24px rgba(4,10,30,.22); }
.iconbtn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.07); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; padding: 0; display: grid; place-items: center; transition: background .2s, transform .15s; }
.iconbtn:active { transform: scale(.92); }
.iconbtn svg { width: 18px; height: 18px; }
.title { flex: 1; min-width: 0; }
.title .kicker { font-family: var(--font-pop); font-size: .58rem; letter-spacing: .3em; color: var(--cyan); text-shadow: 0 0 8px rgba(88,230,255,.5); }
.title .name { font-family: var(--font-pop); font-size: 1.04rem; letter-spacing: .02em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(90deg, #fff, var(--gold) 45%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.today { flex: none; font-family: var(--font-body); font-weight: 700; font-size: .68rem; color: var(--ink); padding: 8px 11px; border-radius: 999px; border: 1px solid rgba(255,210,138,.38); background: rgba(255,210,138,.1); cursor: pointer; }
.today[hidden] { display: none; }

/* panels */
.panel { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility 0s linear .4s; }
.panel.show { opacity: 1; visibility: visible; transition: opacity .4s ease; }
.panel > * { pointer-events: auto; }
.card { position: absolute; left: 16px; right: 16px; padding: 12px 16px; border-radius: 18px; background: linear-gradient(160deg, rgba(20,36,84,.82), rgba(12,22,56,.78)); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: .8rem; line-height: 1.75; font-weight: 500; color: var(--ink); text-align: center; pointer-events: none; }
.card b { color: var(--gold); font-weight: 900; }
.card .big { display: block; font-family: var(--font-pop); font-size: 1.15rem; letter-spacing: .06em; line-height: 1.5; background: linear-gradient(90deg, #fff, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }

.pill { position: absolute; left: 50%; transform: translateX(-50%); width: calc(100% - 48px); max-width: 340px; height: 58px; border-radius: 999px; border: 0; cursor: pointer; padding: 0; font-family: var(--font-pop); font-size: 1.05rem; letter-spacing: .1em; color: #2a1606; background: linear-gradient(100deg, #fff0cf, var(--gold) 42%, var(--gold-deep)); box-shadow: 0 10px 30px rgba(197,138,62,.35), 0 0 26px rgba(255,111,192,.18), inset 0 1px 0 rgba(255,255,255,.7); transition: transform .15s ease, filter .2s; }
.pill:active { transform: translateX(-50%) scale(.97); }
.pill::before { content: ""; position: absolute; inset: -3px; border-radius: inherit; padding: 3px; background: conic-gradient(from var(--a, 0deg), var(--pink), var(--cyan), var(--violet), var(--gold), var(--pink)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .9; animation: spin 6s linear infinite; }
@property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes spin { to { --a: 360deg; } }
.pill.ghost { color: var(--ink); background: linear-gradient(100deg, rgba(60,40,120,.85), rgba(40,30,96,.85)); box-shadow: 0 8px 24px rgba(139,107,255,.25), inset 0 1px 0 rgba(255,255,255,.18); }
.row2 { position: absolute; left: 24px; right: 24px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; }
.row2 .pill { position: relative; left: auto; transform: none; width: auto; flex: 1; font-size: .98rem; }
.row2 .pill:active { transform: scale(.97); }
.bottom-btn { bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }

/* stage */
.taphint { position: absolute; left: 50%; top: 40%; white-space: nowrap; transform: translate(-50%, 0); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; opacity: 0; transition: opacity .5s ease; }
.taphint.show { opacity: 1; }
.taphint .msg { font-family: var(--font-pop); font-size: 1.05rem; letter-spacing: .12em; color: #fff; padding: 8px 18px; border-radius: 999px; background: rgba(60,36,96,.55); border: 1px solid rgba(255,255,255,.3); box-shadow: 0 0 24px rgba(255,111,192,.25); text-shadow: 0 1px 6px rgba(40,10,60,.5); }
.taphint svg { width: 44px; height: 44px; filter: drop-shadow(0 2px 6px rgba(40,10,60,.35)); }
.taphint.once svg { animation: tap 1.1s ease-in-out 2; }
@keyframes tap { 0%,100% { transform: translateY(0) scale(1); } 45% { transform: translateY(6px) scale(.9); } }
.guide { height: 48px; width: auto; max-width: none; white-space: nowrap; padding: 0 22px; font-size: .88rem; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); color: var(--ink); background: linear-gradient(100deg, rgba(58,40,120,.88), rgba(32,60,120,.88)); }
.guide[hidden] { display: none; }
.guide.on { color: #2a1606; background: linear-gradient(100deg, #fff0cf, var(--gold) 42%, var(--gold-deep)); }

/* clear */
.clearbox { position: absolute; left: 0; right: 0; top: 17%; display: grid; place-items: center; pointer-events: none; }
.clearword { position: relative; font-family: var(--font-pop); font-size: clamp(64px, 21vw, 92px); letter-spacing: .1em; line-height: 1.1; padding-left: .1em; }
.clearword .ghost, .clearword .fill { display: block; }
.clearword .ghost { color: transparent; -webkit-text-stroke: 2px rgba(255,210,138,.55); }
.clearword .fill { position: absolute; inset: 0; padding-left: .1em; background: linear-gradient(180deg, #fff3cf 0%, #ffd28a 40%, #e9a94e 72%, #b9792f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; clip-path: inset(100% 0 0 0); filter: drop-shadow(0 4px 0 rgba(120,70,20,.35)) drop-shadow(0 0 18px rgba(255,190,90,.45)); }
#p-clear.show .clearword .fill { animation: fillup .8s cubic-bezier(.3,.7,.3,1) .1s forwards, breathe 3.2s ease-in-out 1.2s infinite; }
@keyframes fillup { to { clip-path: inset(0 0 0 0); } }
@keyframes breathe { 0%,100% { filter: drop-shadow(0 4px 0 rgba(120,70,20,.35)) drop-shadow(0 0 12px rgba(255,190,90,.35)); } 50% { filter: drop-shadow(0 4px 0 rgba(120,70,20,.35)) drop-shadow(0 0 26px rgba(255,190,90,.6)); } }
#p-clear .pill { opacity: 0; transition: opacity .6s ease; pointer-events: none; }
#p-clear .pill.show { opacity: 1; pointer-events: auto; }

.toast { position: absolute; left: 50%; top: 70px; z-index: 6; width: max-content; transform: translate(-50%, -8px); max-width: calc(100% - 40px); padding: 9px 16px; border-radius: 999px; background: rgba(14,26,64,.9); border: 1px solid rgba(88,230,255,.35); box-shadow: 0 0 18px rgba(88,230,255,.18); font-size: .78rem; font-weight: 700; line-height: 1.5; text-align: center; opacity: 0; pointer-events: none; transition: opacity .35s ease, transform .35s ease; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) {
  .pill::before { animation: none; }
  .taphint.once svg { animation: none; }
  #p-clear.show .clearword .fill { animation: fillup .8s ease .1s forwards; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="cv" role="img" aria-label="潜水艇の丸い窓から見る、深海の都"></canvas>
  <header class="top">
    <button class="iconbtn" id="back" aria-label="もどる">‹</button>
    <div class="title"><div class="kicker" id="kicker">NEPTUNE</div><div class="name" id="tname">深海の都</div></div>
    <button class="today" id="today">今日はここまで</button>
    <button class="iconbtn" id="snd" aria-label="音を消す" aria-pressed="false"></button>
  </header>

  <section class="panel show" id="p-sub" aria-label="深海の都">
    <p class="card" style="bottom:calc(100px + env(safe-area-inset-bottom,0px))">深海の都。灯りの入った建物に、<br>潜水艇を寄せると入れます。<br>遊ぶのに、マナは使いません。</p>
    <button class="pill bottom-btn" id="go-shell">巻き貝の館へ寄せる</button>
  </section>

  <section class="panel" id="p-map" aria-label="ナガレを越えての地図">
    <p class="card" style="top:66px">主人公は、<b>ミナト</b>の小さな姿。1ステージ1〜2分。<br>失敗しても、その場からやり直せます。<br>結果は「クリア」だけが出ます。</p>
    <button class="pill bottom-btn" id="go-play">遊んでみる</button>
  </section>

  <section class="panel" id="p-stage" aria-label="木星ステージ">
    <div class="taphint" id="taphint" aria-live="polite">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="20" cy="12" r="9" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="2"/><path d="M17 30V12a3 3 0 0 1 6 0v11l9.5 2.2a4 4 0 0 1 3 4.6L34 40H20l-6.5-8a2.6 2.6 0 0 1 3.5-3.7z" fill="#fff" stroke="#6a3f8f" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="msg">タップで、羽ばたく</span>
    </div>
    <button class="pill guide" id="guide" hidden>案内つきで進む</button>
  </section>

  <section class="panel" id="p-clear" aria-label="クリア">
    <div class="clearbox" aria-live="polite"><div class="clearword"><span class="ghost">クリア</span><span class="fill" aria-hidden="true">クリア</span></div></div>
    <button class="pill bottom-btn" id="go-map">地図へ</button>
  </section>

  <section class="panel" id="p-end" aria-label="体験版の終わり">
    <p class="card" style="top:66px"><span class="big">体験版は、ここまでです</span>木星のマスに、旗が立ちました。</p>
    <div class="row2"><button class="pill" id="again">もう一回</button><button class="pill ghost" id="leave">館を出る</button></div>
  </section>

  <div class="toast" id="toast" role="status"></div>
</div>

    SPACES.forEach((s, i) => {
      const p = spacePos(i);
      g.save(); g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 8; g.shadowOffsetY = 4;
      g.fillStyle = '#e9dcc4'; circ(g, p.x, p.y, 30); g.fill(); g.restore();
      g.fillStyle = '#d3c3a6'; circ(g, p.x, p.y + 3, 26); g.fill(); g.fillStyle = '#f5ead6'; circ(g, p.x, p.y, 26); g.fill();
      emblem(g, s.kind, p.x, p.y - 2, 13);
      if (i === 1) { const pulse = 0.5 + 0.5 * Math.sin(t * 2.4); g.save(); g.strokeStyle = '#ffd28a'; g.shadowColor = '#ffb84d'; g.shadowBlur = 16; g.lineWidth = 3; g.globalAlpha = 0.55 + 0.4 * pulse; circ(g, p.x, p.y, 34 + pulse * 3); g.stroke(); g.restore(); }
      g.fillStyle = '#fff6ea'; g.font = '700 13px "Zen Maru Gothic", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'top'; g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 4; g.fillText(s.n, p.x, p.y + 34); g.shadowBlur = 0;
    });
    // flags
    const flag = (p, k, col) => { const h = 34 * k; g.strokeStyle = '#8a5a2b'; g.lineWidth = 2; g.beginPath(); g.moveTo(p.x + 18, p.y - 8); g.lineTo(p.x + 18, p.y - 8 - h); g.stroke(); if (k > .3) { const fl = Math.sin(t * 4) * 2 * RM; g.fillStyle = col; g.beginPath(); g.moveTo(p.x + 18, p.y - 8 - h); g.quadraticCurveTo(p.x + 28, p.y - 6 - h + fl, p.x + 38, p.y - 3 - h + fl); g.lineTo(p.x + 18, p.y + 4 - h); g.closePath(); g.fill(); } };
    flag(spacePos(0), 1, '#ff8fc4');
    if (MS.endMode) { const k = eback((MS.flagT - 0.5) / 0.6); if (k > 0) flag(spacePos(1), k, '#ffd27a'); }
    // cloth over 水星 and beyond
    const lift = MS.endMode ? Math.max(0, Math.sin(t * 1.4)) * 10 * RM : Math.sin(t * 1.1) * 2 * RM;
    g.save();
    if (MS.endMode) { const gl = g.createRadialGradient(LW * .7, 540, 0, LW * .7, 540, 60); gl.addColorStop(0, 'rgba(255,230,170,.5)'); gl.addColorStop(1, 'rgba(255,230,170,0)'); g.fillStyle = gl; circ(g, LW * .7, 540, 60); g.fill(); }
    gr = g.createLinearGradient(0, 180, LW, 560); gr.addColorStop(0, '#4a4366'); gr.addColorStop(0.5, '#6a6088'); gr.addColorStop(1, '#4a4366');
    g.fillStyle = gr; g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = 14; g.shadowOffsetY = 6; g.globalAlpha = 0.86;
    g.beginPath(); g.moveTo(fx0, fy0); g.lineTo(fx0 + fw, fy0); g.lineTo(fx0 + fw, 520 - lift);
    for (let x = fw; x >= 0; x -= 20) g.lineTo(fx0 + x, 548 + Math.sin(x * 0.07 + t * 0.8 * RM) * 6 - (x > fw * .7 ? lift * (x - fw * .7) / (fw * .3) : 0));
    g.lineTo(fx0, fy0); g.closePath(); g.fill(); g.shadowBlur = 0; g.globalAlpha = 1;
    for (let i = 2; i < SPACES.length; i++) { const p = spacePos(i), hl = g.createRadialGradient(p.x - 8, p.y - 10, 2, p.x, p.y, 40); hl.addColorStop(0, 'rgba(255,255,255,.16)'); hl.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = hl; circ(g, p.x, p.y, 40); g.fill(); g.fillStyle = 'rgba(20,14,40,.25)'; ell(g, p.x + 4, p.y + 30, 30, 6); g.fill(); }
    g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 8; for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(fx0 + 30 + i * 60, fy0); g.quadraticCurveTo(fx0 + 50 + i * 60, 380, fx0 + 24 + i * 62, 546); g.stroke(); }
    g.fillStyle = 'rgba(255,246,234,.75)'; g.font = '700 12px "Zen Maru Gothic", sans-serif'; g.textAlign = 'center'; g.fillText('この先は、三周目にひらきます', LW / 2, 380);
    g.restore();
    // grey storm swirling slowly over the map
    const sx = LW * .7 + Math.cos(t * 0.12) * 30, sy = 330 + Math.sin(t * 0.12) * 20;
    if (!drawSprite(g, 'storm-swirl-grey', sx, sy, 200, 200)) {
      g.save(); g.translate(sx, sy); g.rotate(t * 0.25 * RM);
      for (let i = 0; i < 5; i++) { g.strokeStyle = `rgba(200,200,215,${0.16 - i * 0.02})`; g.lineWidth = 10 - i; g.beginPath(); g.arc(0, 0, 22 + i * 18, i, i + Math.PI * 1.3); g.stroke(); }
      g.restore();
    }
    g.restore();
    // hero hops Saturn → Jupiter
    const a = spacePos(0), b = spacePos(1), k = MS.endMode ? 1 : clamp((MS.hop - 0.6) / 0.6, 0, 1);
    const hx = lerp(a.x, b.x, eio(k)) - 4, hy = lerp(a.y, b.y, eio(k)) - Math.sin(Math.PI * k) * 60 - 6;
    const land = MS.endMode ? 0 : clamp((MS.hop - 1.2) / 0.3, 0, 1), sq = land > 0 && land < 1 ? 1 - Math.sin(Math.PI * land) * 0.2 : 1;
    g.save(); g.translate(hx, hy); g.scale(2 - sq, sq); drawChibi(g, 0, 0, 0.62, t, { hoodie: ['#ffc766', '#ff9f45'], hair: '#4a3328', glasses: true, openEyes: true, bounce: MS.endMode ? 3 : 0 }); g.restore();
    // festival stage at the top (peeking past the cloth)
    g.fillStyle = 'rgba(255,214,150,.9)'; g.font = '900 11px "Zen Maru Gothic", sans-serif'; g.textAlign = 'center'; g.fillText('フェスの町', LW / 2, fy0 + 18);
  }

  // ---------- render ----------
  function render() {
    const t = gt;
    ctx.setTransform(dpr * K, 0, 0, dpr * K, 0, 0);
    if (scene === 'sub') drawSub(ctx, t, 0);
    else if (scene === 'dive') drawSub(ctx, t, sceneT / 0.9);
    else if (scene === 'spiral') drawSpiral(ctx, sceneT);
    else if (scene === 'map') drawMap(ctx, t);
    else if (scene === 'stage') drawStage(ctx, t);
    if (scene !== 'stage') drawParts(ctx, 0);
    if (veil > 0) { ctx.fillStyle = `rgba(8,20,48,${eio(veil)})`; ctx.fillRect(0, 0, LW, LH); }
  }
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    acc += dt * SPEED; let n = 0;
    while (acc >= STEP && n < 240) { update(STEP); acc -= STEP; n++; }
    render();
    requestAnimationFrame(frame);
  }

  // ---------- input wiring ----------
  let toastT = 0;
  function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }
  addEventListener('pointerdown', () => { touched = true; }, { capture: true });
  cv.addEventListener('pointerdown', (e) => {
    ensureAudio(); e.preventDefault();
    const p = toLogical(e);
    if (scene === 'stage') { if (p.y > TOP) input(false); return; }
    if (scene === 'dive' || scene === 'spiral') { if (scene === 'spiral' || sceneT > 0.3) { scene = 'spiral'; go('map'); } return; }
    if (scene === 'sub') {
      const { cx, cy, R } = PORT();
      const sx = cx, sy = cy + R * .55 - R * .4;
      for (const h of HALLS) { const hx = cx + h.x * R, hy = cy + h.y * R + R * .2 - h.s * R * .6; if (Math.hypot(p.x - hx, p.y - hy) < h.s * R * 0.75) { SUB.flash[h.type] = 1; toast('この館には、まだ灯りが入っていません'); sBell(660, .025, 1); return; } }
      if (Math.hypot(p.x - sx, p.y - sy) < R * 0.4) { startDive(); return; }
    }
    if (scene === 'map' && !MS.endMode) { const b = spacePos(1); if (Math.hypot(p.x - b.x, p.y - b.y) < 44) go('stage'); }
  });
  addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (scene === 'stage') { e.preventDefault(); ensureAudio(); if (!e.repeat) input(false); return; }
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      e.preventDefault(); ensureAudio();
      if (scene === 'sub') startDive(); else if (scene === 'map' && !MS.endMode) go('stage');
    }
  });
  const btn = (id, fn) => $(id).addEventListener('click', (e) => { ensureAudio(); fn(e); });
  btn('#go-shell', startDive);
  btn('#go-play', () => go('stage'));
  btn('#go-map', () => go('end'));
  btn('#again', () => go('stage'));
  btn('#leave', () => go('sub'));
  btn('#guide', () => { if (!S.guideOffered) return; S.guide = !S.guide; syncGuide(); });
  btn('#snd', () => setMuted(!AU.muted));
  btn('#today', () => toast('今日はここまで。次は、地図の続きから遊べます。'));
  btn('#back', () => {
    if (scene === 'stage') go('map');
    else if (scene === 'map') go(MS.endMode ? 'sub' : 'sub');
    else toast('宇宙の地図へ戻ります');
  });
  document.addEventListener('visibilitychange', () => { last = performance.now(); if (AU.ctx) { if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); } });
  $('#guide').addEventListener('pointerdown', (e) => e.stopPropagation());

  // ---------- boot ----------
  window.__game = { scene: 'sub', go: (n) => go(n) };
  setMuted(false);
  addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.load) {
    Promise.race([Promise.all([document.fonts.load('900 20px "Zen Maru Gothic"'), document.fonts.load('20px "Dela Gothic One"')]), new Promise((r) => setTimeout(r, 2500))]).then(() => { cacheGen++; });
  }
  resetStage();
  requestAnimationFrame((n) => { last = n; requestAnimationFrame(frame); });
})();
</script>
</body>
