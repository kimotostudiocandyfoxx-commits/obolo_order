<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>図書館を飾る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* Uranus U-4 「my図書館を飾る」 (点検_uranus.md §3). Isometric room on one canvas; HTML chrome on top. */
:root {
  --night: #061820;
  --deep: #0b2a36;
  --teal: #7fe9e0;
  --teal-deep: #2b9a98;
  --gold: #ffd28a;
  --gold-deep: #c58a3e;
  --pink: #ff8fc8;
  --violet: #8b6bff;
  --ink: #fff6ea;
  --ink-dim: #bfdcd8;
  --paper: #fff7e8;
  --paper2: #f1e1c4;
  --brown: #4a2f1c;
  --line: rgba(255,255,255,.13);
  --font-pop: "Dela Gothic One", "Zen Maru Gothic", "Hiragino Sans", sans-serif;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
.app { height: 100%; max-width: 460px; margin: 0 auto; position: relative; background: var(--night); overflow: hidden; isolation: isolate; user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 0; }

/* header (glass) */
.top { position: absolute; z-index: 5; top: 0; left: 0; right: 0; height: calc(60px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 16px 0; display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg, rgba(6,24,32,.86), rgba(6,24,32,.42) 72%, rgba(6,24,32,0)); }
.top::after { content: ""; position: absolute; inset: 0; z-index: -1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); mask: linear-gradient(#000 60%, transparent); -webkit-mask: linear-gradient(#000 60%, transparent); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.07); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; transition: opacity .35s; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.hide { opacity: 0; pointer-events: none; }
.title { flex: 1; min-width: 0; text-align: center; line-height: 1.12; }
.title .kicker { font-family: var(--font-pop); font-size: 10px; letter-spacing: .34em; color: var(--teal); padding-left: .34em; }
.title .name { font-family: var(--font-pop); font-size: 19px; letter-spacing: .05em; background: linear-gradient(90deg, #fff, var(--gold) 55%, #bff7ef); -webkit-background-clip: text; background-clip: text; color: transparent; transition: opacity .3s; }
.saved { position: absolute; z-index: 6; top: calc(66px + env(safe-area-inset-top, 0px)); right: 18px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(127,233,224,.18); border: 1px solid rgba(127,233,224,.5); color: var(--teal); opacity: 0; transform: translateY(4px) scale(.9); transition: opacity .45s, transform .45s; pointer-events: none; }
.saved.show { opacity: 1; transform: none; }
.saved svg { width: 16px; height: 16px; }

/* resident line */
.talk { position: absolute; z-index: 6; top: calc(64px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; min-height: 56px; border-radius: 20px; background: rgba(8,30,40,.82); border: 1px solid rgba(255,210,138,.3); box-shadow: 0 10px 30px rgba(0,0,0,.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transform: translateY(-8px); transition: opacity .4s, transform .4s; pointer-events: none; cursor: pointer; }
.talk.show { opacity: 1; transform: none; pointer-events: auto; }
.talk .av { width: 42px; height: 42px; border-radius: 50%; flex: none; overflow: hidden; background: radial-gradient(circle at 50% 35%, rgba(255,210,138,.4), rgba(255,255,255,.05)); }
.talk .av img { width: 42px; height: 42px; object-fit: cover; display: block; }
.talk .who { font-family: var(--font-pop); font-size: 10px; letter-spacing: .14em; color: var(--gold); }
.talk .line { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.45; }

/* view mode: big round button + one line */
.fab { position: absolute; z-index: 4; right: 18px; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 6px; transition: opacity .35s, transform .35s; }
.fab.hide { opacity: 0; transform: translateY(16px); pointer-events: none; }
.fab button { position: relative; width: 76px; height: 76px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: radial-gradient(circle at 38% 30%, #fff4d8, var(--gold) 45%, var(--gold-deep)); box-shadow: 0 12px 28px rgba(197,138,62,.45), inset 0 1px 0 rgba(255,255,255,.7); display: grid; place-items: center; animation: breathe 2.4s ease-in-out infinite; }
.fab button::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; padding: 3px; background: conic-gradient(from var(--a, 0deg), var(--teal), #bff7ef, var(--gold), var(--pink), var(--teal)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.fab svg { width: 38px; height: 38px; }
.fab span { font-family: var(--font-display); font-weight: 900; font-size: 13px; text-shadow: 0 2px 8px rgba(0,0,0,.6); white-space: nowrap; }
@keyframes breathe { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.08); } }
.hint { position: absolute; z-index: 4; left: 16px; right: 116px; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 999px; background: rgba(8,30,40,.66); border: 1px solid rgba(127,233,224,.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-family: var(--font-display); font-weight: 900; font-size: 13px; line-height: 1.4; opacity: 0; transform: translateY(8px); transition: opacity .45s, transform .45s; pointer-events: none; }
.hint.show { opacity: 1; transform: none; }
.hint img { width: 30px; height: 30px; object-fit: contain; flex: none; }

/* drawer: bottom sheet, always fully on screen */
.sheet { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; padding: 10px 0 calc(12px + env(safe-area-inset-bottom, 0px)); border-radius: 26px 26px 0 0; background: linear-gradient(180deg, rgba(14,44,56,.92), rgba(6,24,32,.97) 30%); border-top: 1px solid rgba(255,210,138,.32); box-shadow: 0 -14px 40px rgba(0,0,0,.35); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transform: translateY(105%); transition: transform .42s cubic-bezier(.2,.8,.2,1); }
.sheet.show { transform: none; }
.sheet::before { content: ""; position: absolute; top: 0; left: 18%; right: 18%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,210,138,.8), transparent); }
.tabs { margin: 0 16px; height: 50px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
.tabs button { height: 44px; min-height: 44px; border: 0; border-radius: 999px; background: none; font-family: var(--font-display); font-weight: 900; font-size: 14px; color: var(--ink-dim); cursor: pointer; transition: background .3s, color .3s, box-shadow .3s; }
.tabs button.on { color: #2a1606; background: linear-gradient(100deg, #fff0cf, var(--gold) 50%, #f0b768); box-shadow: 0 4px 14px rgba(255,210,138,.35); }
.tip { height: 30px; margin: 4px 16px 2px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--ink-dim); transition: color .3s; }
.tip.on { color: var(--teal); }
.cards { height: 216px; padding: 8px 16px 4px; display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, 100px); grid-auto-columns: 80px; gap: 8px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; scroll-padding: 16px; }
.cards::-webkit-scrollbar { display: none; }
.card { position: relative; width: 80px; height: 100px; border-radius: 16px; border: 0; padding: 0; cursor: pointer; background: linear-gradient(180deg, var(--paper), var(--paper2)); color: var(--brown); box-shadow: 0 4px 0 rgba(120,80,40,.35), 0 8px 16px rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; transition: transform .25s cubic-bezier(.3,1.4,.5,1), box-shadow .25s, opacity .3s; overflow: visible; }
.card canvas { width: 80px; height: 58px; display: block; border-radius: 16px 16px 0 0; }
.card .nm { font-family: var(--font-display); font-weight: 900; font-size: 11px; line-height: 1.25; padding: 0 4px; text-align: center; height: 28px; display: flex; align-items: center; justify-content: center; }
.card .org { position: absolute; left: 5px; top: 5px; padding: 1px 6px; border-radius: 999px; font-family: var(--font-display); font-weight: 900; font-size: 9px; color: #fff; background: var(--oc, #2b9a98); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.card .ok { position: absolute; right: -4px; top: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--teal-deep); color: #fff; display: none; place-items: center; border: 2px solid var(--paper); }
.card .ok svg { width: 12px; height: 12px; }
.card.placed .ok { display: grid; }
.card.placed { opacity: .78; }
.card.sel { transform: translateY(-7px); box-shadow: 0 0 0 3px var(--teal), 0 0 18px rgba(127,233,224,.7), 0 12px 18px rgba(0,0,0,.3); opacity: 1; }
.card.full { opacity: .45; }
.card.cur { box-shadow: 0 0 0 3px var(--gold), 0 8px 16px rgba(0,0,0,.25); }
.foot { margin: 6px 16px 0; height: 52px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pill { height: 50px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.07); font-family: var(--font-display); font-weight: 900; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity .3s; }
.pill svg { width: 18px; height: 18px; }
.pill:disabled { opacity: .4; cursor: default; }
.pill.go { position: relative; border: 0; color: #2a1606; background: linear-gradient(100deg, #fff0cf, var(--gold) 45%, var(--gold-deep)); box-shadow: 0 8px 22px rgba(197,138,62,.35); }
.pill.go::before { content: ""; position: absolute; inset: -3px; border-radius: inherit; padding: 3px; background: conic-gradient(from var(--a, 0deg), var(--teal), #bff7ef, var(--gold), var(--pink), var(--teal)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

/* bubble menu over a placed thing */
.menu { position: absolute; z-index: 6; display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(8,30,40,.92); border: 1px solid rgba(127,233,224,.4); box-shadow: 0 10px 24px rgba(0,0,0,.35); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transform: translate(-50%, -100%) scale(.94); pointer-events: none; transition: opacity .22s, transform .22s; white-space: nowrap; }
.menu.show { opacity: 1; transform: translate(-50%, -100%); pointer-events: auto; }
.menu::after { content: ""; position: absolute; left: var(--ax, 50%); bottom: -7px; width: 12px; height: 12px; margin-left: -6px; background: rgba(8,30,40,.92); border-right: 1px solid rgba(127,233,224,.4); border-bottom: 1px solid rgba(127,233,224,.4); transform: rotate(45deg); }
.menu button { height: 44px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.08); font-family: var(--font-display); font-weight: 900; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.menu button svg { width: 16px; height: 16px; }
.menu button[hidden] { display: none; }
.menu .stow { color: #ffd9c2; }

/* book */
.veil { position: absolute; inset: 0; z-index: 8; background: rgba(3,12,18,.62); opacity: 0; pointer-events: none; transition: opacity .35s; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
.veil.show { opacity: 1; pointer-events: auto; }
.book { position: relative; width: 100%; max-width: 360px; transform: translateY(14px) scale(.97); transition: transform .4s; }
.veil.show .book { transform: none; }
.spread { position: relative; height: 250px; display: grid; grid-template-columns: 1fr 1fr; border-radius: 10px 14px 14px 10px; background: #8a5a33; padding: 6px; box-shadow: 0 24px 50px rgba(0,0,0,.5); perspective: 900px; }
.page { position: relative; background: linear-gradient(90deg, #f4e7cd, #fff8ea 18%, #fff8ea); color: #4a2f1c; padding: 16px 14px; font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.8; overflow: hidden; }
.page.L { border-radius: 6px 0 0 6px; background: linear-gradient(270deg, #e9d8b8, #fff8ea 16%, #fff8ea); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.page.R { border-radius: 0 8px 8px 0; }
.page .ttl { font-family: var(--font-pop); font-size: 15px; line-height: 1.5; color: #3a5f5c; }
.page .by { font-size: 11px; color: #9a7a58; }
.page img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.page .no { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 10px; color: #b39472; }
.page .orn { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #bff7ef, #2b9a98 60%, #19595c); box-shadow: 0 0 0 4px #f1e1c4, 0 0 0 5px #d8b98a; position: relative; }
.page .orn::after { content: ""; position: absolute; left: 50%; top: -10px; width: 8px; height: 84px; margin-left: -4px; border-radius: 50%; border: 2px solid #d9a94e; transform: rotate(12deg); }
.leaf { position: absolute; top: 6px; bottom: 6px; left: 50%; right: 6px; transform-origin: 0 50%; background: linear-gradient(90deg, #e6d4b2, #fff8ea 30%); border-radius: 0 8px 8px 0; opacity: 0; pointer-events: none; }
.leaf.turn { animation: turn .5s ease-in-out; }
@keyframes turn { 0% { opacity: 1; transform: rotateY(0); } 100% { opacity: 1; transform: rotateY(-180deg); } }
.bookbar { margin-top: 14px; display: grid; grid-template-columns: 52px 1fr 52px; gap: 10px; align-items: center; }
.round { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.08); display: grid; place-items: center; cursor: pointer; padding: 0; }
.round svg { width: 22px; height: 22px; }
.round:disabled { opacity: .35; }
.bookx { position: absolute; right: -6px; top: -58px; }
.send { margin-top: 14px; padding: 14px; border-radius: 20px; background: rgba(8,30,40,.92); border: 1px solid rgba(255,210,138,.32); display: none; }
.send.show { display: block; }
.send h3 { margin: 0 0 8px; font-family: var(--font-pop); font-weight: 400; font-size: 13px; letter-spacing: .08em; color: var(--gold); }
.send .dest { display: flex; gap: 8px; margin-bottom: 8px; }
.chip { height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-family: var(--font-display); font-weight: 900; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.chip.on { border-color: var(--teal); background: rgba(127,233,224,.16); color: #dffcf8; }
.send p { margin: 0 0 12px; font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--ink-dim); }
.send .btns { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; }

.toast { position: absolute; z-index: 9; left: 50%; top: 116px; transform: translate(-50%, -6px); width: max-content; max-width: calc(100% - 32px); padding: 11px 18px; border-radius: 22px; background: linear-gradient(90deg, rgba(43,154,152,.62), rgba(139,107,255,.5)); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-family: var(--font-display); font-weight: 900; font-size: 14px; text-align: center; opacity: 0; transition: opacity .45s, transform .45s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.fab button::before, .pill.go::before { animation: spin 6s linear infinite; }
@keyframes spin { to { --a: 360deg; } }
@media (prefers-reduced-motion: reduce) { .fab button, .fab button::before, .pill.go::before { animation: none; } .leaf.turn { animation: none; } .card { transition: opacity .3s; } }
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="cv" role="img" aria-label="ミナトの図書館。斜め上から見た部屋に、本棚、丸窓、ランプ、ぽんのクッション。作ったものを飾れる"></canvas>

  <header class="top">
    <button class="icon-btn" id="btnBack" aria-label="もどる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title"><div class="kicker">URANUS LIBRARY</div><div class="name" id="ttl">ミナトの図書館</div></div>
    <button class="icon-btn" id="btnShot" aria-label="部屋を撮る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.6"/></svg></button>
  </header>
  <div class="saved" id="saved" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>

  <div class="talk" id="talk" role="status"><div class="av"><img id="talkAv" alt=""></div><div><div class="who">たこ焼きブラザー</div><div class="line" id="talkLine"></div></div></div>

  <div class="hint" id="hint"><img id="hintImg" alt=""><span>作ったものを、図書館に飾れます</span></div>
  <div class="fab" id="fab"><button id="btnDeco" aria-label="図書館を飾る"><svg viewBox="0 0 40 40"><path d="M27.5 6.5c2-2 5.4.6 3.6 3.2L21 23l-4.2-4.1z" fill="#6b3d17"/><path d="M27.5 6.5c2-2 5.4.6 3.6 3.2L25 18" fill="none" stroke="#fff3d6" stroke-width="1.4" stroke-linecap="round" opacity=".7"/><path d="M16.2 19.4l4.4 4.3c-.6 4.4-4.6 7.8-10.6 6.8 2.2-1.6 1.6-4.2 2.4-6.6.7-2.1 2.2-3.8 3.8-4.5z" fill="#2b9a98"/><circle cx="11" cy="11" r="2.2" fill="#fff" opacity=".85"/><circle cx="31" cy="27" r="1.6" fill="#fff" opacity=".7"/></svg></button><span>図書館を飾る</span></div>

  <section class="sheet" id="sheet" aria-label="飾る引き出し">
    <div class="tabs" role="tablist">
      <button data-tab="made" class="on" role="tab">作ったもの</button>
      <button data-tab="deco" role="tab">かざり</button>
      <button data-tab="room" role="tab">へや</button>
    </div>
    <div class="tip" id="tip">カードを選ぶと、置ける場所が光ります</div>
    <div class="cards" id="cards"></div>
    <div class="foot">
      <button class="pill" id="btnUndo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4.5 11.5 9 16"/><path d="M5 11.5h9a5 5 0 010 10h-2"/></svg>ひとつ戻す</button>
      <button class="pill go" id="btnDone">できた</button>
    </div>
  </section>

  <div class="menu" id="menu">
    <button data-a="turn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0113.7-5.6L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 01-13.7 5.6"/></svg>向きを変える</button>
    <button data-a="size"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="11" height="11" rx="2"/><path d="M13 4h7v7"/><path d="M20 4l-6 6"/></svg>大きさ</button>
    <button data-a="stow" class="stow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16v11H4z"/><path d="M3 5h18v4H3z"/><path d="M10 13h4"/></svg>しまう</button>
  </div>

  <div class="veil" id="bookVeil" aria-hidden="true">
    <div class="book">
      <button class="round bookx" id="bkX" aria-label="とじる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="spread"><div class="page L" id="pgL"></div><div class="page R" id="pgR"></div><div class="leaf" id="leaf"></div></div>
      <div class="bookbar" id="bookbar">
