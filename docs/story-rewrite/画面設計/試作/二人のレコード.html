<title>二人のレコード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
<style>
/* Layout: a phone-height app — header (friend + view switch), the stage (record or chat), the composer. Saturn at night. */
:root {
  --night: #0c0d1f;
  --night-2: #16173a;
  --night-3: #1f2150;
  --ring: #f0c98b;
  --ring-deep: #b98a4a;
  --ink: #f6f1e8;
  --ink-dim: #a8a5c6;
  --me: #ff9a52;
  --friend: #79c2ff;
  --line: rgba(255,255,255,.09);
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
.app {
  height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; position: relative;
  background:
    radial-gradient(140% 55% at 50% -8%, rgba(240,201,139,.16), transparent 60%),
    radial-gradient(90% 40% at 50% 110%, rgba(121,194,255,.10), transparent 70%),
    var(--night);
}
.stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .55; }

/* header */
.top { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(12,13,31,.95), rgba(12,13,31,.7)); }
.back { width: 30px; height: 34px; border: 0; background: transparent; color: var(--ink-dim); font-size: 26px; line-height: 1; cursor: pointer; padding: 0; }
.who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; }
.who .av { width: 38px; height: 38px; flex: none; }
.who .name { font-family: var(--font-display); font-weight: 900; font-size: 1.02rem; letter-spacing: .02em; }
.who .meta { font-size: .7rem; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-grid; grid-auto-flow: column; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; position: relative; flex: none; }
.seg button { position: relative; z-index: 1; border: 0; background: transparent; color: var(--ink-dim); font-family: var(--font-display); font-weight: 700; font-size: .76rem; padding: 7px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--night); }
.seg .pill { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; width: 0; border-radius: 999px; background: linear-gradient(180deg, #ffe0a8, var(--ring)); box-shadow: 0 2px 10px rgba(240,201,139,.35); transition: left .32s cubic-bezier(.3,1.3,.5,1), width .32s; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* stage */
.stage { flex: 1; min-height: 0; position: relative; z-index: 1; }
.view { position: absolute; inset: 0; transition: opacity .35s ease, transform .35s ease; }
.view.off { opacity: 0; pointer-events: none; transform: scale(.98); visibility: hidden; }

/* record view */
.record-view { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); gap: 10px; }
.deck { position: relative; width: min(100% + 32px, 460px, 62vh); aspect-ratio: 1152 / 1140; max-width: calc(100% + 32px); flex: none; margin-inline: -16px; border-radius: 0 0 28px 28px; overflow: hidden; }
.deck::after { content: ""; position: absolute; inset: 0; background: radial-gradient(125% 95% at 50% 42%, transparent 60%, var(--night) 100%); pointer-events: none; }
.deck .cypher { z-index: 2; }
.deck canvas.disc { width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; display: block; }
.deck canvas.disc:active { cursor: grabbing; }
.deck .halo { position: absolute; left: -4%; right: -4%; top: 14%; bottom: -2%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240,201,139,.14), transparent 75%); pointer-events: none; }
.cypher { position: absolute; right: 18px; bottom: 16px; width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer; background: radial-gradient(circle at 35% 30%, #fff1d2, var(--ring) 45%, var(--ring-deep)); color: #2a1a08; font-family: var(--font-display); font-weight: 900; font-size: .66rem; line-height: 1.15; box-shadow: 0 6px 18px rgba(0,0,0,.45), 0 0 0 4px rgba(240,201,139,.16); display: grid; place-items: center; padding: 0; }
.cypher .ic { font-size: 22px; display: block; }
.cypher.on { background: radial-gradient(circle at 35% 30%, #ffdede, #ff8a8a 45%, #b84a4a); color: #2a0808; }
.now { width: 100%; max-width: 420px; min-height: 84px; display: flex; gap: 12px; align-items: center; padding: 10px 14px; box-sizing: border-box; border-radius: 20px; background: rgba(255,255,255,.045); border: 1px solid var(--line); }
.now .av { width: 50px; height: 50px; flex: none; }
.now .txt { min-width: 0; flex: 1; }
.now .line1 { font-size: .7rem; color: var(--ink-dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.now .body { font-size: 1rem; line-height: 1.55; overflow-wrap: anywhere; margin-top: 2px; }
.now.idle .body { color: var(--ink-dim); font-size: .82rem; }
.tag { display: inline-block; font-size: .64rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.tag.me { background: rgba(255,154,82,.18); color: var(--me); }
.tag.friend { background: rgba(121,194,255,.18); color: var(--friend); }
.tag.sing { background: rgba(240,201,139,.18); color: var(--ring); }
.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.eq i { width: 3px; height: 6px; background: var(--ring); border-radius: 2px; animation: eq .5s ease-in-out infinite alternate; }
.eq i:nth-child(2) { animation-delay: .15s; } .eq i:nth-child(3) { animation-delay: .3s; }
@keyframes eq { from { height: 3px; } to { height: 12px; } }
.hint { margin: 0; font-size: .68rem; color: var(--ink-dim); text-align: center; }

/* chat view */
.chat-view { overflow-y: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.flag { align-self: center; font-size: .7rem; color: var(--ring); background: rgba(240,201,139,.08); border: 1px solid rgba(240,201,139,.25); padding: 3px 12px 3px 24px; border-radius: 999px; position: relative; margin: 6px 0 2px; }
.flag::before { content: ""; position: absolute; left: 10px; top: 5px; width: 1.5px; height: 12px; background: var(--ring); }
.flag::after { content: ""; position: absolute; left: 11.5px; top: 5px; border-left: 7px solid var(--ring); border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; }
.msg { display: flex; align-items: flex-end; gap: 8px; max-width: 84%; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.msg .av { width: 50px; height: 50px; flex: none; border: 0; background: none; padding: 0; cursor: pointer; }
.bubble { position: relative; min-width: 0; padding: 9px 13px 8px; border-radius: 18px; font-size: .94rem; line-height: 1.55; overflow-wrap: anywhere; }
.msg.friend .bubble { background: var(--night-3); border-bottom-left-radius: 6px; }
.msg.me .bubble { background: linear-gradient(180deg, #ffb27a, var(--me)); color: #2a1406; border-bottom-right-radius: 6px; }
.bubble .time { display: block; font-size: .64rem; opacity: .65; margin-top: 2px; }
.bubble .sing { font-size: .68rem; font-weight: 700; margin-right: 4px; }
.msg.friend .bubble .sing { color: var(--ring); }
.msg.new .av { animation: rollin .95s cubic-bezier(.2,.8,.3,1.1) both; }
.msg.new .bubble { animation: pop .45s .6s both; }
@keyframes rollin { 0% { transform: translate(var(--from, -70px), -260px) rotate(-600deg); } 72% { transform: translate(0, 5px) rotate(12deg); } 100% { transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.85) translateY(6px); } to { opacity: 1; transform: none; } }

/* composer */
.composer { position: relative; z-index: 3; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: linear-gradient(0deg, rgba(12,13,31,.98), rgba(12,13,31,.82)); display: flex; flex-direction: column; gap: 8px; }
.modes { display: flex; align-items: center; gap: 8px; }
.modes .label { font-size: .7rem; color: var(--ink-dim); }
.modes .seg button { font-size: .72rem; padding: 6px 10px; }
.row { display: flex; gap: 8px; align-items: center; }
.row input { flex: 1; min-width: 0; font-family: var(--font-body); font-size: 1rem; color: var(--ink); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px; padding: 11px 15px; }
.row input::placeholder { color: var(--ink-dim); }
.mic, .send { flex: none; height: 44px; border-radius: 999px; border: 0; cursor: pointer; display: grid; place-items: center; }
.mic { width: 44px; background: rgba(255,255,255,.08); color: var(--ink); font-size: 19px; }
.send { width: 60px; background: radial-gradient(circle at 35% 30%, #fff1d2, var(--ring) 50%, var(--ring-deep)); color: #2a1a08; font-family: var(--font-display); font-weight: 900; font-size: .74rem; }
.toast { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); background: var(--night-3); border: 1px solid var(--line); color: var(--ink); font-size: .78rem; padding: 7px 12px; border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }
.fly { position: fixed; z-index: 9; width: 46px; height: 46px; pointer-events: none; }

/* kororin */
.k svg { width: 100%; height: 100%; display: block; overflow: visible; }
.k img { width: 100%; height: 100%; object-fit: contain; display: block; }
.k .ks { display: none; }
.k.playing .kn { display: none; }
.k.playing .ks { display: block; animation: bob .3s ease-in-out infinite alternate; transform-origin: 50% 95%; }
.k .shades, .k .mic-pick, .k .flakes, .k .ball { transform-box: fill-box; }
.k .shades { transition: transform .28s cubic-bezier(.3,1.7,.5,1); }
.k .mic-pick { opacity: 0; transition: opacity .2s; }
.k.playing .shades { transform: translateY(19px); }
.k.playing .mic-pick { opacity: 1; }
.k.playing .ball { animation: bob .3s ease-in-out infinite alternate; transform-origin: 50% 95%; }
.k.playing .flakes { animation: dance .26s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes bob { from { transform: scale(1,1); } to { transform: scale(1.06,.93); } }
@keyframes dance { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
.av.k.playing { filter: drop-shadow(0 0 10px rgba(240,201,139,.55)); }

@media (prefers-reduced-motion: reduce) {
  .k.playing .ks { animation: none; }
  .msg.new .av, .msg.new .bubble, .k.playing .ball, .k.playing .flakes, .eq i { animation: none; }
  .chat-view { scroll-behavior: auto; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="g-ball" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#f6c27e"/><stop offset=".55" stop-color="#d98d45"/><stop offset="1" stop-color="#9c5523"/></radialGradient>
    <radialGradient id="g-shadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-sauce" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b3418"/><stop offset="1" stop-color="#3f1d0c"/></linearGradient>
    <radialGradient id="g-vinyl" r=".5"><stop offset="0" stop-color="#1c1c2c"/><stop offset=".6" stop-color="#101019"/><stop offset="1" stop-color="#07070c"/></radialGradient>
    <radialGradient id="g-label" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe7b8"/><stop offset=".7" stop-color="#f0c98b"/><stop offset="1" stop-color="#c9954f"/></radialGradient>
    <linearGradient id="g-sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".42" stop-color="#fff" stop-opacity=".06"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset=".58" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
</svg>

<div class="app">
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

  <header class="top">
    <button class="back" aria-label="もどる">‹</button>
    <div class="who">
      <span class="av k" id="head-av"></span>
      <div style="min-width:0"><div class="name">ハル</div><div class="meta">二人のレコード ・ 見本</div></div>
    </div>
    <div class="seg" role="group" aria-label="見え方" id="view-seg">
      <span class="pill" aria-hidden="true"></span>
      <button id="v-record" aria-pressed="true">💿 レコード</button>
      <button id="v-chat" aria-pressed="false">💬 会話</button>
    </div>
  </header>

  <main class="stage">
    <section class="view record-view" id="record-view" aria-label="レコード">
      <div class="deck">
                <canvas class="disc" id="disc" role="img" aria-label="土星の神殿のターンテーブル。回るレコードの溝にコロリンが立って並ぶ。指で回せます。タップで再生"></canvas>
        <button class="cypher" id="cypher" aria-label="サイファー：順に再生"><span><span class="ic">🎤</span>サイファー</span></button>
      </div>
      <div class="now idle" id="now">
        <span class="av k" id="now-av"></span>
        <div class="txt"><div class="line1" id="now-line1">二人のレコード</div><div class="body" id="now-body">コロリンをタップすると、ここに字が出て、声で流れます。指で回して見返せます。</div></div>
      </div>
      <p class="hint">中心が一番古く、外側ほど新しい</p>
    </section>

    <section class="view chat-view off" id="chat-view" aria-label="会話"></section>
  </main>

  <footer class="composer">
    <div class="toast" id="toast" role="status"></div>
    <div class="modes">
      <span class="label">送り方</span>
      <div class="seg" role="group" aria-label="送り方" id="send-seg">
        <span class="pill" aria-hidden="true"></span>
        <button id="s-talk" aria-pressed="true">しゃべる</button>
        <button id="s-sing" aria-pressed="false">♪ 歌う</button>
      </div>
    </div>
    <form class="row" id="compose" autocomplete="off">
      <button type="button" class="mic" id="mic" aria-label="声で吹きこむ（試作では見本の言葉）">🎙</button>
      <label for="msg" hidden>送る言葉</label>
      <input id="msg" placeholder="字で送る（声を出せない時）" maxlength="60">
      <button class="send" type="submit">はじく</button>
    </form>
  </footer>
</div>

  function speak(m, withSound) {

  function draw(now) {
    if (!W) resize();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const a = angle * Math.PI / 180;
    if (art.stage.complete && art.stage.naturalWidth) ctx.drawImage(art.stage, 0, 0, IMG_W * F, IMG_H * F);
    // the record itself, drawn on the empty platter of the stage art
    ctx.save(); ctx.translate(DCX * F, DCY * F); ctx.scale(SX(), SY());
    ctx.beginPath(); ctx.arc(0, 3, R, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill();
    const vg = ctx.createRadialGradient(0, 0, 20, 0, 0, R); vg.addColorStop(0, '#22212c'); vg.addColorStop(.55, '#131219'); vg.addColorStop(1, '#09080d');
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fillStyle = vg; ctx.fill();
    for (let r = 78; r <= R - 4; r += 2.6) { ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.strokeStyle = `rgba(255,255,255,${Math.round(r * 10) % 3 === 0 ? .055 : .025})`; ctx.lineWidth = .9; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, R - 1, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(240,201,139,.35)'; ctx.lineWidth = 1.6; ctx.stroke();
    // the turning parts, in the plane of the record
    ctx.rotate(a);
    // light catching the grooves as they pass (turns with the disc)
    for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.arc(0, 0, 150 + k * 16, k * 2.1, k * 2.1 + .55);
      ctx.strokeStyle = `rgba(255,236,200,${.10 - k * .02})`; ctx.lineWidth = 6; ctx.stroke();
    }
    ctx.beginPath(); const last = spiralAt(msgs.length + 1).th;
    for (let th = 0; th <= last; th += .04) { const r = A + B * th; const x = r * Math.cos(th - Math.PI / 2), y = r * Math.sin(th - Math.PI / 2); th ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.setLineDash([2, 7]); ctx.strokeStyle = 'rgba(240,201,139,.32)'; ctx.lineWidth = 1.4; ctx.stroke(); ctx.setLineDash([]);
    if (art.label.complete && art.label.naturalWidth) {
      const L = 72;
      ctx.beginPath(); ctx.arc(0, 0, L + 2, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
      ctx.drawImage(art.label, -L, -L, 2 * L, 2 * L);
      ctx.fillStyle = '#3b2408'; ctx.textAlign = 'center'; ctx.font = `900 13px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillText('ミナト × ハル', 0, -30);
    }
    ctx.restore();
    // the light on the record stays where it is while the record turns
    ctx.save(); ctx.translate(DCX * F, DCY * F); ctx.scale(SX(), SY());
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.clip();
    const sh = ctx.createLinearGradient(-R, -R, R, R);
    sh.addColorStop(0, 'rgba(255,240,220,0)'); sh.addColorStop(.36, 'rgba(255,240,220,.05)'); sh.addColorStop(.47, 'rgba(255,240,220,.16)'); sh.addColorStop(.58, 'rgba(255,240,220,.04)'); sh.addColorStop(1, 'rgba(255,240,220,0)');
    ctx.fillStyle = sh; ctx.fillRect(-R, -R, 2 * R, 2 * R);
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fillStyle = '#d9d3e6'; ctx.fill();
    ctx.restore();
    // kororins standing in the groove, back ones first
    const list = []; let lastDay = '';
    msgs.forEach((m, i) => {
      const { th, r } = spiralAt(i); if (r > R - 10) return;
      const [x, y] = rot(r * Math.cos(th - Math.PI / 2), r * Math.sin(th - Math.PI / 2), a);
      const day = m.day !== lastDay ? m.day : ''; lastDay = m.day;
      list.push({ i, m, x, y, day });
    });
    list.sort((p, q) => p.y - q.y);
    hits = [];
    for (const it of list) {
      const [sx, sy] = P(it.x, it.y);
      const depth = 1 + 0.14 * (it.y / R);
      let size = 118 * F * depth, lift = 0;
      const isPlaying = it.i === playing;
      if (isPlaying && !reduce) { const k = Math.sin(now / 95); size *= 1 + .05 * k; lift = 6 * F * Math.abs(k); }
      if (it.i === fresh) { const t = Math.min(1, (now - freshAt) / 700); lift += (1 - t) * (1 - t) * 260 * F; if (t >= 1) fresh = -1; }
      ctx.beginPath(); ctx.ellipse(sx, sy, size * .36, size * .36 * .42, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.fill();
      if (isPlaying) { ctx.beginPath(); ctx.ellipse(sx, sy, size * .6, size * .6 * .42, 0, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,214,150,.85)'; ctx.lineWidth = 2.2; ctx.stroke(); }
      const pic = art[it.m.who + (isPlaying ? '-s' : '')];
      if (pic && pic.complete && pic.naturalWidth) {
        const h = size, w = size * pic.naturalWidth / pic.naturalHeight, top = sy - h * .92 - lift;
        ctx.drawImage(pic, sx - w / 2, top, w, h);
        if (it.day) { ctx.font = `700 ${Math.max(10, 24 * F)}px sans-serif`; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(12,13,31,.8)'; ctx.strokeText(it.day, sx, top - 4); ctx.fillStyle = '#f0c98b'; ctx.fillText(it.day, sx, top - 4); }
        hits.push({ i: it.i, x0: sx - w / 2, x1: sx + w / 2, y0: top, y1: sy + 6 });
      }
    }
    // tonearm: turns on its pivot toward the kororin that is singing, rests at the side otherwise
    if (art.arm.complete && art.arm.naturalWidth) {
      let tx = ARM_REST[0], ty = ARM_REST[1];
      if (playing >= 0) { const { th, r } = spiralAt(playing); const [x, y] = rot(r * Math.cos(th - Math.PI / 2), r * Math.sin(th - Math.PI / 2), a); tx = DCX + x * DRX / R; ty = DCY + y * DRY / R; }
      const want = Math.atan2(ty - ARM_PIVOT[1], tx - ARM_PIVOT[0]);
      if (armAng == null || reduce) armAng = want; else { let d = want - armAng; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; armAng += d * .08; }
      const base = Math.atan2(ARM_H[1] - ARM_B[1], ARM_H[0] - ARM_B[0]);
      const s = ARM_LEN / Math.hypot(ARM_H[0] - ARM_B[0], ARM_H[1] - ARM_B[1]) * F;
      ctx.save(); ctx.translate(ARM_PIVOT[0] * F, ARM_PIVOT[1] * F);
      ctx.save(); ctx.translate(6 * F, 14 * F); ctx.rotate(armAng - base); ctx.scale(s, s); ctx.globalAlpha = .3; ctx.filter = 'brightness(0) blur(3px)'; ctx.drawImage(art.arm, -ARM_B[0], -ARM_B[1]); ctx.restore();
      ctx.rotate(armAng - base); ctx.scale(s, s); ctx.drawImage(art.arm, -ARM_B[0], -ARM_B[1]);
      ctx.restore();
    }
  }
  function tick(t) {
    const dt = lastT ? Math.min(.05, (t - lastT) / 1000) : 0; lastT = t;
    if (view === 'record') {
      if (!dragging) {
        const target = playing >= 0 ? SPIN * .35 : SPIN;   // slows while a kororin sings, so its words are easy to follow
        vel += (target - vel) * Math.min(1, dt * 1.4);
        angle = (angle + vel * dt) % 360;
      }
      draw(t);
    }
    requestAnimationFrame(tick);
  }
  function planeAngle(e) { const r = cvs.getBoundingClientRect(); const x = (e.clientX - r.left - DCX * F) / SX(), y = (e.clientY - r.top - DCY * F) / SY(); return Math.atan2(y, x) * 180 / Math.PI; }
  cvs.addEventListener('pointerdown', (e) => { dragging = true; moved = 0; lastA = planeAngle(e); cvs.setPointerCapture(e.pointerId); });
  cvs.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const a2 = planeAngle(e); let d = a2 - lastA; if (d > 180) d -= 360; if (d < -180) d += 360;
    moved += Math.abs(d); angle += d; lastA = a2; vel = Math.max(-240, Math.min(240, d * 40));
  });
  cvs.addEventListener('pointerup', (e) => {
    dragging = false;
    if (moved < 6) {
      const r = cvs.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
      for (let k = hits.length - 1; k >= 0; k--) { const h = hits[k]; if (x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1) { stopAll(); play(h.i); break; } }
    }
  });
  cvs.addEventListener('pointercancel', () => { dragging = false; });
  addEventListener('resize', resize);

  // now-playing card
  const now = document.getElementById('now'), nowAv = document.getElementById('now-av'), nowL1 = document.getElementById('now-line1'), nowBody = document.getElementById('now-body');
  function showNow(i, live) {
    const m = msgs[i];
    now.classList.remove('idle');
    nowAv.innerHTML = koro(m.who); nowAv.dataset.i = i; nowAv.classList.toggle('playing', !!live);
    nowL1.innerHTML = `<span class="tag ${m.who}">${NAMES[m.who]}</span>${m.sing ? '<span class="tag sing">♪ 歌</span>' : ''}<span>${m.day} ${m.t}</span>${live ? '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>' : ''}`;
    nowBody.textContent = m.text;
  }

  // ---------- cypher ----------
  const cypherBtn = document.getElementById('cypher');
  cypherBtn.addEventListener('click', async () => {
    if (cypherBtn.classList.contains('on')) { stopAll(); return; }
    stopAll();
    const tok = ++playTok; cypherBtn.classList.add('on'); cypherBtn.setAttribute('aria-label', 'サイファーを止める');
    for (let i = msgs.length - 1; i >= 0; i--) {   // newest first: the outer groove toward the centre, like a real record
      if (tok !== playTok) return;
      await play(i);
      await new Promise((r) => setTimeout(r, 220));
    }
    if (tok === playTok) stopAll();
  });

  // ---------- chat ----------
  const chat = document.getElementById('chat-view');
  function buildChat(fresh) {
    chat.innerHTML = '';
    let lastDay = '';
    msgs.forEach((m, i) => {
      if (m.day !== lastDay) { lastDay = m.day; const f = document.createElement('div'); f.className = 'flag'; f.textContent = m.day; chat.appendChild(f); }
      const row = document.createElement('div');
      row.className = `msg ${m.who}${i === fresh ? ' new' : ''}`;
      if (m.who === 'me') row.style.setProperty('--from', '70px');
      const av = document.createElement('button');
      av.className = 'av k'; av.dataset.i = i; av.setAttribute('aria-label', `${NAMES[m.who]}のコロリンを再生：${m.text}`);
      av.innerHTML = koro(m.who);
      av.addEventListener('click', () => { stopAll(); play(i, true); });   // 会話: a tap on a kororin plays its voice
      const b = document.createElement('div'); b.className = 'bubble';
      b.innerHTML = `${m.sing ? '<span class="sing">♪歌</span>' : ''}${esc(m.text)}<span class="time">${m.t}</span>`;
      row.append(av, b); chat.appendChild(row);
    });
    chat.scrollTop = chat.scrollHeight;
  }

  // ---------- switches ----------
  function placePill(seg) {
    const on = seg.querySelector('button[aria-pressed="true"]'), pill = seg.querySelector('.pill');
    if (on && pill) { pill.style.left = on.offsetLeft + 'px'; pill.style.width = on.offsetWidth + 'px'; }
  }
  const vRec = document.getElementById('v-record'), vChat = document.getElementById('v-chat');
  function setView(v, save = true) {
    view = v; stopAll();
    vRec.setAttribute('aria-pressed', v === 'record'); vChat.setAttribute('aria-pressed', v === 'chat');
    document.getElementById('record-view').classList.toggle('off', v !== 'record');
    document.getElementById('chat-view').classList.toggle('off', v !== 'chat');
    placePill(document.getElementById('view-seg'));
    if (v === 'chat') buildChat(); else buildDisc();
    if (save) try { localStorage.setItem('futari-view', v); } catch (e) {}
  }
  vRec.addEventListener('click', () => setView('record'));
  vChat.addEventListener('click', () => setView('chat'));
  const sTalk = document.getElementById('s-talk'), sSing = document.getElementById('s-sing');
  function setSend(sing) { sendSing = sing; sTalk.setAttribute('aria-pressed', !sing); sSing.setAttribute('aria-pressed', sing); placePill(document.getElementById('send-seg')); }
  sTalk.addEventListener('click', () => setSend(false));
  sSing.addEventListener('click', () => setSend(true));

  // ---------- send ----------
  const toast = document.getElementById('toast');
  function say(t) { toast.textContent = t; toast.classList.add('show'); clearTimeout(say.h); say.h = setTimeout(() => toast.classList.remove('show'), 1800); }
  const samples = ['今日の夕焼けやばい', 'ねむすぎる', '明日もクレープ行く？', '宿題おわった！'];
  let sampleIdx = 0;
  document.getElementById('mic').addEventListener('click', () => {
    document.getElementById('msg').value = samples[sampleIdx++ % samples.length];
    say('（試作）声のかわりに見本の言葉を入れました');
  });
  const replies = ['それな', 'わかる〜', 'ウケる', 'まじで？', '最高じゃん', 'いいね！'];
  let replyIdx = 0;
  function flyFrom(btn) {
    if (reduce || !btn) return;
    const r = btn.getBoundingClientRect(); const f = document.createElement('div'); f.className = 'fly k'; f.innerHTML = koro('me');
    f.style.left = (r.left + r.width / 2 - 23) + 'px'; f.style.top = (r.top - 10) + 'px'; document.body.appendChild(f);
    f.animate([{ transform: 'translateY(0) rotate(0deg)', opacity: 1 }, { transform: 'translateY(-260px) rotate(-540deg) scale(.6)', opacity: 0 }], { duration: 650, easing: 'cubic-bezier(.3,.6,.4,1)' }).onfinish = () => f.remove();
  }
  document.getElementById('compose').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('msg'); const text = input.value.trim();
    if (!text) { say('言葉を入れるか、🎙で吹きこんでね'); return; }
    input.value = ''; stopAll();
    flyFrom(document.querySelector('.send'));
    const d = new Date(), t = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    msgs.push({ who: 'me', text, day: '今日', t, sing: sendSing });
    const i = msgs.length - 1;
    setTimeout(() => {
      if (view === 'chat') buildChat(i); else { buildDisc(i); setTimeout(() => play(i), 500); }
      say(sendSing ? '♪ 歌うコロリンをはじいた' : 'コロリンをはじいた');
    }, reduce ? 0 : 420);
    setTimeout(() => {
      msgs.push({ who: 'friend', text: replies[replyIdx++ % replies.length], day: '今日', t });
      const j = msgs.length - 1;
      if (view === 'chat') buildChat(j); else buildDisc(j);
    }, 3600);
  });

  function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // ---------- stars ----------
  const cv = document.getElementById('stars');
  function drawStars() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    if (!r.width) return;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 90; i++) { c.fillStyle = `rgba(255,255,255,${.15 + rnd() * .5})`; c.beginPath(); c.arc(rnd() * r.width, rnd() * r.height, rnd() * 1.2 + .2, 0, 6.3); c.fill(); }
  }
  addEventListener('resize', () => { drawStars(); placePill(document.getElementById('view-seg')); placePill(document.getElementById('send-seg')); });

  // ---------- start ----------
  document.getElementById('head-av').innerHTML = koro('friend');
  nowAv.innerHTML = koro('friend');
  drawStars();
  let start = 'record';
  try { start = localStorage.getItem('futari-view') === 'chat' ? 'chat' : 'record'; } catch (e) {}
  setView(start, false);
  setSend(false);
  requestAnimationFrame(() => { placePill(document.getElementById('view-seg')); placePill(document.getElementById('send-seg')); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placePill(document.getElementById('view-seg')); placePill(document.getElementById('send-seg')); });
  requestAnimationFrame(tick);
})();
</script>
