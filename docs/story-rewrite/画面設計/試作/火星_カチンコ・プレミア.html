<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カチンコ・プレミア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* Mars X-7 建てる → X-6 大画面 → X-5 とばす → X-1 星図, one canvas stage. Same look as the Mercury / Venus / Saturn prototypes. */
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
:root {
  --night: #120c24;
  --violet: #2b2146;
  --terra: #e0703f;
  --terra-deep: #a8442a;
  --teal: #3fb7b0;
  --teal-hi: #5fe6d8;
  --cream: #f3e3c3;
  --gold: #ffcf8a;
  --pink: #ff6fb5;
  --cyan: #4fe3ff;
  --ink: #fbf5ff;
  --ink-dim: #d6cbe6;
  --line: rgba(255,255,255,.15);
  --font-pop: "Dela Gothic One", "Zen Maru Gothic", "Hiragino Sans", sans-serif;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
.app { height: 100%; max-width: 460px; margin: 0 auto; position: relative; background: var(--night); overflow: hidden; isolation: isolate; user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 0; }

/* header: transparent glass */
.top { position: absolute; z-index: 6; top: 0; left: 0; right: 0; height: calc(56px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 12px 0; display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg, rgba(18,12,36,.62), rgba(18,12,36,.22) 70%, rgba(18,12,36,0)); }
.top::after { content: ""; position: absolute; inset: 0; z-index: -1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); mask: linear-gradient(#000 55%, transparent); -webkit-mask: linear-gradient(#000 55%, transparent); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.08); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.title { text-align: left; line-height: 1.1; pointer-events: none; margin-left: 2px; }
.title .kicker { font-family: var(--font-pop); font-size: 11px; letter-spacing: .34em; color: var(--teal-hi); padding-left: .34em; }
.title .name { font-family: var(--font-pop); font-size: 20px; letter-spacing: .1em; background: linear-gradient(90deg, var(--gold), #fff 55%, #ffc2a0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.spacer { flex: 1; }
.place { height: 30px; padding: 0 12px 0 8px; border-radius: 999px; border: 1px solid rgba(255,207,138,.4); background: rgba(255,207,138,.1); display: flex; align-items: center; gap: 5px; font-family: var(--font-display); font-weight: 900; font-size: 12px; flex: none; transition: box-shadow 1.2s, background 1.2s; white-space: nowrap; }
.place svg { width: 18px; height: 18px; }
.place.glow { background: rgba(255,207,138,.22); box-shadow: 0 0 18px rgba(255,207,138,.45); }
.snd[aria-pressed="true"] { border-color: rgba(95,230,216,.6); background: rgba(95,230,216,.14); }

/* resident line */
.talk { position: absolute; z-index: 9; top: calc(64px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; padding: 8px 34px 8px 8px; min-height: 60px; border-radius: 22px; background: rgba(28,18,52,.78); border: 1px solid rgba(255,207,138,.3); box-shadow: 0 10px 30px rgba(0,0,0,.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); opacity: 0; transform: translateY(-8px); transition: opacity .35s, transform .35s; pointer-events: none; cursor: pointer; }
.talk.show { opacity: 1; transform: none; pointer-events: auto; }
.talk .av { width: 44px; height: 44px; border-radius: 50%; flex: none; background: radial-gradient(circle at 50% 35%, rgba(224,112,63,.4), rgba(255,255,255,.05)); display: grid; place-items: center; overflow: hidden; border: 1.5px solid rgba(255,207,138,.55); font-family: var(--font-pop); font-size: 16px; }
.talk .av img { width: 100%; height: 100%; object-fit: cover; }
.talk .av img.bati { object-position: 50% 18%; transform: scale(1.5); transform-origin: 50% 20%; }
.talk .who { font-family: var(--font-pop); font-size: 11px; letter-spacing: .12em; color: var(--gold); }
.talk .line { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.5; }
.talk .more { position: absolute; right: 14px; bottom: 9px; font-size: 11px; color: var(--gold); animation: bob 1.4s ease-in-out infinite; }
.talk.nomore .more { display: none; }
@keyframes bob { 50% { transform: translateY(3px); } }

/* one guide line (〔画面〕) */
.guide { position: absolute; z-index: 4; left: 14px; right: 14px; bottom: var(--gb, 230px); text-align: center; pointer-events: none; opacity: 0; transform: translateY(6px); transition: opacity .45s, transform .45s, bottom .45s; }
.guide.show { opacity: 1; transform: none; }
.guide.top { bottom: auto; top: calc(66px + env(safe-area-inset-top, 0px)); }
.guide span { display: inline-block; max-width: 100%; padding: 8px 14px; border-radius: 18px; font-family: var(--font-display); font-weight: 900; font-size: 13px; line-height: 1.55; background: rgba(28,18,52,.72); border: 1px solid rgba(95,230,216,.32); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.guide b { color: var(--gold); font-weight: 900; }
.guide svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 2px; }

.telop { position: absolute; z-index: 4; left: 12px; right: 12px; top: 21%; text-align: center; pointer-events: none; font-family: var(--font-pop); font-size: 24px; line-height: 1.45; letter-spacing: .05em; }
.telop.small { font-size: 18px; top: calc(68px + env(safe-area-inset-top, 0px)); }
.telop .ch { display: inline-block; opacity: 0; transform: translateY(14px); background: linear-gradient(180deg, #fff 20%, var(--gold) 85%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 10px rgba(18,8,30,.9)) drop-shadow(0 0 14px rgba(255,170,100,.35)); transition: opacity .5s, transform .6s cubic-bezier(.2,.9,.3,1.2); }
.telop .ch.on { opacity: 1; transform: none; }
.telop.out .ch { opacity: 0; transition: opacity 1.2s; }

.toast { position: absolute; z-index: 12; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.96); width: max-content; max-width: calc(100% - 40px); padding: 12px 20px; border-radius: 22px; text-align: center; background: linear-gradient(90deg, rgba(63,183,176,.38), rgba(224,112,63,.38)); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-family: var(--font-display); font-weight: 900; font-size: 14px; line-height: 1.5; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, -50%); }

/* the vault door label over the canvas */
.vault { position: absolute; z-index: 3; width: 64px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0; pointer-events: none; transition: opacity .6s; }
.vault.show { opacity: 1; pointer-events: auto; }
.vault .hit { width: 52px; height: 52px; border-radius: 50%; }
.vault .lbl { display: flex; align-items: center; gap: 3px; height: 24px; padding: 0 8px 0 6px; border-radius: 999px; background: rgba(28,18,52,.78); border: 1px solid rgba(255,207,138,.45); font-family: var(--font-display); font-weight: 900; font-size: 11px; white-space: nowrap; }
.vault .lbl svg { width: 13px; height: 13px; }

/* dock: one control panel per moment */
.dock { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.dock::before { content: ""; position: absolute; inset: -56px 0 0; background: linear-gradient(180deg, rgba(18,12,36,0), rgba(18,12,36,.7) 30%, rgba(14,9,28,.95) 62%); z-index: -1; opacity: 0; transition: opacity .5s; }
.dock.on::before { opacity: 1; }
.panel { position: absolute; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(24px); transition: opacity .4s, transform .45s cubic-bezier(.2,.8,.25,1); pointer-events: none; }
.panel.show { opacity: 1; transform: none; pointer-events: auto; }

/* ask */
.ask-row { position: relative; width: 100%; height: 150px; display: flex; align-items: center; justify-content: center; }
.mic { position: relative; width: 96px; height: 96px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: #2a1206; background: radial-gradient(circle at 35% 30%, #fff6e6, var(--gold) 45%, var(--terra)); box-shadow: 0 12px 30px rgba(224,112,63,.45), inset 0 1px 0 rgba(255,255,255,.8); }
.mic svg { width: 40px; height: 40px; }
.mic .ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(255,207,138,.7); opacity: 0; pointer-events: none; }
.mic.listen .ring { animation: ring 1.4s ease-out infinite; }
.mic.listen .ring:nth-child(2) { animation-delay: .45s; }
.mic.listen .ring:nth-child(3) { animation-delay: .9s; }
@keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
.mic-l { margin-top: 2px; font-family: var(--font-display); font-weight: 900; font-size: 15px; }
.ask-col { display: flex; flex-direction: column; align-items: center; }
.kbd { position: absolute; right: 0; bottom: 4px; }
.omakase { position: absolute; left: 0; bottom: 4px; }
.said { position: absolute; z-index: 6; right: 16px; max-width: 78%; bottom: var(--sb, 230px); padding: 10px 14px; border-radius: 18px 18px 6px 18px; background: rgba(243,227,195,.94); color: #2a1a30; font-family: var(--font-display); font-weight: 900; font-size: 15px; line-height: 1.5; opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s; pointer-events: none; }
.said.show { opacity: 1; transform: none; }
.said small { display: block; font-size: 11px; color: #7a5a4a; font-weight: 700; }

/* cards */
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }
.card-b { position: relative; height: 44px; padding: 0 11px; border-radius: 14px; border: 1px solid rgba(243,227,195,.5); background: linear-gradient(180deg, rgba(243,227,195,.2), rgba(243,227,195,.07)); font-family: var(--font-display); font-weight: 900; font-size: 13px; cursor: pointer; opacity: 0; transform: translateY(18px) rotate(-4deg) scale(.9); transition: opacity .3s, transform .45s cubic-bezier(.2,1.4,.4,1), background .3s, box-shadow .3s; box-shadow: 0 6px 14px rgba(0,0,0,.25); white-space: nowrap; }
.card-b.in { opacity: 1; transform: none; }
.card-b::before { content: ""; position: absolute; left: 6px; top: 50%; width: 4px; height: 18px; margin-top: -9px; border-radius: 2px; background: var(--terra); }
.card-b { padding-left: 16px; }
.cards-note { margin: 0 0 10px; padding: 8px 12px; border-radius: 16px; background: rgba(28,18,52,.6); border: 1px solid rgba(95,230,216,.28); font-family: var(--font-display); font-weight: 900; font-size: 12px; line-height: 1.55; text-align: center; }
.card-b.flip { animation: flip .38s cubic-bezier(.2,1.4,.4,1); }
@keyframes flip { 0% { transform: scale(.9); } 55% { transform: scale(1.06); } 100% { transform: none; } }
.card-b.new { border-color: rgba(255,111,181,.7); box-shadow: 0 0 16px rgba(255,111,181,.35); }
.caption { margin-top: 8px; font-family: var(--font-display); font-weight: 700; font-size: 11px; color: var(--ink-dim); text-align: center; }
.row2 { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
.pill { height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.08); font-family: var(--font-display); font-weight: 900; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.pill svg { width: 20px; height: 20px; }
.pill.small { height: 44px; font-size: 13px; padding: 0 14px; }
.pill.go { width: 100%; height: 56px; border: 0; color: #2a1206; font-family: var(--font-pop); font-weight: 400; font-size: 17px; letter-spacing: .08em; background: linear-gradient(100deg, #fff3e0, var(--gold) 45%, var(--terra)); box-shadow: 0 8px 22px rgba(224,112,63,.38); }

/* clap */
.chips { position: absolute; z-index: 4; left: 14px; right: 14px; top: calc(134px + env(safe-area-inset-top, 0px)); display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; opacity: 0; transform: translateY(-6px); transition: opacity .4s, transform .4s; pointer-events: none; }
.chips.show { opacity: 1; transform: none; }
.chip { height: 24px; padding: 0 9px; border-radius: 8px; display: inline-flex; align-items: center; background: rgba(40,26,70,.72); border: 1px solid rgba(243,227,195,.3); font-family: var(--font-display); font-weight: 900; font-size: 11px; white-space: nowrap; }
.clap-wrap { position: relative; width: 100%; height: 196px; display: flex; justify-content: center; }
#clap { width: 270px; height: 196px; touch-action: none; cursor: grab; }
.clap-hint { position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%); font-family: var(--font-display); font-weight: 900; font-size: 12px; color: var(--gold); white-space: nowrap; pointer-events: none; transition: opacity .3s; }
.redo { position: absolute; left: 0; top: 30px; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; padding: 0; cursor: pointer; font-family: var(--font-display); font-weight: 900; font-size: 11px; color: var(--ink-dim); }
.redo .c { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,207,138,.45); background: rgba(255,207,138,.12); color: var(--gold); }
.redo .c svg { width: 24px; height: 24px; }
.redo.listen .c { box-shadow: 0 0 0 6px rgba(255,207,138,.18); }

/* send */
.rainbow { position: relative; isolation: isolate; }
.rainbow::before { content: ""; position: absolute; inset: -3px; border-radius: inherit; padding: 3px; background: conic-gradient(from var(--a), var(--pink), var(--cyan), var(--teal), var(--gold), var(--pink)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 4s linear infinite; z-index: -1; }
@keyframes spin { to { --a: 360deg; } }
.cta { width: min(310px, 100%); height: 56px; border-radius: 999px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; color: #2a1206; font-family: var(--font-pop); font-size: 18px; letter-spacing: .08em; background: linear-gradient(100deg, #fff3e0, var(--gold) 45%, var(--terra)); box-shadow: 0 10px 26px rgba(224,112,63,.4), inset 0 1px 0 rgba(255,255,255,.75); transition: filter .3s, transform .2s; }
.cta svg { width: 30px; height: 30px; }
.cta:active { transform: scale(.97); }
.cta.breathe { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.07); box-shadow: 0 10px 34px rgba(255,190,120,.55), inset 0 1px 0 rgba(255,255,255,.75); } }
.cta-sub { margin-top: 6px; font-family: var(--font-display); font-weight: 900; font-size: 12px; color: var(--ink-dim); display: flex; align-items: center; gap: 4px; }
.cta-sub svg { width: 14px; height: 14px; }
.keep { margin-top: 4px; border: 0; background: none; height: 44px; padding: 0 12px; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--ink-dim); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(255,255,255,.3); }

/* bottom nav (星図) */
.nav { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: calc(78px + env(safe-area-inset-bottom, 0px)); padding: 0 16px env(safe-area-inset-bottom, 0px); transition: transform .45s, opacity .45s; }
.nav::before { content: ""; position: absolute; inset: -40px 0 0; background: linear-gradient(180deg, rgba(18,12,36,0), rgba(18,12,36,.75) 40%, rgba(12,8,26,.96)); z-index: -1; pointer-events: none; }
.nav.hide { transform: translateY(30px); opacity: 0; pointer-events: none; }
.row { display: grid; grid-template-columns: repeat(3, 1fr); height: 70px; }
.tab { justify-self: center; width: 100px; min-height: 60px; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0; font-family: var(--font-display); font-weight: 900; font-size: 12px; color: var(--ink-dim); position: relative; }
.tab .ico { width: 38px; height: 38px; display: grid; place-items: center; transition: transform .25s; }
.tab .ico img, .tab .ico svg { width: 38px; height: 38px; object-fit: contain; }
.tab.on { color: var(--ink); }
.tab.on .ico { transform: scale(1.12); }
.tab.on::after { content: ""; position: absolute; bottom: -2px; width: 22px; height: 3px; border-radius: 3px; background: var(--gold); box-shadow: 0 0 10px var(--gold); }

/* sheets */
.veil { position: absolute; inset: 0; z-index: 8; background: linear-gradient(180deg, rgba(10,6,22,0) 25%, rgba(10,6,22,.5)); opacity: 0; pointer-events: none; transition: opacity .35s; display: flex; align-items: flex-end; justify-content: center; }
.veil.show { opacity: 1; pointer-events: auto; }
.veil.center { align-items: center; padding: 16px; background: rgba(10,6,22,.45); }
.sheet { width: 100%; max-width: 460px; border-radius: 28px 28px 0 0; padding: 8px 18px calc(18px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, rgba(48,32,84,.96), rgba(20,13,40,.98)); border: 1px solid rgba(255,207,138,.32); border-bottom: 0; box-shadow: 0 -20px 50px rgba(0,0,0,.45); transform: translateY(105%); transition: transform .42s cubic-bezier(.2,.8,.25,1); position: relative; }
.veil.show .sheet { transform: none; }
.handle { display: block; width: 100%; height: 26px; border: 0; background: none; padding: 0; }
.handle::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.28); margin: 6px auto 0; }
.card { width: 100%; max-width: 360px; border-radius: 26px; padding: 22px 20px 18px; text-align: center; background: linear-gradient(180deg, rgba(52,34,90,.96), rgba(22,14,44,.97)); border: 1px solid rgba(255,207,138,.34); box-shadow: 0 20px 50px rgba(0,0,0,.45); transform: translateY(14px); transition: transform .35s; }
.veil.show .card { transform: none; }
.card h3, .sheet h3 { margin: 0 0 8px; font-family: var(--font-pop); font-weight: 400; font-size: 17px; letter-spacing: .06em; color: var(--gold); display: flex; align-items: center; gap: 6px; }
.card h3 { justify-content: center; }
.card p { margin: 0 0 16px; font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.65; }
.card .phones { width: 76px; height: 76px; margin: 0 auto 8px; display: block; }

/* X-5 send sheet */
.c-top { display: flex; align-items: center; }
.c-top h3 { margin: 0; flex: 1; }
.c-top h3 svg { width: 26px; height: 26px; }
.quit { height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-family: var(--font-display); font-weight: 900; font-size: 13px; cursor: pointer; color: var(--ink-dim); }
.c-mv { display: flex; gap: 12px; align-items: center; margin: 12px 0 14px; }
.c-mv canvas { width: 128px; height: 72px; border-radius: 10px; border: 2px solid rgba(255,207,138,.5); flex: none; background: #0c0818; }
.c-mv .t { font-family: var(--font-pop); font-size: 16px; line-height: 1.35; }
.c-mv .by { font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
.dest-l { font-family: var(--font-display); font-weight: 900; font-size: 12px; color: var(--ink-dim); margin: 0 0 6px 2px; }
.dest { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 12px; border-radius: 18px; border: 1.5px solid rgba(255,207,138,.6); background: rgba(255,207,138,.1); }
.dest .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--gold); display: grid; place-items: center; flex: none; }
.dest .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); }
.dest .lbl { font-family: var(--font-display); font-weight: 900; font-size: 16px; }
.faces { display: flex; align-items: center; gap: 6px; margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 12px; }
.faces .fa { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; font-family: var(--font-pop); font-size: 13px; border: 1.5px solid rgba(255,255,255,.5); }
.faces .fa img { width: 100%; height: 100%; object-fit: cover; }
.c-note { margin: 12px 2px 14px; font-family: var(--font-display); font-weight: 700; font-size: 13px; line-height: 1.6; color: var(--ink-dim); }
.fly-btn { width: 100%; height: 64px; border-radius: 999px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; color: #2a1206; font-family: var(--font-pop); font-size: 20px; letter-spacing: .12em; background: linear-gradient(100deg, #fff3e0, var(--gold) 45%, var(--terra)); box-shadow: 0 10px 26px rgba(224,112,63,.4); }
.fly-btn svg { width: 34px; height: 34px; }

/* X-2 player */
.p-head { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.p-av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-pop); font-size: 16px; color: #fff; flex: none; overflow: hidden; border: 1.5px solid rgba(255,207,138,.55); }
.p-av img { width: 100%; height: 100%; object-fit: cover; }
.p-name { font-family: var(--font-display); font-weight: 900; font-size: 16px; line-height: 1.3; word-break: break-all; }
.badge { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px 0 6px; border-radius: 999px; background: rgba(255,207,138,.14); border: 1px solid rgba(255,207,138,.4); color: var(--gold); font-family: var(--font-display); font-weight: 900; font-size: 11px; margin-left: 6px; vertical-align: 2px; }
.badge svg { width: 13px; height: 13px; }
.holo-wrap { position: relative; margin: 6px auto 8px; width: 100%; max-width: 350px; }
.holo { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; background: #07050f; box-shadow: 0 0 0 1.5px rgba(95,230,216,.45), 0 0 26px rgba(95,230,216,.18); }
.holo-play { position: absolute; right: 10px; bottom: 10px; width: 56px; height: 56px; border-radius: 50%; border: 0; display: grid; place-items: center; color: #2a1206; background: radial-gradient(circle at 35% 30%, #fff6e6, var(--gold) 50%, var(--terra)); cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.4); transition: opacity .3s; }
.holo-play svg { width: 26px; height: 26px; }
.holo-play.hide { opacity: 0; pointer-events: none; }
.p-title { font-family: var(--font-pop); font-size: 20px; letter-spacing: .04em; line-height: 1.3; margin: 2px 0 0; text-align: center; }
.p-lyric { text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--ink-dim); min-height: 21px; }
.ctrl { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 6px 0 8px; }
.cbtn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.07); display: grid; place-items: center; cursor: pointer; }
.cbtn svg { width: 24px; height: 24px; }
.cbtn[aria-disabled="true"] { opacity: .35; cursor: default; }
.play { width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: #2a1206; background: radial-gradient(circle at 35% 30%, #fff6e6, var(--gold) 50%, var(--terra)); box-shadow: 0 8px 22px rgba(224,112,63,.4); }
.play svg { width: 32px; height: 32px; }
.p-foot { display: flex; gap: 10px; }
.p-foot .pill { flex: 1; white-space: nowrap; }
.p-foot #p-studio { flex: 1.7; }
.p-foot .more-b { flex: none; width: 48px; padding: 0; }
.menu { position: absolute; z-index: 10; right: 16px; display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 20px; background: rgba(36,24,64,.97); border: 1px solid rgba(255,207,138,.3); opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .25s, transform .25s; }
.menu.show { opacity: 1; transform: none; pointer-events: auto; }
.menu button { height: 44px; min-width: 150px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-family: var(--font-display); font-weight: 900; font-size: 14px; cursor: pointer; text-align: left; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .rainbow::before, .cta.breathe, .talk .more, .mic.listen .ring { animation: none; } .telop .ch { transform: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="cv" role="img" aria-label="火星の赤い丘。白い線の四角の空き地に、カチンコを鳴らすとスタジオが建つ"></canvas>

  <header class="top" id="top">
    <button class="icon-btn" id="back" aria-label="もどる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title"><div class="kicker">MARS</div><div class="name">火星</div></div>
    <span class="spacer"></span>
    <div class="place" id="place" role="heading" aria-level="2"><span id="place-ico"></span><span id="place-t">myスタジオ</span></div>
    <button class="icon-btn snd" id="snd" aria-pressed="false" aria-label="風の音（いまはオフ）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h11a3 3 0 1 0-3-3"/><path d="M3 14h15a3 3 0 1 1-3 3"/><path d="M4 4l16 16" id="snd-x"/></svg></button>
  </header>

  <div class="talk" id="talk" aria-live="polite"><div class="av" id="talk-av"></div><div><div class="who" id="talk-who"></div><div class="line" id="talk-line"></div></div><span class="more">▼</span></div>
  <div class="guide" id="guide" aria-live="polite"><span id="guide-t"></span></div>
  <div class="telop" id="telop" aria-live="polite"></div>
  <div class="said" id="said"></div>
  <div class="toast" id="toast" role="status"></div>
  <button class="vault" id="vault" aria-label="裏スタジオ（あなただけ）"><span class="hit"></span><span class="lbl"><span id="lock-ico"></span>裏スタジオ</span></button>

  <div class="chips" id="chips" aria-label="スタジオの札"></div>
  <div class="dock" id="dock">
    <!-- ① 聞く -->
    <div class="panel" id="p-ask">
      <div class="ask-row">
        <button class="pill small omakase" id="omakase">おまかせ</button>
        <div class="ask-col">
          <button class="mic" id="mic" aria-label="話してみよう"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span id="mic-ico"></span></button>
          <div class="mic-l">話してみよう</div>
        </div>
        <button class="icon-btn kbd" id="kbd" aria-label="打つ（声が出せない時だけ）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
      </div>
    </div>
    <!-- ② 札 -->
    <div class="panel" id="p-cards">
      <div class="cards-note">話すと、札が変わります。マナは使いません。あとで変えられます。<br>星図の景色も、同じ見た目になります</div>
      <div class="cards" id="cards"></div>
      <div class="caption">（試作）札を押すと、ほかの形に変わります</div>
      <div class="row2"><button class="pill" id="redo1" style="flex:1"><span id="redo1-ico"></span>話して直す</button><button class="pill go" id="tobuild" style="flex:1.3;font-size:16px">この札で建てる</button></div>
    </div>
    <!-- ③ 鳴らせ -->
    <div class="panel" id="p-clap">
      <div class="clap-wrap">
        <button class="redo" id="redo2" aria-label="話して直す"><span class="c" id="redo2-ico"></span>話して直す</button>
        <canvas id="clap" aria-label="カチンコ。上の棒を下へ引くか、タップして鳴らす" role="button" tabindex="0"></canvas>
        <div class="clap-hint" id="clap-hint">棒を下へ引く ／ タップ</div>
      </div>
    </div>
    <!-- ⑥ とばす -->
    <div class="panel" id="p-send">
      <button class="cta rainbow breathe" id="cta"><span id="cta-ico"></span>公開する</button>
      <div class="cta-sub"><span id="sub-ico"></span>届くのはダチだけ</div>
      <button class="keep" id="keep">今は、スタジオに置いておく</button>
    </div>
  </div>

  <nav class="nav hide" id="nav">
    <div class="row">
      <button class="tab on" id="t-map"><span class="ico" id="ico-map"></span>星図</button>
      <button class="tab" id="t-shoot"><span class="ico" id="ico-shoot"></span>撮影</button>
      <button class="tab" id="t-studio"><span class="ico" id="ico-studio"></span>myスタジオ</button>
    </div>
  </nav>

  <!-- X-5 公開の確認 -->
  <div class="veil" id="sv">
    <div class="sheet" role="dialog" aria-label="公開する">
      <div class="handle" aria-hidden="true"></div>
      <div class="c-top"><h3><span id="c-ico"></span>公開する</h3><button class="quit" id="c-quit">やめる</button></div>
      <div class="c-mv"><canvas id="c-thumb" width="256" height="144"></canvas><div><div class="t">きょうの空、ひろかった</div><div class="by">MV ・ ミナト</div></div></div>
      <div class="dest-l">行き先</div>
      <div class="dest" role="radio" aria-checked="true"><span class="radio"></span><span class="lbl">ダチへ</span><span class="faces" id="faces"></span></div>
      <div class="c-note">UFOになって、88時間、ダチの星図をとんで、このスタジオに戻ります。<br>届くのはダチだけ。</div>
      <button class="fly-btn rainbow" id="fly"><span id="fly-ico"></span>とばす</button>
    </div>
  </div>

  <!-- X-2 映像を見る -->
  <div class="veil" id="pv">
    <div class="sheet" role="dialog" aria-label="映像を見る">
      <div class="handle" aria-hidden="true"></div>
      <div class="p-head"><div class="p-av" id="p-av"></div><div><span class="p-name" id="p-name"></span><span class="badge" id="p-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M7 6v12M17 6v12"/></svg>ダチ</span></div></div>
      <div class="holo-wrap"><canvas class="holo" id="holo" aria-label="映像。押すと止まる・もう一度押すと続きから"></canvas><button class="holo-play hide" id="holo-play" aria-label="再生"></button></div>
      <div class="p-title" id="p-title"></div>
      <div class="p-lyric" id="p-lyric"></div>
      <div class="ctrl">
        <button class="cbtn" id="p-prev" aria-disabled="true" aria-label="前の映像（同じ人の映像）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="play" id="p-play" aria-label="止める"><span id="p-play-i"></span></button>
        <button class="cbtn" id="p-next" aria-disabled="true" aria-label="次の映像（同じ人の映像）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="p-foot"><button class="pill small" id="p-studio"><span id="p-studio-ico"></span>この人のスタジオへ</button><button class="pill small" id="p-close">閉じる</button><button class="pill small more-b" id="p-more" aria-label="そのほか"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div>
    </div>
  </div>
  <div class="menu" id="menu"><button id="m1">推しから外す</button><button id="m2">通報する</button><button id="m3">ブロック</button></div>

  <!-- start / end -->
  <div class="veil center" id="iv">
    <div class="card">
      <svg class="phones" viewBox="0 0 80 80" fill="none"><defs><linearGradient id="gph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffcf8a"/><stop offset="1" stop-color="#e0703f"/></linearGradient></defs><path d="M16 46V40a24 24 0 0 1 48 0v6" stroke="url(#gph)" stroke-width="5" stroke-linecap="round"/><rect x="10" y="44" width="14" height="22" rx="7" fill="#ffcf8a"/><rect x="56" y="44" width="14" height="22" rx="7" fill="#3fb7b0"/><path d="M33 52c2-3 2-6 0-9M40 56c4-6 4-12 0-17M47 52c2-3 2-6 0-9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".85"/></svg>
      <h3>音が出ます</h3>
      <p>音を出せる場所か、イヤホンで。<br>画面は、押した時だけ映ります。</p>
      <button class="pill go rainbow" id="start">はじめる</button>
    </div>
  </div>
  <div class="veil center" id="ev">
    <div class="card">
      <h3>この試作は、ここまで</h3>
      <p>ミナトのUFOは、88時間、<br>ダチの星図をとんで、<br>myスタジオに戻ります。</p>
      <div style="display:flex;gap:10px"><button class="pill" id="e-stay" style="flex:1;font-size:14px">星図を見ている</button><button class="pill go" id="e-again" style="flex:1;font-size:15px">はじめから</button></div>
    </div>
  </div>
</div>

    g.save(); g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x - 60 * s * 2.2, y + 14); g.lineTo(x + 60 * s * 2.2, y + 14); g.lineTo(x + 66 * s * 2.2, y - 12); g.lineTo(x - 50 * s * 2.2, y - 12); g.closePath(); g.stroke(); g.restore();
    if (S.kim.rise > 0) {
      g.save(); g.translate(x, y); g.scale(s, s);
      const r = easeOut(S.kim.rise), off = (1 - r) * 190; g.beginPath(); g.rect(-200, -400, 400, 404); g.clip(); g.translate(0, off);
      const nt = S.night;
      g.fillStyle = mix('#ffd85a', '#8a6a3a', nt * .5); g.fillRect(-90, -130, 180, 130); g.fillStyle = mix('#c8283a', '#5a1420', nt * .4); g.fillRect(-98, -146, 196, 18); g.fillRect(-90, -12, 180, 12);
      g.fillStyle = '#07050d'; g.fillRect(-60, -112, 120, 66); g.strokeStyle = 'rgba(255,214,140,.5)'; g.lineWidth = 3; g.strokeRect(-64, -116, 128, 74);
      // tiny gold slide off the side (his trademark)
      g.strokeStyle = mix('#ffe08a', '#9a7a3a', nt * .4); g.lineWidth = 12; g.lineCap = 'round'; g.beginPath(); g.moveTo(80, -150); g.quadraticCurveTo(150, -110, 130, -10); g.stroke();
      g.fillStyle = '#ffd85a'; g.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * TAU / 5; g.lineTo(Math.cos(a) * 16, -170 + Math.sin(a) * 16); const b = a + TAU / 10; g.lineTo(Math.cos(b) * 7, -170 + Math.sin(b) * 7); } g.fill();
      g.restore();
    }
    drawSign(g, x, y + 30, .78 * G.sc, 'KIMORIN⭐︎', 1);
  }

  // ---------------------------------------------------------------- input
  cv.addEventListener('click', (e) => {
    const r = cv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
    if (talkResolve) { advanceTalk(); return; }
    if ((S.phase === 'placed' || S.phase === 'send') && S.built && S.tr === 0) {
      const sr = studioScreenRect(); const cm = camT();
      const ux = (x - cm.ax) / cm.z + cm.fx, uy = (y - cm.ay) / cm.z + cm.fy;
      if (ux > sr.x - 16 && ux < sr.x + sr.w + 16 && uy > sr.y - 16 && uy < sr.y + sr.h + 16) { toggleStudioScreen(); return; }
    }
    if (S.phase === 'map' && !S.player) {
      const hit = [...S.ufos].reverse().find((u) => u._hit && !u.hidden && x > u._hit.x && x < u._hit.x + u._hit.w && y > u._hit.y && y < u._hit.y + u._hit.h);
      if (hit) openPlayer(hit);
    }
  });
  $('start').addEventListener('click', begin);
  $('mic').addEventListener('click', () => heard('mic'));
  $('kbd').addEventListener('click', () => heard('mic'));
  $('omakase').addEventListener('click', () => heard('omakase'));
  $('redo1').addEventListener('click', () => redo(1));
  $('redo2').addEventListener('click', () => redo(2));
  $('tobuild').addEventListener('click', toClap);
  $('cta').addEventListener('click', openSend);
  $('keep').addEventListener('click', keep);
  $('c-quit').addEventListener('click', () => { $('sv').classList.remove('show'); });
  $('fly').addEventListener('click', fly);
  $('vault').addEventListener('click', () => toast(`${SVG.lock.replace('<svg', '<svg style="width:18px;height:18px;vertical-align:-3px;margin-right:4px"')}裏スタジオ。中は、ミナトだけが見られます`));
  $('back').addEventListener('click', () => toast('試作では、ここまで'));
  $('snd').addEventListener('click', () => { initAudio(); setAmb(!ambOn); });
  $('p-play').addEventListener('click', playerToggle);
  $('holo').addEventListener('click', playerToggle);
  $('holo-play').addEventListener('click', playerToggle);
  $('p-close').addEventListener('click', closePlayer);
  $('pv').addEventListener('click', (e) => { if (e.target === $('pv')) closePlayer(); });
  $('p-prev').addEventListener('click', () => toast('この人の映像は、これだけ'));
  $('p-next').addEventListener('click', () => toast('この人の映像は、これだけ'));
  $('p-studio').addEventListener('click', () => toast('試作では、ここまで'));
  $('p-more').addEventListener('click', () => { const m = $('menu'); const r = $('p-more').getBoundingClientRect(), a = app.getBoundingClientRect(); m.style.bottom = (a.bottom - r.top + 8) + 'px'; m.classList.toggle('show'); });
  ['m1', 'm2', 'm3'].forEach((id) => $(id).addEventListener('click', () => { $('menu').classList.remove('show'); toast('試作では、ここまで'); }));
  $('t-map').addEventListener('click', () => {});
  $('t-shoot').addEventListener('click', () => toast('試作では、ここまで'));
  $('t-studio').addEventListener('click', () => toast('試作では、ここまで'));
  $('e-stay').addEventListener('click', () => $('ev').classList.remove('show'));
  $('e-again').addEventListener('click', () => location.reload());

  window.addEventListener('resize', () => { resize(); if ($('p-clap').classList.contains('show')) sizeClap(); });
  resize();
  $('iv').classList.add('show');
  requestAnimationFrame(frame);
  window.__mars = { S, sr: () => studioScreenRect() };
})();
</script>
