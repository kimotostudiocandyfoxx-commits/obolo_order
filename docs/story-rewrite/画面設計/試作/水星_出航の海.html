<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出航の海</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* Mercury M-1 海図 + M-5 出航, one canvas stage. Same look as the Venus / Saturn prototypes. */
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
:root {
  --night: #050b1f;
  --navy: #0a1834;
  --gold: #ffd28a;
  --gold-deep: #c58a3e;
  --teal: #3fe0c8;
  --pink: #ff6fb5;
  --cyan: #4fe3ff;
  --violet: #8b6bff;
  --ink: #f4f8ff;
  --ink-dim: #c3d0ee;
  --line: rgba(255,255,255,.14);
  --font-pop: "Dela Gothic One", "Zen Maru Gothic", "Hiragino Sans", sans-serif;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
.app { height: 100%; max-width: 460px; margin: 0 auto; position: relative; background: var(--night); overflow: hidden; isolation: isolate; user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 0; }

/* header: transparent glass over the sky */
.top { position: absolute; z-index: 5; top: 0; left: 0; right: 0; height: calc(56px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 12px 0; display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg, rgba(5,11,31,.72), rgba(5,11,31,.28) 70%, rgba(5,11,31,0)); transition: opacity .6s; }
.top::after { content: ""; position: absolute; inset: 0; z-index: -1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); mask: linear-gradient(#000 55%, transparent); -webkit-mask: linear-gradient(#000 55%, transparent); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.07); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.title { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; line-height: 1.1; pointer-events: none; }
.title .kicker { font-family: var(--font-pop); font-size: 10px; letter-spacing: .34em; color: var(--teal); padding-left: .34em; }
.title .name { font-family: var(--font-pop); font-size: 20px; letter-spacing: .1em; background: linear-gradient(90deg, var(--gold), #fff 60%, #c8fff4); -webkit-background-clip: text; background-clip: text; color: transparent; }
.spacer { flex: 1; }
.oshi { position: absolute; left: 14px; top: calc(60px + env(safe-area-inset-top, 0px)); height: 30px; padding: 0 12px 0 8px; border-radius: 999px; border: 1px solid rgba(255,210,138,.38); background: rgba(255,210,138,.09); display: flex; align-items: center; gap: 5px; font-family: var(--font-display); font-weight: 900; font-size: 13px; flex: none; transition: box-shadow 1.2s, background 1.2s; }
.oshi svg { width: 18px; height: 18px; }
.oshi.glow { background: rgba(255,210,138,.22); box-shadow: 0 0 18px rgba(255,210,138,.45); }
.snd[aria-pressed="true"] { border-color: rgba(63,224,200,.6); background: rgba(63,224,200,.14); }

/* one resident line at a time */
.talk { position: absolute; z-index: 9; top: calc(98px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; padding: 8px 34px 8px 8px; min-height: 60px; border-radius: 22px; background: rgba(8,18,44,.74); border: 1px solid rgba(255,210,138,.28); box-shadow: 0 10px 30px rgba(0,0,0,.28); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); opacity: 0; transform: translateY(-8px); transition: opacity .35s, transform .35s; pointer-events: none; cursor: pointer; }
.talk.show { opacity: 1; transform: none; pointer-events: auto; }
.talk .av { width: 44px; height: 44px; border-radius: 50%; flex: none; background: radial-gradient(circle at 50% 35%, rgba(63,224,200,.35), rgba(255,255,255,.05)); display: grid; place-items: center; overflow: hidden; border: 1.5px solid rgba(255,210,138,.55); }
.talk .av img { width: 100%; height: 100%; object-fit: cover; }
.talk .who { font-family: var(--font-pop); font-size: 11px; letter-spacing: .12em; color: var(--gold); }
.talk .line { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.5; }
.talk .more { position: absolute; right: 14px; bottom: 9px; font-size: 11px; color: var(--gold); animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

/* the one guide line (〔画面〕) */
.guide { position: absolute; z-index: 4; left: 16px; right: 16px; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); text-align: center; pointer-events: none; opacity: 0; transform: translateY(6px); transition: opacity .45s, transform .45s; }
.guide.show { opacity: 1; transform: none; }
.guide span { display: inline-block; max-width: 100%; padding: 9px 16px; border-radius: 18px; font-family: var(--font-display); font-weight: 900; font-size: 14px; line-height: 1.55; background: rgba(8,18,44,.66); border: 1px solid rgba(63,224,200,.32); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.guide b { color: var(--gold); font-weight: 900; }

/* big line after the launch */
.telop { position: absolute; z-index: 4; left: 12px; right: 12px; top: 23%; text-align: center; pointer-events: none; font-family: var(--font-pop); font-size: 23px; line-height: 1.45; letter-spacing: .04em; }
.telop .ch { display: inline-block; opacity: 0; transform: translateY(14px); background: linear-gradient(180deg, #fff 20%, var(--gold) 80%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 10px rgba(4,10,30,.85)) drop-shadow(0 0 14px rgba(255,210,138,.35)); transition: opacity .5s, transform .6s cubic-bezier(.2,.9,.3,1.2); }
.telop .ch.on { opacity: 1; transform: none; }
.telop.out .ch { opacity: 0; transition: opacity 1.2s; }

.toast { position: absolute; z-index: 9; left: 50%; top: 44%; transform: translate(-50%, -50%) scale(.96); max-width: calc(100% - 40px); padding: 12px 20px; border-radius: 22px; text-align: center; background: linear-gradient(90deg, rgba(63,224,200,.34), rgba(139,107,255,.4)); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-family: var(--font-display); font-weight: 900; font-size: 14px; line-height: 1.5; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, -50%); }

/* bottom: CTA + three drawn icons */
.nav { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: calc(150px + env(safe-area-inset-bottom, 0px)); padding: 0 16px env(safe-area-inset-bottom, 0px); transition: transform .45s, opacity .45s; }
.nav::before { content: ""; position: absolute; inset: -40px 0 0; background: linear-gradient(180deg, rgba(5,11,31,0), rgba(5,11,31,.72) 32%, rgba(4,9,26,.96) 62%); z-index: -1; pointer-events: none; }
.nav.hide { transform: translateY(30px); opacity: 0; pointer-events: none; }
.cta-wrap { height: 76px; display: flex; align-items: flex-start; justify-content: center; padding-top: 6px; }
.rainbow { position: relative; isolation: isolate; }
.rainbow::before { content: ""; position: absolute; inset: -3px; border-radius: inherit; padding: 3px; background: conic-gradient(from var(--a), var(--pink), var(--cyan), var(--violet), var(--gold), var(--pink)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 4s linear infinite; z-index: -1; }
@keyframes spin { to { --a: 360deg; } }
.cta { width: min(310px, 100%); height: 56px; border-radius: 999px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; color: #2a1606; font-family: var(--font-pop); font-size: 18px; letter-spacing: .08em; background: linear-gradient(100deg, #fff3d6, var(--gold) 45%, var(--gold-deep)); box-shadow: 0 10px 26px rgba(197,138,62,.38), inset 0 1px 0 rgba(255,255,255,.75); transition: filter .3s, transform .2s; }
.cta svg { width: 28px; height: 28px; }
.cta:active { transform: scale(.97); }
.cta.breathe { animation: breathe 2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { filter: brightness(1); box-shadow: 0 10px 26px rgba(197,138,62,.38), inset 0 1px 0 rgba(255,255,255,.75); } 50% { filter: brightness(1.08); box-shadow: 0 10px 34px rgba(255,210,138,.55), inset 0 1px 0 rgba(255,255,255,.75); } }
.cta.teal { color: #04201c; background: linear-gradient(100deg, #e4fffa, #7ff0dc 45%, #2fb8a6); box-shadow: 0 10px 26px rgba(47,184,166,.35), inset 0 1px 0 rgba(255,255,255,.75); }
.row { display: grid; grid-template-columns: repeat(3, 1fr); height: 64px; }
.tab { justify-self: center; width: 96px; min-height: 60px; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0; font-family: var(--font-display); font-weight: 900; font-size: 12px; color: var(--ink-dim); position: relative; }
.tab .ico { width: 38px; height: 38px; display: grid; place-items: center; transition: transform .25s; }
.tab .ico img, .tab .ico svg { width: 38px; height: 38px; object-fit: contain; }
.tab.on { color: var(--ink); }
.tab.on .ico { transform: scale(1.12); }
.tab.on::after { content: ""; position: absolute; bottom: -2px; width: 22px; height: 3px; border-radius: 3px; background: var(--gold); box-shadow: 0 0 10px var(--gold); }

/* sheets */
.veil { position: absolute; inset: 0; z-index: 8; background: linear-gradient(180deg, rgba(4,8,22,0) 30%, rgba(4,8,22,.45)); opacity: 0; pointer-events: none; transition: opacity .35s; display: flex; align-items: flex-end; justify-content: center; }
.veil.show { opacity: 1; pointer-events: auto; }
.veil.center { align-items: center; padding: 16px; background: rgba(4,8,22,.38); }
.sheet { width: 100%; max-width: 460px; border-radius: 28px 28px 0 0; padding: 8px 18px calc(18px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, rgba(20,34,74,.95), rgba(8,16,40,.98)); border: 1px solid rgba(255,210,138,.3); border-bottom: 0; box-shadow: 0 -20px 50px rgba(0,0,0,.45); transform: translateY(105%); transition: transform .42s cubic-bezier(.2,.8,.25,1); position: relative; }
.veil.show .sheet { transform: none; }
.handle { display: block; width: 100%; height: 26px; border: 0; background: none; cursor: grab; padding: 0; touch-action: none; }
.handle::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.28); margin: 6px auto 0; }
.card { width: 100%; max-width: 360px; border-radius: 26px; padding: 22px 20px 18px; text-align: center; background: linear-gradient(180deg, rgba(22,36,80,.95), rgba(9,17,42,.97)); border: 1px solid rgba(255,210,138,.32); box-shadow: 0 20px 50px rgba(0,0,0,.45); transform: translateY(14px); transition: transform .35s; }
.veil.show .card { transform: none; }
.card h3, .sheet h3 { margin: 0 0 8px; font-family: var(--font-pop); font-weight: 400; font-size: 17px; letter-spacing: .06em; color: var(--gold); }
.card p { margin: 0 0 16px; font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.65; }
.card .phones { width: 76px; height: 76px; margin: 0 auto 8px; display: block; }
.pill { height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.07); font-family: var(--font-display); font-weight: 900; font-size: 15px; cursor: pointer; }
.pill.go { width: 100%; height: 56px; border: 0; color: #2a1606; font-family: var(--font-pop); font-weight: 400; font-size: 17px; letter-spacing: .08em; background: linear-gradient(100deg, #fff3d6, var(--gold) 45%, var(--gold-deep)); box-shadow: 0 8px 22px rgba(197,138,62,.35); }

/* M-2 player */
.p-head { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.p-av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-pop); font-size: 16px; color: #fff; flex: none; overflow: hidden; border: 1.5px solid rgba(255,210,138,.55); }
.p-av img { width: 100%; height: 100%; object-fit: cover; }
.p-name { font-family: var(--font-display); font-weight: 900; font-size: 16px; }
.badge { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px 0 6px; border-radius: 999px; background: rgba(255,210,138,.14); border: 1px solid rgba(255,210,138,.4); color: var(--gold); font-family: var(--font-display); font-weight: 900; font-size: 11px; margin-left: 6px; vertical-align: 2px; }
.badge svg { width: 13px; height: 13px; }
.p-head .spacer { flex: 1; }
.disc-wrap { position: relative; width: 148px; height: 148px; margin: 0 auto 4px; }
.disc { width: 100%; height: 100%; display: block; }
.p-title { text-align: center; font-family: var(--font-pop); font-size: 21px; letter-spacing: .04em; line-height: 1.3; margin: 2px 0 2px; }
.p-lyric { text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--ink-dim); min-height: 22px; }
.prog { height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); margin: 10px 8px 8px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold)); border-radius: 4px; }
.ctrl { display: flex; align-items: center; justify-content: center; gap: 22px; }
.cbtn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.08); display: grid; place-items: center; cursor: pointer; padding: 0; }
.cbtn svg { width: 26px; height: 26px; }
.cbtn:disabled { opacity: .32; cursor: default; }
.play { width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; padding: 0; color: #2a1606; background: radial-gradient(circle at 38% 30%, #fff4d8, var(--gold) 45%, var(--gold-deep)); box-shadow: 0 10px 26px rgba(197,138,62,.45), inset 0 1px 0 rgba(255,255,255,.7); }
.play svg { width: 34px; height: 34px; }
.cap { text-align: center; font-family: var(--font-display); font-weight: 900; font-size: 12px; color: var(--ink-dim); min-height: 18px; margin-top: 4px; }
.p-foot { display: flex; gap: 10px; margin-top: 6px; }
.p-foot .pill { flex: 1; }

/* M-5 confirm */
.c-top { display: flex; align-items: center; justify-content: space-between; }
.c-top h3 { margin: 0; display: flex; align-items: center; gap: 8px; }
.c-top h3 svg { width: 24px; height: 24px; }
.quit { height: 44px; min-width: 64px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-family: var(--font-display); font-weight: 900; font-size: 13px; cursor: pointer; color: var(--ink-dim); }
.c-rec { display: flex; align-items: center; gap: 14px; margin: 10px 0 14px; }
.c-rec canvas { width: 150px; height: 112px; flex: none; }
.c-rec .t { font-family: var(--font-pop); font-size: 17px; line-height: 1.35; }
.c-rec .by { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--ink-dim); margin-top: 4px; }
.dest-l { font-family: var(--font-display); font-weight: 900; font-size: 12px; color: var(--ink-dim); margin: 0 0 6px 2px; }
.dest { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 12px 6px 10px; border-radius: 18px; background: linear-gradient(90deg, rgba(255,210,138,.2), rgba(255,210,138,.06)); border: 1.5px solid rgba(255,210,138,.6); }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--gold); display: grid; place-items: center; flex: none; }
.radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.dest .lbl { font-family: var(--font-display); font-weight: 900; font-size: 16px; }
.faces { display: flex; align-items: center; gap: 6px; margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 12px; }
.faces .fa { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; font-family: var(--font-pop); font-size: 13px; border: 1.5px solid rgba(255,255,255,.5); }
.faces .fa img { width: 100%; height: 100%; object-fit: cover; }
.c-note { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.65; margin: 12px 2px 14px; color: var(--ink); }
.c-note small { display: block; font-size: 12px; color: var(--ink-dim); font-weight: 500; margin-top: 2px; }
.sail-btn { width: 100%; height: 64px; border-radius: 999px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; color: #2a1606; font-family: var(--font-pop); font-size: 22px; letter-spacing: .14em; background: linear-gradient(100deg, #fff3d6, var(--gold) 45%, var(--gold-deep)); box-shadow: 0 12px 30px rgba(197,138,62,.45), inset 0 1px 0 rgba(255,255,255,.75); }
.sail-btn svg { width: 32px; height: 32px; }

.menu { position: absolute; z-index: 10; right: 16px; display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 20px; background: rgba(10,20,48,.96); border: 1px solid rgba(255,210,138,.3); opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .25s, transform .25s; }
.menu.show { opacity: 1; transform: none; pointer-events: auto; }
.menu button { height: 44px; min-width: 150px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-family: var(--font-display); font-weight: 900; font-size: 14px; cursor: pointer; text-align: left; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .rainbow::before, .cta.breathe, .talk .more { animation: none; } .telop .ch { transform: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="cv" role="img" aria-label="水星の海図。オーロラの夜の海を、ダチの船がゆっくりめぐっている。船をタップすると、その船の曲が鳴る"></canvas>

  <header class="top" id="top">
    <button class="icon-btn" id="back" aria-label="もどる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title"><div class="kicker">MERCURY</div><div class="name">水星</div></div>
    <span class="spacer"></span>
    <div class="oshi" id="oshi" role="heading" aria-level="2"><svg viewBox="0 0 24 24" fill="none" stroke="#ffd28a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.2V20M7 11h10M5 15c.8 3 3.6 5 7 5s6.2-2 7-5"/></svg>推しの海</div>
    <button class="icon-btn snd" id="snd" aria-pressed="false" aria-label="波の音（いまはオフ）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0" id="snd-w2"/><path d="M4 4l16 16" id="snd-x"/></svg></button>
  </header>

  <div class="talk" id="talk" aria-live="polite"><div class="av" id="talk-av"></div><div><div class="who" id="talk-who"></div><div class="line" id="talk-line"></div></div><span class="more">▼</span></div>
  <div class="guide" id="guide" aria-live="polite"><span id="guide-t"></span></div>
  <div class="telop" id="telop" aria-live="polite"></div>
  <div class="toast" id="toast" role="status"></div>

  <nav class="nav hide" id="nav">
    <div class="cta-wrap"><button class="cta rainbow" id="cta"><span id="cta-ico"></span><span id="cta-t">出航させる</span></button></div>
    <div class="row">
      <button class="tab on" id="t-sea"><span class="ico" id="ico-sea"></span>海図</button>
      <button class="tab" id="t-compose"><span class="ico" id="ico-compose"></span>作曲</button>
      <button class="tab" id="t-island"><span class="ico" id="ico-island"></span>myアイランド</button>
    </div>
  </nav>

  <!-- M-2 船の曲 -->
  <div class="veil" id="pv">
    <div class="sheet" id="player" role="dialog" aria-label="船の曲">
      <button class="handle" id="p-handle" aria-label="閉じる（下へ引く）"></button>
      <div class="p-head"><div class="p-av" id="p-av"></div><div><span class="p-name" id="p-name"></span><span class="badge" id="p-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.2V20M7 11h10M5 15c.8 3 3.6 5 7 5s6.2-2 7-5"/></svg>ダチ</span></div><span class="spacer"></span><button class="icon-btn" id="p-more" aria-label="そのほか"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div>
      <div class="disc-wrap"><canvas class="disc" id="disc" width="352" height="352"></canvas></div>
      <div class="p-title" id="p-title"></div>
      <div class="p-lyric" id="p-lyric"></div>
      <div class="prog"><i id="p-prog"></i></div>
      <div class="ctrl">

  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function onEnded() {
    if (!cur || cur.ended) return; cur.ended = true; stopSong(); setPlayIcon('again'); $('p-cap').textContent = '〔もう一回〕で、はじめから'; $('p-prog').style.width = '100%';
    if (cur.sh.id === 'kimo' && S.kimoLine === 'pending') { S.kimoLine = 'done'; say('kimo', '……二回目でも、泣けますね。'); }
  }
  $('p-play').addEventListener('click', () => {
    if (!cur) return;
    if (playing) { stopSong(); setPlayIcon('play'); $('p-cap').textContent = ''; }
    else startCur();
  });
  $('p-prev').addEventListener('click', () => { if (!cur || cur.idx <= 0) return; cur.idx--; fillPlayer(); startCur(); });
  $('p-next').addEventListener('click', () => { if (!cur || cur.idx >= cur.person.songs.length - 1) return; cur.idx++; fillPlayer(); startCur(); });
  $('p-more').addEventListener('click', (e) => { e.stopPropagation(); const m = $('menu'); const self = cur && cur.person.self; m.innerHTML = self ? '<button id="m1">出航をやめる</button>' : '<button id="m1">推しから外す</button><button id="m2">通報する</button><button id="m3">ブロック</button>'; const r = $('player').getBoundingClientRect(); m.style.top = (r.top + 60) + 'px'; m.classList.add('show'); });
  $('menu').addEventListener('click', (e) => { e.stopPropagation(); $('menu').classList.remove('show'); if (e.target.tagName === 'BUTTON') toast('この試作では、ここは動きません'); });
  document.addEventListener('click', () => $('menu').classList.remove('show'));
  async function closePlayer() {
    if (S.sheet !== 'player') return; $('menu').classList.remove('show');
    stopSong(); const sh = cur.sh; cur = null; follow = null;
    pv.classList.remove('show'); S.sheet = null;
    sh.listened = true; sh.glow = 1;
    camBusy = true; await tween(cam, { x: W / 2, y: H / 2, z: 1 }, 600); camBusy = false;
    nav.classList.remove('hide');
    if (S.step === 'sea' && !S.launched) showGuide('次は、あなたの曲。<b>〔🚢 出航させる〕</b>を押すと、<br>曲が船になって、ダチの海を88時間めぐります');
    if (S.step === 'free' && S.kimoIn && S.kimoLine !== 'done') showGuide('<b>KIMORIN⭐︎</b>の船も、タップすると聴けます');
  }
  $('p-close').addEventListener('click', closePlayer);
  pv.addEventListener('click', (e) => { if (e.target === pv && performance.now() - S.openedAt > 700) closePlayer(); });
  // drag the handle down to close
  { let y0 = null; const hd = $('p-handle'); hd.addEventListener('pointerdown', (e) => { y0 = e.clientY; hd.setPointerCapture(e.pointerId); }); hd.addEventListener('pointermove', (e) => { if (y0 === null) return; const d = Math.max(0, e.clientY - y0); $('player').style.transform = `translateY(${d}px)`; }); const up = (e) => { if (y0 === null) return; const d = e.clientY - y0; y0 = null; $('player').style.transform = ''; if (d > 60 || Math.abs(d) < 6) closePlayer(); }; hd.addEventListener('pointerup', up); hd.addEventListener('pointercancel', up); }

  // ---------------------------------------------------------------- M-5 confirm + the launch
  const cv5 = $('cv5');
  function fillConfirm() {
    const c = $('sleeve'), g = c.getContext('2d'); g.clearRect(0, 0, 300, 224);
    const sl = img('record-sleeve-blank');
    vinyl(g, 196, 112, 96, .4, SONGS.me.jc);
    g.save(); g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 16; g.shadowOffsetX = 4;
    if (ok(sl)) g.drawImage(sl, 6, 6, 212, 212);
    g.fillStyle = '#f6ead2'; g.fillRect(12, 12, 200, 200); g.restore();
    g.drawImage(SONGS.me.jc, 18, 18, 188, 188);
    g.strokeStyle = 'rgba(255,210,138,.9)'; g.lineWidth = 3; g.strokeRect(13.5, 13.5, 197, 197);
    $('c-title').textContent = SONGS.me.title; $('c-by').innerHTML = `${NEO}<br>ジャケット：木星のアート`;
    const k = img('kimorin-face');
    $('faces').innerHTML = `<span class="fa" style="background:${AVC.haru}">ハ</span>${INVITER}<span class="fa">${k ? `<img src="${k.src}" alt="">` : 'K'}</span>KIMORIN⭐︎`;
  }
  function openConfirm() { if (S.sheet) return; S.sheet = 'confirm'; hideGuide(); S.hintUntil = 0; fillConfirm(); cv5.classList.add('show'); nav.classList.add('hide'); audio(); chime(84, 0, .04); }
  function closeConfirm() { cv5.classList.remove('show'); S.sheet = null; nav.classList.remove('hide'); }
  $('c-quit').addEventListener('click', () => { closeConfirm(); toast('曲は、土の中にしまったままです'); showGuide('<b>〔🚢 出航させる〕</b>は、いつでも押せます'); });
  $('sail').addEventListener('click', () => { if (S.sheet !== 'confirm') return; cv5.classList.remove('show'); S.sheet = null; launch(); });
  cta.addEventListener('click', () => {
    if (S.step === 'sea' && !S.launched) openConfirm();
    else if (S.step === 'free') { $('ev').classList.add('show'); }
  });

  async function launch() {
    S.step = 'launch'; S.launched = true; hideGuide(); talk.classList.remove('show'); audio();
    const rp = RISE();
    const me = { id: 'me', who: 'me', song: 'me', style: 'dinghy', lane: 0, ang: Math.PI / 2 - .36, phase: .3, fs: -1, fsT: -1, boost: 1, vis: 1, sail: 0, glow: 0, listened: false, wobble: 0, captain: 0, wave: 0, mode: 'rise', fx: rp.x, fy: rp.y, rise: 70, flag: '#3fc8b0' };
    ships.push(me); S.spot = me;
    // the camera leans in a little toward the pier
    if (!R) { camBusy = true; const c = camAt(rp.x - 10, rp.y - 70, 1.5, H * .46); tween(cam, c, 1100).then(() => { camBusy = false; }); }
    ripples.push({ x: rp.x, y: rp.y, t0: T + .1, dur: 1.4, r0: 8, r1: 70 }, { x: rp.x, y: rp.y, t0: T + .4, dur: 1.4, r0: 8, r1: 90 }, { x: rp.x, y: rp.y, t0: T + .7, dur: 1.4, r0: 8, r1: 60 });
    await wait(550);
    // the ship rises out of the water
    splashSound(); spawnSplash(rp.x, rp.y, 40);
    if (R) { me.rise = 0; me.vis = 0; tween(me, { vis: 1 }, 400); }
    else await tween(me, { rise: 0 }, 850, easeOutBack);
    // the record flies up from the button and opens into the sail
    const cr = cta.getBoundingClientRect(), ar = app.getBoundingClientRect();
    if (!R) { fly = { t0: performance.now(), dur: 900, x0: cr.left - ar.left + cr.width / 2, y0: cr.top - ar.top + cr.height / 2 }; await wait(900); }
    me.glow = 1; await tween(me, { sail: 1 }, 520, easeOut);
    chime(84, 0, .07); chime(88, .12, .06); chime(91, .24, .06);
    // the captain pops up at the bow and waves twice
    tween(me, { captain: 1 }, 380, easeOutBack);
    horn();
    rings.push({ x: me.x, y: me.y, t0: T + .15, dur: 1.4 });
    if (!R) setTimeout(() => rings.push({ x: me.x, y: me.y, t0: T, dur: 1.4 }), 380);
    tweenAurora();
    await wait(260);
    if (!R) tween(me, { wave: 1 }, 1500, (u) => u);
    playSong('me');
    await wait(700);
    // off it goes along the front lane
    me.mode = 'join'; me.jk = 0; me.boost = 4.5; me.fy = me.y; me.fx = me.x; makeRoom(0, me);
    camBusy = true; tween(cam, { x: W / 2, y: H / 2, z: 1 }, 1600).then(() => { camBusy = false; });
    const trail = setInterval(() => { if (R) return; parts.push({ k: 'trail', x: me.x - 40 * me.fs * me.s + (Math.random() - .5) * 8, y: me.y - 2, vx: 0, vy: -4, life: 0, max: 1.6, s: 1.4 + Math.random() * 1.6 }); if (Math.random() < .35) spawnNotes(me.x - 20 * me.fs, me.y - 100 * me.s, 1, 20); }, 90);
    await wait(500);
    showTelop(`${NEO}の最初の一隻が、\nダチの海へ出た`);
    await hold(900);
    routes = { t0: T, dur: 3.4 };
    await hold(3000);
    clearInterval(trail); S.spot = null;
    hideTelop(); stopSong();
    await hold(900);
    S.step = 'after';
    await afterLaunch();
  }
  function tweenAurora() { const o = { k: 0 }; const t0 = performance.now(); const step = () => { const u = (performance.now() - t0) / 3500; auroraK = u < 1.5 / 3.5 ? .2 * easeInOut(u / (1.5 / 3.5)) : .2 * (1 - easeInOut(clamp((u - 1.5 / 3.5) / (2 / 3.5), 0, 1))); if (u < 1) requestAnimationFrame(step); else auroraK = 0; }; step(); }

  async function afterLaunch() {
    await say('kimo', '出た……！　船、出たケン！');
    await say('kimo', '……失礼。見事な船出ですね。');
    await say('freezy', `${NEO}の言葉は、ちゃんと歌になった。また聴かせてくれ。`);
    await say('kimo', 'では、私も。');
    // KIMORIN's ship leaves the harbor and comes into the friends' sea
    const rp = RISE(); const mid = lanePos(1, Math.PI / 2 - .5);
    const k = { id: 'kimo', who: 'kimo', song: 'kimo', style: 'kimorin', lane: 1, ang: Math.PI / 2 - .5, phase: 2.2, fs: -1, fsT: -1, boost: 1, vis: 1, sail: 1, glow: 1, listened: false, wobble: 0, captain: 1, wave: 0, mode: 'rise', fx: rp.x + 14, fy: rp.y + 6, rise: 60, flag: '#c42a44' };
    ships.push(k);
    ripples.push({ x: k.fx, y: k.fy, t0: T, dur: 1.3, r0: 8, r1: 70 });
    spawnSplash(k.fx, k.fy, 24); splashSound();
    if (R) k.rise = 0; else await tween(k, { rise: 0 }, 700, easeOutBack);
    tween(k, { wave: 1 }, 1500, (u) => u);
    await wait(500);
    k.mode = 'join'; k.jk = 0; k.fx = k.x; k.fy = k.y; k.boost = 2.5; makeRoom(1, k);
    S.kimoIn = true; S.step = 'free';
    $('oshi').classList.add('glow'); setTimeout(() => $('oshi').classList.remove('glow'), 3200);
    nav.classList.remove('hide');
    $('cta-t').textContent = 'myアイランドをつくる'; $('cta-ico').innerHTML = SVG.isle; cta.classList.add('teal');
    showGuide('上の<b>〔推しの海〕</b>に、ダチの船が入ってきます。<br>タップすると聴けます（押した時だけ鳴ります）');
    setTimeout(() => { if (S.step === 'free' && !S.sheet) { S.hintShip = k; S.hintFrom = performance.now(); S.hintUntil = performance.now() + 5000; } }, 1800);
  }

  // ---------------------------------------------------------------- intro / arrival
  $('start').addEventListener('click', async () => {
    audio(); chime(76, 0, .05); chime(83, .15, .05);
    $('iv').classList.remove('show');
    S.step = 'arrive';
    if (!R) { camBusy = true; await tween(cam, { y: H / 2 }, 1200, easeInOut); camBusy = false; } else cam.y = H / 2;
    nav.classList.remove('hide'); cta.classList.add('breathe');
    S.step = 'sea';
    // {bati}: first five seconds, over the nearest friend's ship
    const near = ships.filter((s) => s.mode === 'lane').sort((a, b) => b.y - a.y)[0];
    S.hintShip = near; S.hintFrom = performance.now(); S.hintUntil = performance.now() + 5000;
    await say('freezy', '次は、出航だ。お前の曲を、ダチの海に出す。');
    if (!S.sheet && !S.launched) showGuide('<b>〔🚢 出航させる〕</b>を押すと、曲が船になって、<br>ダチの海を88時間めぐります');
  });
  $('e-again').addEventListener('click', () => location.reload());
  $('e-stay').addEventListener('click', () => $('ev').classList.remove('show'));
  $('back').addEventListener('click', () => toast('この試作では、水星の外へは出ません'));
  $('t-sea').addEventListener('click', () => toast('いまは、海図です'));
  $('t-compose').addEventListener('click', () => toast('作曲の画面は、別の試作で'));
  $('t-island').addEventListener('click', () => toast('myアイランドは、このあと作ります'));
  $('snd').addEventListener('click', () => {
    if (!audio()) return; ambOn = !ambOn; ramp(amb.gain, ambOn ? .22 : 0, .8);
    $('snd').setAttribute('aria-pressed', String(ambOn)); $('snd').setAttribute('aria-label', ambOn ? '波の音（いまはオン）' : '波の音（いまはオフ）');
    $('snd-x').style.display = ambOn ? 'none' : '';
  });

  // ---------------------------------------------------------------- boot
  window.addEventListener('resize', resize);
  resize();
  cam.y = R ? H / 2 : H / 2 - 210; // start looking up at the aurora behind the start card
  for (const sh of ships) { const p = lanePos(sh.lane, sh.ang); sh.x = p.x; sh.y = p.y; sh.s = scaleAt(sh.y); sh.fsT = -Math.sin(sh.ang) > 0 ? 1 : -1; sh.fs = sh.fsT; }
  $('iv').classList.add('show');
  requestAnimationFrame(draw); discLoop();
  window.__mercury = {
    S, get step() { return S.step; }, cam,
    ships: () => ships.map((s) => { const p = toScreen(s.x, s.y - 60 * s.s); return { id: s.id, x: p.x, y: p.y, s: s.s, mode: s.mode, front: s.s > .8 }; }),
    playing: () => !!playing, ended: () => !!(cur && cur.ended),
  };
})();
</script>
</body>
</html>
