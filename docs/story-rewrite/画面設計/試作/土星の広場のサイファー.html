<title>土星の広場のサイファー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* Layout: phone-height club stage — glass header with the "ON MIC" pill, the round stage (canvas), karaoke lyric over it, NEXT queue and the big mic button. Saturn plaza at night, gold + neon. */
:root {
  --night: #09081a;
  --night-2: #151436;
  --gold: #ffd28a;
  --gold-deep: #c58a3e;
  --pink: #ff5fb8;
  --cyan: #4fe3ff;
  --violet: #8b6bff;
  --ink: #fff6ea;
  --ink-dim: #b3aed6;
  --line: rgba(255,255,255,.10);
  --font-pop: "Dela Gothic One", "Zen Maru Gothic", "Hiragino Sans", sans-serif;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
.app { height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--night); isolation: isolate; }
.stage { position: absolute; inset: 0; z-index: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }

/* header */
.top { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(9,8,26,.92), rgba(9,8,26,.35) 80%, transparent); }
.back { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer; padding: 0; backdrop-filter: blur(8px); }
.title { flex: 1; min-width: 0; }
.title .kicker { font-family: var(--font-pop); font-size: .62rem; letter-spacing: .28em; color: var(--gold); }
.title .name { font-family: var(--font-pop); font-size: 1.28rem; letter-spacing: .04em; line-height: 1.15; background: linear-gradient(90deg, #fff, var(--gold) 45%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-pop); font-size: .64rem; letter-spacing: .12em; padding: 6px 10px; border-radius: 999px; background: rgba(255,95,184,.14); border: 1px solid rgba(255,95,184,.5); color: #ffd1ea; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 10px var(--pink); animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* on-mic pill + lyric */
.onmic { position: relative; z-index: 3; align-self: center; margin-top: 2px; display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 5px; border-radius: 999px; background: linear-gradient(90deg, rgba(139,107,255,.35), rgba(255,95,184,.3)); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(139,107,255,.25); opacity: 0; transform: translateY(-6px) scale(.96); transition: opacity .3s, transform .3s; }
.onmic.show { opacity: 1; transform: none; }
.onmic img { width: 30px; height: 30px; object-fit: contain; border-radius: 50%; background: rgba(0,0,0,.25); }
.onmic .tag { font-family: var(--font-pop); font-size: .58rem; letter-spacing: .2em; color: var(--cyan); }
.onmic .nm { font-family: var(--font-display); font-weight: 900; font-size: .9rem; }
.lyric { position: relative; z-index: 3; margin: 8px auto 0; width: 88%; min-height: 4.2em; text-align: center; pointer-events: none; font-family: var(--font-pop); font-size: clamp(1.15rem, 5.4vw, 1.6rem); line-height: 1.35; letter-spacing: .02em; }
.lyric .ch { color: rgba(255,246,234,.35); transition: color .12s, text-shadow .12s; }
.lyric .ch.on { color: #fff; text-shadow: 0 0 14px rgba(255,210,138,.85), 0 0 2px #fff; }
.lyric .note { color: var(--gold); }
.lyric.chorus { font-size: clamp(2.2rem, 11vw, 3.2rem); }
.lyric.chorus .ch.on { background: linear-gradient(90deg, var(--gold), var(--pink), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 12px rgba(255,95,184,.55)); }
.spacer { flex: 1; }

/* bottom */
.bottom { position: relative; z-index: 3; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; align-items: center; background: linear-gradient(0deg, rgba(9,8,26,.96) 55%, rgba(9,8,26,0)); }
.queue { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.queue .lbl { font-family: var(--font-pop); font-size: .6rem; letter-spacing: .24em; color: var(--ink-dim); }
.queue .q { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.07); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; transition: transform .3s; }
.queue .q img { width: 34px; height: 34px; object-fit: contain; }
.queue .q:first-of-type { border-color: rgba(79,227,255,.6); box-shadow: 0 0 12px rgba(79,227,255,.35); transform: scale(1.08); }
.micbtn { position: relative; width: 100%; max-width: 340px; height: 62px; border-radius: 999px; border: 0; cursor: pointer; padding: 0; font-family: var(--font-pop); font-size: 1.1rem; letter-spacing: .1em; color: #2a1606; background: linear-gradient(100deg, #fff0cf, var(--gold) 40%, var(--gold-deep)); box-shadow: 0 10px 30px rgba(197,138,62,.35), inset 0 1px 0 rgba(255,255,255,.7); }
.micbtn::before { content: ""; position: absolute; inset: -3px; border-radius: inherit; padding: 3px; background: conic-gradient(from var(--a, 0deg), var(--pink), var(--cyan), var(--violet), var(--gold), var(--pink)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .9; }
.micbtn.on { color: #fff; background: linear-gradient(100deg, #3b1d5e, #6b2a7a 50%, #2a1f6a); box-shadow: 0 10px 30px rgba(255,95,184,.3); }
.micbtn .wave { position: absolute; inset: 0; border-radius: inherit; border: 2px solid rgba(255,95,184,.6); opacity: 0; pointer-events: none; }
.micbtn.on .wave { animation: wave 1.8s ease-out infinite; }
.micbtn.on .wave:nth-child(2) { animation-delay: .9s; }
@keyframes wave { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(1.12, 1.5); } }
.hint { margin: 0; font-size: .68rem; color: var(--ink-dim); text-align: center; line-height: 1.6; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .live i, .micbtn.on .wave { animation: none; } }
</style>

<div class="app">
  <div class="stage" id="stage"><canvas id="cv" role="img" aria-label="円いステージのまわりにコロリンが並び、まん中にスタンドマイク。タップしたコロリンがマイクの前で歌う"></canvas></div>
  <header class="top">
    <button class="back" aria-label="もどる">‹</button>
    <div class="title"><div class="kicker">SATURN PLAZA</div><div class="name">土星の広場</div></div>
    <span class="live"><i></i>CYPHER</span>
  </header>
  <div class="onmic" id="onmic" aria-live="polite"><img id="onmic-img" alt=""><div><div class="tag">ON MIC</div><div class="nm" id="onmic-name"></div></div></div>
  <div class="lyric" id="lyric" aria-live="polite"></div>
  <div class="spacer"></div>
  <footer class="bottom">
    <div class="queue" id="queue" aria-label="次に歌うコロリン"></div>
    <button class="micbtn" id="cypher"><span class="wave"></span><span class="wave"></span><span id="btn-label">🎤 サイファーを始める</span></button>
    <p class="hint">一つずつマイクの前に出て歌いつなぐ。最後の「♪オー！」はみんなで。コロリンをタップすると、そのコロリンだけ歌う。</p>
  </footer>
</div>

  function resize() {

    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    F = Math.min(W / (ART.rx * 2 + 70), H / ART.h * 1.15);
    OX = W / 2 - ART.cx * F; OY = H * .60 - ART.cy * F;
  }
  addEventListener('resize', resize);
  const X = (x) => OX + x * F, Y = (y) => OY + y * F;
  function spot(i) { const n = crew.length, t = -Math.PI / 2 + (i + .5) * (2 * Math.PI / n); return [ART.cx + Math.cos(t) * ART.rx * .78, ART.cy + Math.sin(t) * ART.ry * .8]; }
  const micFront = () => [ART.mic[0], ART.mic[1] + ART.ry * .3];

  // ---------- state ----------
  let singer = -1, hopT = 0, hopFrom = null, hopTo = null, phase = 'idle', chorus = false, energy = 0, tok = 0, chorusAt = 0;
  const pos = crew.map((_, i) => spot(i));
  let landAt = -1, landPos = null;

  // ---------- particles (slow sparkles; a soft burst at the chorus — never a flash) ----------
  const parts = [];
  function sparkle(x, y, n, spread, up) {
    if (reduce) return;
    const cols = ['#ffd28a', '#ff5fb8', '#4fe3ff', '#ffffff', '#8b6bff'];
    for (let k = 0; k < n; k++) parts.push({ x, y, vx: (Math.random() - .5) * spread, vy: -Math.random() * up - 20, life: 1, c: cols[k % cols.length], r: 2 + Math.random() * 3, rot: Math.random() * 6 });
  }

  // ---------- sound (preview voice; the app plays each kororin's own voice) ----------
  function speak(c, text, onProgress) {
    return new Promise((done) => {
      const est = 900 + text.length * 150, start = performance.now();
      let fin = false; const end = () => { if (!fin) { fin = true; clearInterval(iv); onProgress && onProgress(1); done(); } };
      const iv = setInterval(() => onProgress && onProgress(Math.min(.98, (performance.now() - start) / est)), 60);
      if (!('speechSynthesis' in window)) { setTimeout(end, est); return; }
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP'; u.pitch = c.voice.pitch; u.rate = c.voice.rate;
        u.onboundary = (e) => { if (onProgress && e.charIndex != null) onProgress(Math.min(.98, e.charIndex / text.length)); };
        u.onend = end; u.onerror = end; setTimeout(end, 1800 + text.length * 260);
        speechSynthesis.speak(u);
      } catch (e) { setTimeout(end, est); }
    });
  }

  // ---------- lyric / on-mic / queue ----------
  const lyric = document.getElementById('lyric'), onmic = document.getElementById('onmic');
  function setLyric(text, chor) {
    lyric.classList.toggle('chorus', !!chor);
    lyric.innerHTML = `<span class="note">♪ </span>` + [...text].map((ch) => `<span class="ch">${esc(ch)}</span>`).join('') + `<span class="note"> ♪</span>`;
  }
  function lightLyric(p) { const chs = lyric.querySelectorAll('.ch'); const n = Math.round(chs.length * p); chs.forEach((el, k) => el.classList.toggle('on', k < n)); }
  function showOnMic(c) { document.getElementById('onmic-img').src = srcFor(c) || ''; document.getElementById('onmic-name').textContent = c.who; onmic.classList.add('show'); }
  function hideOnMic() { onmic.classList.remove('show'); }
  const queue = document.getElementById('queue');
  function setQueue(from) {
    const next = crew.slice(from, from + 4);
    queue.innerHTML = next.length ? '<span class="lbl">NEXT</span>' + next.map((c) => `<span class="q"><img src="${srcFor(c) || ''}" alt="${esc(c.who)}"></span>`).join('') : '<span class="lbl">ALL TOGETHER</span>';
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  function hop(i, from, to, ms) {
    return new Promise((done) => { hopFrom = from; hopTo = to; hopT = performance.now(); singer = i; phase = 'hop'; setTimeout(() => { pos[i] = to.slice(); phase = 'stand'; landAt = performance.now(); landPos = to.slice(); sparkle(X(to[0]), Y(to[1]), 10, 160, 60); done(); }, reduce ? 0 : ms); });
  }
  async function sing(i, myTok) {
    const c = crew[i];
    showOnMic(c);
    await hop(i, spot(i), micFront(), 650);
    if (myTok !== tok) return;
    phase = 'sing'; setLyric(c.text); lightLyric(0);
    await speak(c, c.text, lightLyric);
    if (myTok !== tok) return;
    await wait(250); lyric.innerHTML = '';
    await hop(i, micFront(), spot(i), 600);
    singer = -1; phase = 'idle'; hideOnMic();
  }
  const btn = document.getElementById('cypher'), label = document.getElementById('btn-label');
  async function cypher() {
    if (btn.classList.contains('on')) { stop(); return; }
    stop(); const my = ++tok; btn.classList.add('on'); label.textContent = '■ ストップ';
    for (let i = 0; i < crew.length; i++) {
      if (my !== tok) return;
      setQueue(i + 1);
      await sing(i, my);
      await wait(120);
    }
    if (my !== tok) return;
    chorus = true; chorusAt = performance.now(); setLyric('オー！', true); lightLyric(1);
    sparkle(X(ART.cx), Y(ART.cy) - 120 * F, 70, 520, 380);
    await speak({ voice: { pitch: 1.25, rate: 1 } }, 'オー！');
    await wait(1100); chorus = false; lyric.innerHTML = '';
    stop();
  }
  function stop() {
    tok++; try { speechSynthesis.cancel(); } catch (e) {}
    crew.forEach((_, i) => { pos[i] = spot(i); });
    singer = -1; phase = 'idle'; chorus = false; lyric.innerHTML = ''; hideOnMic(); setQueue(0);
    btn.classList.remove('on'); label.textContent = '🎤 サイファーを始める';
  }
  btn.addEventListener('click', cypher);

  // ---------- drawing ----------
  let hits = [];
  function drawSky(now) {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#120f33'); g.addColorStop(.5, '#22163f'); g.addColorStop(1, '#0b0a1d');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // stars
    let seed = 3; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let k = 0; k < 110; k++) { const x = rnd() * W, y = rnd() * H * .6, tw = .4 + .6 * Math.abs(Math.sin(now / 1200 + k)); ctx.fillStyle = `rgba(255,255,255,${(.15 + rnd() * .5) * tw})`; ctx.fillRect(x, y, 1.6, 1.6); }
    // rings across the whole sky
    ctx.save(); ctx.translate(W * .5, H * .26); ctx.rotate(-.16); ctx.scale(1, .2);
    for (let k = 0; k < 7; k++) { ctx.beginPath(); ctx.arc(0, 0, W * (.75 + k * .07), 0, Math.PI * 2); ctx.strokeStyle = `rgba(${k % 2 ? '255,210,138' : '200,180,255'},${.20 - k * .022})`; ctx.lineWidth = W * .035; ctx.stroke(); }
    ctx.restore();
    // the temple behind, as a soft silhouette
    ctx.save(); ctx.translate(W * .5, Y(ART.cy - ART.ry) - 4);
    ctx.fillStyle = 'rgba(70,40,60,.85)';
    [[.62, 70], [.46, 120], [.3, 165]].forEach(([w, h], k) => { ctx.beginPath(); ctx.ellipse(0, -h, W * w / 2, 26 + k * 4, 0, Math.PI, 0); ctx.fillRect(-W * w / 2, -h, W * w, h); ctx.fill(); });
    ctx.restore();
  }
  function drawStageFallback() {
    ctx.save(); ctx.translate(X(ART.cx), Y(ART.cy) + 46 * F); ctx.scale(1, ART.ry / ART.rx);
    ctx.beginPath(); ctx.arc(0, 0, ART.rx * F, 0, Math.PI * 2); ctx.fillStyle = '#2a1830'; ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(X(ART.cx), Y(ART.cy)); ctx.scale(1, ART.ry / ART.rx);
    const sg = ctx.createRadialGradient(0, -80 * F, 20, 0, 0, ART.rx * F); sg.addColorStop(0, '#5b3a62'); sg.addColorStop(.7, '#3a2448'); sg.addColorStop(1, '#2a1838');
    ctx.beginPath(); ctx.arc(0, 0, ART.rx * F, 0, Math.PI * 2); ctx.fillStyle = sg; ctx.fill();
    ctx.lineWidth = 8 * F; ctx.strokeStyle = '#ffd28a'; ctx.stroke();
    for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.arc(0, 0, ART.rx * F * (1 - k * .18), 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,210,138,.18)'; ctx.lineWidth = 2 * F; ctx.stroke(); }
    ctx.restore();
  }
  function drawMic(now) {
    const [mx, my] = ART.mic, glow = singer >= 0 && phase === 'sing' ? 1 : 0;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(X(mx), Y(my), 46 * F, 15 * F, 0, 0, Math.PI * 2); ctx.fillStyle = '#7a5226'; ctx.fill();
    const sg = ctx.createLinearGradient(X(mx) - 6, 0, X(mx) + 6, 0); sg.addColorStop(0, '#9a6a2c'); sg.addColorStop(.5, '#ffe2a8'); sg.addColorStop(1, '#9a6a2c');
    ctx.strokeStyle = sg; ctx.lineWidth = 9 * F; ctx.beginPath(); ctx.moveTo(X(mx), Y(my)); ctx.lineTo(X(mx), Y(my - 250)); ctx.stroke();
    if (glow) { ctx.shadowColor = 'rgba(255,210,138,.9)'; ctx.shadowBlur = 30 * F; }
    const hg = ctx.createRadialGradient(X(mx) - 8 * F, Y(my - 285) - 10 * F, 2, X(mx), Y(my - 280), 40 * F); hg.addColorStop(0, '#fff3d0'); hg.addColorStop(.6, '#e0b060'); hg.addColorStop(1, '#8a5a22');
    ctx.beginPath(); ctx.ellipse(X(mx), Y(my - 280), 28 * F, 38 * F, 0, 0, Math.PI * 2); ctx.fillStyle = hg; ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(80,50,20,.5)'; ctx.lineWidth = 1.2 * F;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(X(mx) - 26 * F, Y(my - 280 + k * 12)); ctx.lineTo(X(mx) + 26 * F, Y(my - 280 + k * 12)); ctx.stroke(); }
    ctx.restore();
  }
  function drawBeams(now) {
    // two soft spotlights sweep slowly from above; they settle on the mic while someone sings
    const sing = singer >= 0 && phase === 'sing';
    [[-1, '#ff5fb8'], [1, '#4fe3ff']].forEach(([side, col], k) => {
      const ox = W / 2 + side * W * .42, oy = -20;
      const sway = reduce ? 0 : Math.sin(now / 1900 + k * 2) * (sing ? .03 : .22);
      const [fx, fy] = micFront(); const tx = X(fx) + side * (sing ? 10 : 140 * F) + sway * W, ty = Y(fy);
      const g = ctx.createLinearGradient(ox, oy, tx, ty); g.addColorStop(0, col + '00'); g.addColorStop(.35, col + (sing ? '2a' : '18')); g.addColorStop(1, col + (sing ? '40' : '20'));
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(ox - 10, oy); ctx.lineTo(ox + 10, oy); ctx.lineTo(tx + 90 * F, ty); ctx.lineTo(tx - 90 * F, ty); ctx.closePath(); ctx.fill();
    });
  }
  function drawRim(now) {
    // equalizer bars around the stage edge, louder while someone sings
    ctx.save(); ctx.translate(X(ART.cx), Y(ART.cy)); ctx.scale(1, ART.ry / ART.rx);
    const n = 48;
    for (let k = 0; k < n; k++) {
      const t = k / n * Math.PI * 2;
      const lvl = reduce ? .3 : Math.max(.08, (Math.sin(now / 140 + k * 1.7) * .5 + .5) * (.25 + energy * .75));
      const r0 = ART.rx * 1.02 * F, r1 = r0 + lvl * 46 * F;
      const hue = (k / n * 360 + now / 40) % 360;
      ctx.strokeStyle = `hsla(${hue}, 95%, 70%, ${.25 + energy * .55})`; ctx.lineWidth = 6 * F; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(Math.cos(t) * r0, Math.sin(t) * r0); ctx.lineTo(Math.cos(t) * r1, Math.sin(t) * r1); ctx.stroke();
    }
    // chasing lights on the rim
    for (let k = 0; k < 40; k++) {
      const t = k / 40 * Math.PI * 2, on = (Math.sin(now / 220 - k * .6) + 1) / 2;
      ctx.beginPath(); ctx.arc(Math.cos(t) * ART.rx * .965 * F, Math.sin(t) * ART.rx * .965 * F, 5 * F, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,230,170,${.2 + on * .6})`; ctx.fill();
    }
    ctx.restore();
  }
  function draw(now) {
    if (!W) resize();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const target = phase === 'sing' ? 1 : chorus ? 1 : singer >= 0 ? .5 : .12;
    energy += (target - energy) * .06;
    if (stageArt && stageArt.complete && stageArt.naturalWidth) { const s = Math.max(W / ART.w, H / ART.h); ctx.drawImage(stageArt, X(0), Y(0), ART.w * F, ART.h * F); }
    else { drawSky(now); drawStageFallback(); }
    drawBeams(now);
    drawRim(now);
    // spotlight pool at the mic
    const [fx, fy] = micFront();
    const pool = ctx.createRadialGradient(X(fx), Y(fy), 4, X(fx), Y(fy), 230 * F); pool.addColorStop(0, `rgba(255,236,190,${.08 + energy * .25})`); pool.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.fillStyle = pool; ctx.beginPath(); ctx.ellipse(X(fx), Y(fy), 230 * F, 100 * F, 0, 0, Math.PI * 2); ctx.fill();
    // kororins and the mic, back to front
    const items = crew.map((c, i) => ({ c, i, p: currentPos(i, now) }));
    items.push({ mic: true, p: ART.mic });
    items.sort((a, b) => a.p[1] - b.p[1]);
    hits = [];
    const beat = Math.sin(now / 230);
    for (const it of items) {
      if (it.mic) { drawMic(now); continue; }
      const { c, i, p } = it;
      const isSinger = i === singer && phase === 'sing';
      const depth = .8 + .38 * ((p[1] - (ART.cy - ART.ry)) / (2 * ART.ry));
      let size = 158 * F * depth, lift = p[2] || 0, sx2 = 1, sy2 = 1;
      if (isSinger && !reduce) { const b = Math.sin(now / 95); size *= 1.14; lift += 8 * F * Math.abs(b); sx2 = 1 + .04 * b; sy2 = 1 - .04 * b; }
      else if (!reduce) { const b = Math.max(0, beat * (i % 2 ? 1 : -1)); lift += (chorus ? 22 : 4) * F * b; }
      if (i === singer && landAt > 0 && now - landAt < 220 && !reduce) { const t = (now - landAt) / 220; sx2 *= 1 + .12 * (1 - t); sy2 *= 1 - .12 * (1 - t); }
      const sx = X(p[0]), sy = Y(p[1]);
      ctx.beginPath(); ctx.ellipse(sx, sy, size * .33, size * .1, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.fill();
      const pic = picFor(c, isSinger || chorus);
      if (pic && pic.complete && pic.naturalWidth) {
        const h = size * sy2, w = size * sx2 * pic.naturalWidth / pic.naturalHeight, top = sy - h * .93 - lift;
        if (isSinger) { ctx.save(); ctx.shadowColor = 'rgba(255,170,220,.85)'; ctx.shadowBlur = 28 * F; ctx.drawImage(pic, sx - w / 2, top, w, h); ctx.restore(); }
        else ctx.drawImage(pic, sx - w / 2, top, w, h);
        hits.push({ i, x0: sx - w / 2, x1: sx + w / 2, y0: top, y1: sy + 4 });
      }
    }
    // particles
    const dt = 1 / 60;
    for (let k = parts.length - 1; k >= 0; k--) {
      const q = parts[k]; q.vy += 240 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt * .55; q.rot += dt * 4;
      if (q.life <= 0) { parts.splice(k, 1); continue; }
      ctx.save(); ctx.globalAlpha = Math.min(1, q.life * 1.4); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.c; ctx.fillRect(-q.r, -q.r * .5, q.r * 2, q.r); ctx.restore();
    }
    if (!reduce && energy > .6 && Math.random() < .25) sparkle(X(fx) + (Math.random() - .5) * 200 * F, Y(fy) - 260 * F, 1, 60, 30);
  }
  function currentPos(i, now) {
    if (i === singer && phase === 'hop' && hopFrom && hopTo) {
      const t = reduce ? 1 : Math.min(1, (now - hopT) / 650);
      const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      return [hopFrom[0] + (hopTo[0] - hopFrom[0]) * e, hopFrom[1] + (hopTo[1] - hopFrom[1]) * e, Math.sin(Math.PI * t) * 110 * F];
    }
    return pos[i];
  }
  cv.addEventListener('click', (e) => {
    const r = cv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
    for (let k = hits.length - 1; k >= 0; k--) { const h = hits[k]; if (x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1) { stop(); const my = ++tok; sing(h.i, my); break; } }
  });
  function tick(t) { draw(t); requestAnimationFrame(tick); }
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  // rotating border on the mic button
  if (!reduce) { let a = 0; setInterval(() => { a = (a + 3) % 360; btn.style.setProperty('--a', a + 'deg'); }, 40); }
  setQueue(0); resize(); requestAnimationFrame(tick);
})();
</script>
