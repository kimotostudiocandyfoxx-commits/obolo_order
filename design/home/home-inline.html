<title>星のホーム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Dela+Gothic+One&display=swap">
<style>
/* layout: a phone-sized planet home (scene + glass UI), the planet switcher above it shows the same template on every planet */
:root{
  --ink:#fffaf2; --ink-dim:rgba(255,250,242,.72); --glass:rgba(34,18,52,.34); --glass-strong:rgba(34,18,52,.5);
  --line:rgba(255,255,255,.38); --shade:rgba(20,10,40,.45); --page:#140f22; --accent:#ffb36b;
  --dachi:#ffffff; --oshi:#ff8fc8; --mine:#ffd36b;
  --f-body:'Zen Maru Gothic',system-ui,'Hiragino Maru Gothic ProN',sans-serif; --f-title:'Dela Gothic One','Zen Maru Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;flex-direction:column;align-items:center;gap:10px;box-sizing:border-box}
.switch{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:430px}
.switch button{font:700 12px var(--f-body);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.switch button[aria-pressed=true]{background:var(--accent);color:#2a1630;border-color:transparent}
.phone{position:relative;width:min(100%,420px);aspect-ratio:9/16;max-height:calc(100% - 64px);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000;flex:0 0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bg{position:absolute;inset:0;background-size:cover;background-position:center bottom;transform:scale(1.04);transition:transform 8s ease-out}
.phone.zoom .bg{transform:scale(1.12)}
.sky{position:absolute;inset:0}
.top{position:absolute;inset:0 0 auto;padding:16px 16px 0;display:flex;flex-direction:column;gap:8px;z-index:5}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl{font-family:var(--f-title);font-size:26px;letter-spacing:.04em;text-shadow:0 2px 12px var(--shade)}
.ttl small{display:block;font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.12em;opacity:.85}
.pill{font:700 12px var(--f-body);color:var(--ink);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.say{font-size:12.5px;line-height:1.55;font-weight:700;transition:max-height .4s,opacity .4s,padding .4s;max-height:120px;overflow:hidden;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:9px 12px;max-width:94%;text-shadow:0 1px 6px var(--shade)}
.say b{color:var(--accent)}
.say.mini{max-height:0;opacity:0;padding-block:0;border-width:0}
.help{width:30px;height:30px;justify-content:center;padding:0}
.item{position:absolute;width:var(--s,74px);height:var(--s,74px);margin:calc(var(--s,74px)/-2);cursor:pointer;z-index:3;animation:bob var(--d,6s) ease-in-out infinite;animation-delay:var(--dl,0s);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.item img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.item .tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);white-space:nowrap;font:700 10px var(--f-body);padding:2px 7px;border-radius:999px;background:rgba(20,10,30,.55);border:1px solid var(--c,var(--dachi));color:var(--ink)}
.item.new::after{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 60%);animation:twinkle 1.8s ease-in-out infinite}
.item.far{--s:30px;opacity:.55;filter:blur(.4px);z-index:2;animation-duration:11s}
.item.far .tag{display:none}
@keyframes bob{0%,100%{translate:0 0}25%{translate:6px -9px}50%{translate:-4px -3px}75%{translate:-7px -11px}}
@keyframes twinkle{0%,100%{opacity:.2;scale:.8}50%{opacity:1;scale:1.1}}
.home{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:62%;height:30%;border-radius:50%;cursor:pointer;z-index:2}
.home::before{content:"";position:absolute;inset:18% 10%;border-radius:50%;border:2px solid rgba(255,255,255,.65);animation:ring 2.4s ease-out infinite;opacity:0}
@keyframes ring{0%{opacity:.8;scale:.7}100%{opacity:0;scale:1.25}}
.plate{position:absolute;left:50%;bottom:calc(16% - 8px);transform:translateX(-50%);font:900 13px var(--f-body);padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.88);color:#2a1630;z-index:3;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 16px 18px;display:flex;gap:10px;justify-content:center;z-index:5}
.cta{font:900 16px var(--f-body);color:#2a1630;background:var(--accent);border:0;border-radius:999px;padding:14px 22px;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.12);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.ghost{font:700 14px var(--f-body);color:var(--ink);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:13px 16px;cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:rgba(28,18,44,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:10px 18px 22px;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.25,1.1)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.who{display:flex;align-items:center;gap:10px}
.who img{width:56px;height:56px;object-fit:contain}
.who .n{font-weight:900;font-size:16px}
.chip{font:700 11px var(--f-body);padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.card{margin-top:12px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid var(--line);aspect-ratio:16/10;display:grid;place-items:center;position:relative}
.card .big{font-size:42px}
.card .cap{position:absolute;left:12px;right:12px;bottom:10px;font-weight:700;font-size:13px;text-align:center;text-shadow:0 1px 6px var(--shade)}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;font:900 14px var(--f-body);border-radius:14px;padding:12px 8px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer}
.acts .heart[aria-pressed=true]{background:var(--oshi);color:#3a0f2a;border-color:transparent}
.menu{position:absolute;z-index:25;display:flex;flex-direction:column;gap:4px;background:rgba(28,18,44,.9);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:150px}
.menu button{font:700 13px var(--f-body);text-align:left;color:var(--ink);background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--glass)}
.inside{position:absolute;inset:0;z-index:15;background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--accent) 45%,#2a1638),#1c1028 70%);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.inside.on{opacity:1;pointer-events:auto}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:auto}
.shelf .w{aspect-ratio:1;border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.05));border:1px solid var(--line);display:grid;place-items:center;font-size:26px;position:relative}
.shelf .w small{position:absolute;bottom:6px;font:700 10px var(--f-body);opacity:.8}
.toast{position:absolute;left:50%;top:84px;transform:translate(-50%,-20px);z-index:30;font:900 13px var(--f-body);background:rgba(255,255,255,.92);color:#2a1630;border-radius:999px;padding:8px 14px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.needle{position:absolute;z-index:4;font:900 12px var(--f-body);background:rgba(255,255,255,.9);color:#2a1630;border-radius:14px;padding:7px 11px;max-width:72%;left:50%;top:44%;transform:translate(-50%,0);opacity:0;transition:opacity .3s;text-align:center;pointer-events:none}
.needle.on{opacity:1}
.spin{position:absolute;left:50%;bottom:20%;width:56%;aspect-ratio:2.2;transform:translateX(-50%);border-radius:50%;background:repeating-radial-gradient(ellipse at center,rgba(255,255,255,.0) 0 6px,rgba(255,255,255,.12) 6px 7px);opacity:0;z-index:2;pointer-events:none;transition:opacity .4s}
.spin.on{opacity:1;animation:spin 1.6s linear infinite}
@keyframes spin{to{background-position:0 0;filter:hue-rotate(40deg)}}
@media (prefers-reduced-motion:reduce){.item,.item.new::after,.home::before,.spin.on{animation:none}.bg{transition:none}}
button:focus-visible,.item:focus-visible,.home:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
<div class="switch" id="switch" role="toolbar" aria-label="星を切りかえる"></div>
<div class="phone" id="phone">
  <div class="bg" id="bg"></div>
  <div class="spin" id="spin"></div>
  <div class="sky" id="sky"></div>
  <div class="home" id="home" role="button" tabindex="0" aria-label="自分の場所"></div>
  <div class="plate" id="plate"></div>
  <div class="needle" id="needle"></div>
  <div class="top">
    <div class="row"><div class="ttl" id="ttl"></div><span style="display:flex;gap:6px"><button class="pill help" id="help" type="button" aria-label="この星の説明">？</button><button class="pill" id="oshiBtn" type="button">♡ 推し <span id="oshiN"></span></button></span></div>
    <div class="say" id="say"></div>
  </div>
  <div class="dock"><button class="cta" id="cta" type="button"></button><button class="ghost" id="fly" type="button">＋ 飛ばす</button></div>
  <div class="inside" id="inside"><div class="row"><div class="ttl" id="inTtl" style="font-size:22px"></div><button class="pill" id="inClose" type="button">← 外へ</button></div><div class="say" id="inSay"></div><div class="shelf" id="shelf"></div></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-label="作品"><div class="grab"></div><div id="sheetBody"></div></div>
  <div class="toast" id="toast"></div>
</div>

const $=id=>document.getElementById(id);
let cur='saturn', items=[], oshi=new Set(['たこ焼きシスター','nana']), playing=null;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
function sprite(k){return A['sp-'+k]||''}
function render(){
  const c=P[cur];document.documentElement.style.setProperty('--accent',c.accent);
  $('bg').style.backgroundImage=A['bg-'+cur]?`url(${A['bg-'+cur]})`:'linear-gradient(#335,#113)';
  $('ttl').innerHTML=`<small>${c.en}</small>${c.name}`;$('say').innerHTML=c.say;
  $('plate').textContent=`${ME}の${c.place}`;$('cta').textContent=c.cta;$('home').setAttribute('aria-label',`${ME}の${c.place}`);
  $('oshiN').textContent=oshi.size;
  const sky=$('sky');sky.innerHTML='';items=[];
  const spots=[[20,33],[72,31],[46,27],[84,44],[15,47],[58,41],[33,40]];
  const list=[...PEOPLE.filter(p=>p.k==='dachi'||oshi.has(p.n))];
  list.forEach((p,i)=>{const [x,y]=spots[i%spots.length];add({...p,x,y,i,isNew:i<2})});
  FAR.forEach((n,i)=>add({n,k:'far',x:[7,16,25,75,84,93][i],y:[53,56,51,52,57,54][i],i:i+7,far:1}));
  document.querySelectorAll('.switch button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===cur));
  closeAll();
  const s=$('say');s.classList.remove('mini');clearTimeout(s._t);s._t=setTimeout(()=>s.classList.add('mini'),4500);
}
function add(o){
  const c=P[cur],e=document.createElement('div');e.className='item'+(o.far?' far':'')+(o.isNew?' new':'');e.tabIndex=0;e.setAttribute('role','button');
  e.setAttribute('aria-label',`${o.n}の${c.thing}`);e.style.left=o.x+'%';e.style.top=o.y+'%';
  e.style.setProperty('--d',(5+(o.i%4)*1.3)+'s');e.style.setProperty('--dl',(-o.i*0.9)+'s');
  const col=o.k==='oshi'?'var(--oshi)':'var(--dachi)';e.style.setProperty('--c',col);
  e.innerHTML=`<img alt="" src="${sprite(c.sp)}"><span class="tag">${o.n}</span>`;
  let t;const open=()=>openSheet(o);
  e.addEventListener('pointerdown',ev=>{t=setTimeout(()=>{t=null;menu(o,ev)},480)});
  e.addEventListener('pointerup',()=>{if(t){clearTimeout(t);open()}});
  e.addEventListener('pointerleave',()=>clearTimeout(t));
  e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();open()}});
  $('sky').appendChild(e);items.push({o,e});
}
function openSheet(o){
  const c=P[cur],card=c.card(o.i||0),isO=oshi.has(o.n),far=o.k==='far';
  const kind=far?'<span class="chip" style="color:var(--ink-dim)">まだ知らない人</span>':o.k==='oshi'?'<span class="chip" style="color:var(--oshi)">推し</span>':'<span class="chip" style="color:var(--dachi)">ダチ</span>';
  $('sheetBody').innerHTML=`<div class="who"><img alt="" src="${sprite(c.sp)}"><div><div class="n">${o.n}</div>${kind}</div></div>
  <div class="card"><div class="big">${card.big}</div><div class="cap">${card.cap}</div></div>
  <div class="acts">${far||o.k==='oshi'?`<button class="heart" aria-pressed="${isO}" id="hb">${isO?'♥ 推し中':'♡ 推す'}</button>`:`<button id="pb">▶ ${cur==='jupiter'||cur==='uranus'?'見る':cur==='neptune'?'遊ぶ':cur==='pluto'?'読む':'聞く'}</button>`}<button id="cb">とじる</button></div>`;
  $('sheet').classList.add('on');
  const hb=$('hb');if(hb)hb.onclick=()=>{if(oshi.has(o.n)){oshi.delete(o.n);toast(o.n+' の推しを外した')}else{oshi.add(o.n);toast('♥ '+o.n+' を推した。次から、あなたの'+c.place+'にも来る')};render()};
  const pb=$('pb');if(pb)pb.onclick=()=>toast('▶ '+o.n+' の'+c.thing+' を再生中');
  $('cb').onclick=closeAll;
}
function menu(o,ev){
  closeAll();const r=$('phone').getBoundingClientRect(),m=document.createElement('div');m.className='menu';
  const x=Math.min(ev.clientX-r.left,r.width-170),y=Math.min(ev.clientY-r.top,r.height-150);m.style.left=x+'px';m.style.top=y+'px';
  m.innerHTML=`<button data-a="open">ひらく</button><button data-a="oshi">${oshi.has(o.n)?'推しを外す':'♡ 推す'}</button><button data-a="hide">見えなくする</button><button data-a="rep">通報する</button>`;
  m.onclick=e=>{const a=e.target.dataset.a;if(!a)return;m.remove();if(a==='open')openSheet(o);if(a==='oshi'){oshi.has(o.n)?oshi.delete(o.n):oshi.add(o.n);render()}if(a==='hide'){toast('見えなくした');const it=items.find(i=>i.o===o);it&&it.e.remove()}if(a==='rep')toast('通報した。ありがとう')};
  $('phone').appendChild(m);setTimeout(()=>document.addEventListener('pointerdown',function f(e){if(!m.contains(e.target)){m.remove();document.removeEventListener('pointerdown',f)}}),0);
}
function closeAll(){$('sheet').classList.remove('on');$('inside').classList.remove('on');document.querySelectorAll('.menu').forEach(m=>m.remove());stopPlay()}
function enter(){
  const c=P[cur];if(cur==='saturn'){playing?stopPlay():play();return}
  $('phone').classList.add('zoom');setTimeout(()=>$('phone').classList.remove('zoom'),700);
  $('inTtl').textContent=`${ME}の${c.inName}`;$('inSay').innerHTML=`ここには、あなたが作った<b>${c.thing}</b>が、<b>ずっと</b>あります。`;
  const ic={jupiter:['🌅','🍜','🐈','🌸','🌃','🗻'],mercury:['🎵','🎶','🎸','🎹','🥁','🎺'],mars:['🎬','🎞','📽','🎥','🌆','🛸'],venus:['📻','🎙','📼','🎧','📡','🌙'],uranus:['👕','☕','🧢','🏷','🖼','🧸'],pluto:['📖','📕','📗','📘','📙','📔'],neptune:['🕹','👾','🎮','🧩','🏝','⚡']}[cur];
  $('shelf').innerHTML=ic.map((x,i)=>`<div class="w">${x}<small>11/${26-i}</small></div>`).join('');
  $('inside').classList.add('on');
}
function play(){
  playing=true;$('spin').classList.add('on');$('cta').textContent='■ 止める';
  const q=items.filter(i=>!i.o.far);let k=0;
  const step=()=>{if(!playing)return;q.forEach(i=>i.e.style.transition='');const it=q[k%q.length];
    const save={l:it.e.style.left,t:it.e.style.top};it.e.style.transition='left .6s, top .6s';it.e.style.left='70%';it.e.style.top='58%';
    const card=P.saturn.card(it.o.i);$('needle').innerHTML=`🎤 ${it.o.n}<br>${card.cap}`;$('needle').classList.add('on');
    playing=setTimeout(()=>{it.e.style.left=save.l;it.e.style.top=save.t;$('needle').classList.remove('on');k++;playing=setTimeout(step,500)},2200)};
  step();
}
function stopPlay(){if(playing&&playing!==true)clearTimeout(playing);playing=null;$('spin').classList.remove('on');$('needle').classList.remove('on');$('cta').textContent=P[cur].cta}
$('switch').innerHTML=Object.entries(P).map(([k,c])=>`<button type="button" data-k="${k}">${c.name}</button>`).join('');
$('switch').onclick=e=>{const k=e.target.dataset.k;if(k){cur=k;render()}};
$('home').onclick=enter;$('home').onkeydown=e=>{if(e.key==='Enter')enter()};$('cta').onclick=enter;
$('inClose').onclick=closeAll;$('help').onclick=()=>{const s=$('say');s.classList.toggle('mini');clearTimeout(s._t)};$('oshiBtn').onclick=()=>toast('推し：'+[...oshi].join('・'));
$('fly').onclick=()=>toast('月の工房で作って、'+P[cur].name+'へ飛ばそう');
render();
</script>
