<title>星のホーム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Dela+Gothic+One&display=swap">
<style>
/* layout: a phone-sized planet home (scene + glass UI), the planet switcher above it shows the same template on every planet */
:root{
  --ink:#fffaf2; --ink-dim:rgba(255,250,242,.72); --glass:rgba(34,18,52,.34); --glass-strong:rgba(34,18,52,.5);

  --f-body:'Zen Maru Gothic',system-ui,'Hiragino Maru Gothic ProN',sans-serif; --f-title:'Dela Gothic One','Zen Maru Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;flex-direction:column;align-items:center;gap:10px;box-sizing:border-box}
.switch{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:430px}
.switch button{font:700 12px var(--f-body);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.switch button[aria-pressed=true]{background:var(--accent);color:#2a1630;border-color:transparent}
.phone{position:relative;width:min(100%,420px);aspect-ratio:9/16;max-height:calc(100% - 64px);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000;flex:0 0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bg{position:absolute;inset:0;background-size:cover;background-position:center bottom;transform:scale(1.04);transition:transform 8s ease-out}
.phone.zoom .bg,.phone.zoom .fg{transform:scale(1.12)}
.fg{position:absolute;inset:0;background-size:cover;background-position:center bottom;transform:scale(1.04);transition:transform 8s ease-out,filter .6s;z-index:7;pointer-events:none}
.partying .fg{filter:brightness(.5) saturate(1.3)}
.sky{position:absolute;inset:0}
.top{position:absolute;inset:0 0 auto;padding:16px 16px 0;display:flex;flex-direction:column;gap:8px;z-index:5}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl{font-family:var(--f-title);font-size:26px;letter-spacing:.04em;text-shadow:0 2px 12px var(--shade)}
.ttl small{display:block;font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.12em;opacity:.85}
.pill{font:700 12px var(--f-body);color:var(--ink);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.say{font-size:12.5px;line-height:1.55;font-weight:700;transition:max-height .4s,opacity .4s,padding .4s;max-height:120px;overflow:hidden;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:9px 12px;max-width:94%;text-shadow:0 1px 6px var(--shade)}
.say b{color:var(--accent)}
.say.mini{max-height:0;opacity:0;padding-block:0;border-width:0}
.help{width:30px;height:30px;justify-content:center;padding:0}
.item{position:absolute;width:var(--s,74px);height:var(--s,74px);margin:calc(var(--s,74px)/-2);cursor:pointer;z-index:3;animation:bob var(--d,6s) ease-in-out infinite;animation-delay:var(--dl,0s);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.item img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.item .tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);white-space:nowrap;font:700 10px var(--f-body);padding:2px 7px;border-radius:999px;background:rgba(20,10,30,.55);border:1px solid var(--c,var(--dachi));color:var(--ink)}
.item.new::after{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 60%);animation:twinkle 1.8s ease-in-out infinite}
.item.far{--s:30px;opacity:.55;filter:blur(.4px);z-index:2;animation-duration:11s}
.item.far .tag{display:none}
@keyframes bob{0%,100%{translate:0 0}25%{translate:6px -9px}50%{translate:-4px -3px}75%{translate:-7px -11px}}
@keyframes twinkle{0%,100%{opacity:.2;scale:.8}50%{opacity:1;scale:1.1}}
.home{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:62%;height:30%;border-radius:50%;cursor:pointer;z-index:2}

.res{position:absolute;bottom:13%;height:34%;z-index:4;cursor:pointer;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));transition:transform .2s}
.res img{height:100%;width:auto;display:block}
.res.l{left:-2%}.res.r{right:-2%}

.puni.popping{transition:transform .16s ease-out,opacity .16s;transform:translate(-50%,-50%) scale(1.35)!important;opacity:0}
.drop{position:absolute;width:9px;height:9px;margin:-4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,rgba(255,255,255,.4) 60%,transparent 70%);z-index:8;pointer-events:none;animation:drop .65s ease-out forwards}
@keyframes drop{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.chibi{position:absolute;width:150px;height:150px;margin:-120px 0 0 -75px;z-index:9;pointer-events:none;animation:chibiIn .45s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}

@keyframes chibiIn{0%{transform:translateY(40px) scale(.2);opacity:0}100%{transform:none;opacity:1}}
.chibi.wave{animation:wave .5s ease-in-out 2}

.chibi.away{transition:left .65s ease-in,top .65s ease-in,transform .65s ease-in,opacity .65s;transform:scale(.15);opacity:0}
.tint{position:absolute;inset:0;background:var(--rec,transparent);mix-blend-mode:screen;-webkit-mask-size:cover;mask-size:cover;-webkit-mask-position:center bottom;mask-position:center bottom;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;transform:scale(1.04);pointer-events:none;opacity:.85;z-index:1}
.swatch[hidden]{display:none}
.swatch{display:flex;gap:6px;align-items:center}

.swatch button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
.spinwrap{position:absolute;left:calc(47% - 70%);top:calc(69% - 13%);width:140%;height:26%;border-radius:50%;overflow:hidden;pointer-events:none;z-index:2;opacity:0;transition:opacity .5s;mix-blend-mode:screen}
.spinwrap.on{opacity:.8}
.spinner{position:absolute;left:50%;top:50%;width:140%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0deg 22deg,rgba(255,255,255,.35) 26deg,rgba(255,255,255,0) 32deg 60deg)}
.spinwrap.on .spinner{animation:recspin 2.2s linear infinite}
@keyframes recspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinwrap.on .spinner{animation:none}}
.puni .body{position:absolute;left:0;top:0;width:calc(var(--r)*2);height:calc(var(--r)*2);transform-origin:50% 88%;will-change:transform}
.puni .body img{width:100%;height:100%;object-fit:contain;pointer-events:none;border-radius:50%}
.face{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.face .eyes ellipse{fill:#2a1a22}.face .hl{fill:#fff}

.puni .body.k2 img{border-radius:50%;filter:drop-shadow(0 4px 5px rgba(30,10,50,.35))}.puni .body.k2 .face{position:absolute;inset:0}.puni .body.k2 .bname{top:84%}

.pick{position:absolute;inset:0;z-index:30;background:rgba(20,10,34,.78);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px}

.face .shades{opacity:0;transform-box:view-box;transform-origin:50% 51%;transform:translateY(-14px) scale(1.42);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.face .shades .lz{fill:#141018}.face .shades .lz.pk{fill:#3a1238}.face .shades .lz.rd{fill:#3d0f22}.face .shades .br{stroke:#141018;stroke-width:3}.face .shades .gl{stroke:rgba(255,255,255,.7);stroke-width:2;stroke-linecap:round}

.party{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .6s}

.party .lasers i:nth-child(1){--lc:#ff3df0;--a0:-38deg;--a1:-8deg}.party .lasers i:nth-child(2){--lc:#3dfcff;--a0:30deg;--a1:2deg;animation-duration:2.6s}

  const bass=(t0,fr)=>{const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=fr;f.type='lowpass';f.frequency.value=420;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.28,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+spb*.45);o.connect(f);f.connect(g);g.connect(out);o.start(t0);o.stop(t0+spb*.5)};
  const pad=t0=>{[220,277.2,329.6].forEach(fr=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=fr*(S.bass[0]/55);g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(.035,t0+.4);g.gain.linearRampToValueAtTime(.0001,t0+spb*15.5);o.connect(g);g.connect(out);o.start(t0);o.stop(t0+spb*16)})};
  BEAT={out,timer:setInterval(()=>{while(next<ac.currentTime+.2){const q=step%16;if(q%4===0)kick(next);if(q%4===2)hat(next,.18);else hat(next,.05);if(q%2===1)bass(next,S.bass[Math.floor(step/16)%4]);if(q===0&&step%64===0)pad(next);next+=spb/4;step++}},50)};
}
function clubStop(){if(!BEAT)return;clearInterval(BEAT.timer);const g=BEAT.out.gain;try{g.setTargetAtTime(0,AC.currentTime,.2)}catch(e){}BEAT=null}
function setCta(on){const b=$('cta');
  if(cur==='saturn'||(cur==='jupiter'&&A['bg3-jupiter'])||(cur==='mercury'&&A['bg3-mercury'])){b.className='cta disc'+(cur==='jupiter'?' jup':cur==='mercury'?' mer':'')+(on?' on':'');b.setAttribute('aria-label',on?'止める':'全部流す');
    b.innerHTML='<span class="rec"></span><span class="lbl"></span><svg viewBox="0 0 24 24" aria-hidden="true">'+(on?'<rect class="pl" x="6" y="6" width="12" height="12" rx="3"/>':'<path class="pl" d="M8.5 5.6c0-1.1 1.2-1.8 2.2-1.2l8.6 5.5c.9.6.9 1.9 0 2.5l-8.6 5.5c-1 .6-2.2-.1-2.2-1.2z"/>')+'</svg>';return}
  b.className='cta';b.removeAttribute('aria-label');b.textContent=P[cur].cta}
function play(){
  if(cur!=='saturn')return;
  SPIN=true;playing=true;setCta(true);clubStart();
  $('party').classList.add('on');$('spinwrap').classList.add('on');
  setTimeout(()=>{if(SPIN)$('phone').classList.add('partying')},900);
  const next=()=>{if(!SPIN)return;const ph=$('phone'),nx=NEEDLE[0]*ph.clientWidth,ny=NEEDLE[1]*ph.clientHeight;
    const live=rolls.filter(r=>!r.gone);
    if(!live.length&&!QUEUE.length){stopPlay();toast('🎉 今日のコロリン、全部聞いたね！');return}
    if(!live.length){playing=setTimeout(next,900);return}
    live.sort((p,q)=>Math.hypot(p.x-nx,p.y-ny)-Math.hypot(q.x-nx,q.y-ny));
    pop(live[0]);playing=setTimeout(next,3700)};
  playing=setTimeout(next,2200);
}
function stopPlay(){SPIN=false;if(playing&&playing!==true)clearTimeout(playing);playing=null;clubStop();const w=$('spinwrap');if(w)w.classList.remove('on');const pa=$('party');if(pa)pa.classList.remove('on');$('phone').classList.remove('partying');$('needle').classList.remove('on');setCta(false)}
$('switch').innerHTML=Object.entries(P).map(([k,c])=>`<button type="button" data-k="${k}">${c.name}</button>`).join('');

$('swatch').innerHTML='<small style="font:700 11px var(--f-body);opacity:.85">レコードの色</small>'+RECS.map(([n,c],i)=>`<button type="button" aria-label="${n}" aria-pressed="${i===0}" style="background:${c==='transparent'?'#111':c}" data-c="${c}"></button>`).join('');

$('help').onclick=()=>{const s=$('say');s.classList.toggle('mini');clearTimeout(s._t)};$('oshiBtn').onclick=()=>toast('推し：'+[...oshi].join('・'));
