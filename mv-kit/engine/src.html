<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MV</title>
<style>
/*FONTS*/
:root{--gold:#f3d38a;--gold2:#c9953b;--ink:#120c08;--panel:rgba(20,12,10,.72);--line:rgba(243,211,138,.28)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07040a;color:#f6ead2;font-family:'Zen Maru Gothic',sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* ---------- studio (making) ---------- */
#studio{position:absolute;inset:0;overflow-y:auto;background:
 radial-gradient(120% 60% at 50% -10%,#6b2a1a 0%,#2a0f10 45%,#0b0608 100%)}
#studio::before{content:"";position:fixed;inset:0;background:
 repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);pointer-events:none}
.head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
 background:linear-gradient(#1a0a0bee,#1a0a0b99);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head .sub{font:800 10px 'MVCinzel';letter-spacing:.3em;color:#ff9a6b}
.head .ttl{font:400 18px 'Dela Gothic One',sans-serif;letter-spacing:.04em}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
.songcard{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 40px #0008}
.songcard .jk{width:84px;height:112px;border-radius:12px;background-size:cover;background-position:center 30%;flex:none;box-shadow:0 6px 20px #000a,inset 0 0 0 1px #fff3}
.songcard h2{font:800 17px 'MVMincho',serif;line-height:1.35;color:var(--gold)}
.songcard p{font-size:12px;color:#e9d9bdcc;margin-top:4px}
.songcard .fr{font:600 10px 'MVCinzel';letter-spacing:.12em;color:#f3d38aaa;margin-top:6px}
.sec{margin-top:22px}
.sec h3{font-size:13px;letter-spacing:.08em;color:#ffb48f;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h3 small{color:#e9d9bd88;font-weight:500;letter-spacing:0}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cast div{border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--line);text-align:center;padding-bottom:8px}
.cast i{display:block;aspect-ratio:1;background-size:cover;background-position:center 25%}
.cast b{display:block;font-size:11px;margin-top:6px;color:var(--gold)}
.cast span{font-size:10px;color:#e9d9bd99}
.board{display:flex;flex-direction:column;gap:8px}
.shot{display:flex;gap:12px;align-items:center;padding:8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-height:76px;text-align:left;width:100%}
.shot .th{width:64px;height:64px;border-radius:9px;background-size:cover;background-position:center;flex:none;box-shadow:inset 0 0 0 1px #fff2}
.shot .tx{flex:1;min-width:0}
.shot .no{font:800 10px 'MVCinzel';letter-spacing:.15em;color:#ff9a6b}
.shot .ly{font:600 13px/1.45 'MVMincho',serif;color:#f6ead2;margin-top:2px}
.shot .tm{font-size:10px;color:#e9d9bd88;margin-top:3px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
 background:linear-gradient(transparent,#0b0608 35%);display:flex;flex-direction:column;gap:8px;align-items:center}
.dock .row{display:flex;gap:10px;width:100%;max-width:520px}
.btn{flex:1;min-height:52px;border-radius:999px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{color:#2a1606;background:linear-gradient(180deg,#ffe6a8,#e7b25a 60%,#c98a2c);box-shadow:0 8px 28px #e7a64a55,inset 0 1px 0 #fff8}
.btn:disabled{opacity:.5}
/* ---------- clapper ---------- */
#clap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0b0608;z-index:20}
#clap .cb{width:220px;position:relative}
#clap .top{height:42px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(-45deg,#111 0 22px,#f4efe6 22px 44px);transform-origin:8px 42px;transform:rotate(-28deg);transition:transform .22s cubic-bezier(.6,0,.9,.4)}
#clap .bod{height:130px;background:#1b1b1b;border-radius:0 0 10px 10px;padding:14px;font:600 11px 'MVCinzel';color:#eee;letter-spacing:.12em;line-height:1.9;border-top:6px solid #333}
#clap.go .top{transform:rotate(0)}
/* ---------- theater ---------- */
#theater{position:absolute;inset:0;display:none;background:#000;z-index:10;align-items:center;justify-content:center}
#stage{position:relative;aspect-ratio:1/1;height:100%;max-width:100%;overflow:hidden;background:#000}
@media (max-aspect-ratio:1/1){#stage{width:100%;height:auto}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px;z-index:3;transition:opacity .5s}
.hud button{min-width:44px;min-height:44px;border-radius:999px;background:#0007;border:1px solid #fff3;backdrop-filter:blur(6px);padding:0 14px;font-size:13px}
#bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#ffe6a8,#c98a2c);width:0;z-index:3}
#theater.idle .hud{opacity:0}
/* ---------- render mode (?render=1): only the 1080x1080 canvas ---------- */
body.render #studio,body.render #clap,body.render .hud,body.render #bar{display:none!important}
body.render #theater{display:block!important;inset:auto;left:0;top:0;width:1080px;height:1080px}
body.render #stage{width:1080px;height:1080px}
</style>
</head>
<body>
<div id="app">
 <section id="studio">
  <div class="head"><div><div class="sub" id="hSub">MV STUDIO</div><div class="ttl" id="hTtl">MVをつくる</div></div></div>
  <div class="wrap">
   <div class="songcard"><div class="jk" id="jk"></div><div><h2 id="sTitle"></h2><p id="sBy"></p><div class="fr" id="sFr"></div></div></div>
   <div class="sec"><h3>場面の構成 <small>タップでその場面から上映</small></h3><div class="board" id="board"></div></div>
  </div>
  <div class="dock"><div class="row"><button class="btn gold" id="bPlay" disabled>🎬 上映する</button></div></div>
 </section>
 <div id="clap"><div class="cb"><div class="top"></div><div class="bod" id="clapTx">SCENE 01 ・ TAKE 1</div></div></div>
 <section id="theater">
  <div id="stage">
   <canvas id="cv" width="1080" height="1080"></canvas>
   <div class="hud"><button id="bBack">‹ スタジオ</button><button id="bPause">❚❚</button></div>
   <div id="bar"></div>
  </div>
 </section>
</div>
<audio id="au" preload="auto"></audio>
<script>
const P = /*PROJECT*/;   // everything that belongs to this song: project.json (see MANUAL.md)
const ASSETS = {
  /*ASSETS*/
};
const ENERGY = /*ENERGY*/;
const VOX = /*VOX*/;     // the sung voice alone (separated stem), 10 values per second, 0..1
const voxAt = t => { const i = clamp(t * 10, 0, VOX.length - 1.001), k = Math.floor(i); return VOX.length ? lerp(VOX[k], VOX[k + 1] ?? VOX[k], i - k) : 0; };  // song loudness, 10 values per second, 0..1 (smoothed)
const A = n => ASSETS[n];
const VIDS = /*VIDS*/;   // moving paintings: id -> { n: frames in vid/<id>.f/, fps: the clip's own frame rate }
const RENDER = /[?&]render=1/.test(location.search);
const END = P.end, FPS = 30;   // P.end: the song length, measured by build.py
const W = 1080, H = 1080;

// ======================= timeline (from project.json) =======================
// lyric lines: start, sung end (from the vocal transcription), text (／ = line break), place = where each row sits:
//   horizontal row { x, y (baseline), al: 'l'|'c'|'r', k (size vs the 54 px base), sp (extra letter spacing) }
//   vertical column { v: 1, x (column centre), y (top), k }
const PLACE = P.lines.map(l => l.place);
const WORDFX = P.wordfx || {};   // effects tied to single words: { tear: '涙', halo: '光', swell: '永遠', pour: { word, targets: [{ img, at: [u, v] }] } }
const LINES = P.lines.map(l => [l.s, l.e, l.text]).map(([s, e, text], i, all) => {
  const peak = !!P.lines[i].peak || (i === all.length - 1 && P.lines[i].peak !== false);
  let foEnd, foStart;
  if (peak) { [foStart, foEnd] = P.lines[i].hold || [e + 5, e + 6.4]; }
  // each line leaves soon after it is sung (at the latest as the next one starts): no lyric lingers into the next scene
  else { foEnd = Math.min(all[i + 1] ? all[i + 1][0] + 0.05 : e + 1.1, e + 1.1); foStart = Math.max(foEnd - 0.8, Math.min(e, foEnd - 0.35)); }
  const fade = peak ? 2.2 : 1.35;                      // per-character fade-in (soft, slow)
  const revEnd = Math.max(s, Math.min(e, foStart) - fade * .55);   // last character starts here
  const place = PLACE[i], bottom = place.some(r => !r.v && r.y > .78);
  const flat = [...text.replace(/[／ ]/g, '')], at = w => { if (!w) return []; const k = flat.join('').indexOf(w); return k < 0 ? [] : [...w].map((_, j) => [...flat.join('').slice(0, k)].length + j); };
  const fx = { tear: at(WORDFX.tear), halo: at(WORDFX.halo), swell: at(WORDFX.swell), pour: at(WORDFX.pour && WORDFX.pour.word) };
  return { s, e, text, rows: text.split('／'), peak, foStart, foEnd, fade, revEnd, place, bottom, fx };
});
// scenes: image, start, camera (zoom from->to, view centre in image coords from->to), god-ray origin (image coords),
// face spots to keep clean of rays and particles (image coords + radius), ray strength
// depth layers: figure anchor (image coords: ground contact for full figures, neck for busts), direction
// (+1: the scene camera pushes in -> figure grows a little faster, background a little slower; -1: the reverse),
// pan sign (background and figure drift sideways in opposite directions)
const LY = (key, a, dir, pan, o = {}) => ({ bg: key + '-bg', fg: key + '-fg', a, s: 1.06,
  bz: dir > 0 ? [1.06, 1.005] : [1.005, 1.06], fz: dir > 0 ? [1, 1.04] : [1.04, 1],   // clean painted plates behind: a little more depth
  bp: [[-.013 * pan, 0], [.013 * pan, 0]], fp: [[.007 * pan, 0], [-.007 * pan, 0]], ...o });
const SCENES = P.scenes.map(sc => { const { layers, ...rest } = sc;
  return { faces: [], rs: 1, ...rest, ...(layers ? { layers: LY(sc.img, layers.a, layers.dir, layers.pan, layers.o || {}) } : {}) }; });
// OPTIONAL, decided after the MV is finished (MANUAL.md, step 12): moving paintings (image-to-video clips) for some scenes.
// P.video = { clips: { img: clipId }, from: seconds (no clips before), still: [imgs that stay stills], vmax: { clipId: seconds }, vrate: { clipId: speed } }
const PV = P.video || {}, VIDOF = PV.clips || {}, STILL_LAST = PV.still || [];
SCENES.forEach(s => { s.vid = s.t >= (PV.from || 0) && !STILL_LAST.includes(s.img) ? VIDOF[s.img] : undefined; });
const VMAX = PV.vmax || {};     // use only the start of a clip whose ending goes wrong
const VRATE = PV.vrate || {};   // slow motion for one clip (e.g. .55)
const XF = 1.8; // crossfade length, centred on each scene start
const CHERUBS = [];

// ======================= pure helpers =======================
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sstep = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const ramp = (t, a, b) => sstep((t - a) / (b - a));                 // 0 before a, 1 after b
const win = (t, a, b, c, d) => ramp(t, a, b) * (1 - ramp(t, c, d));  // fade in a..b, out c..d
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fract = x => x - Math.floor(x);
function energyAt(t) {   // 0..1: the song's own loudness blended with the arrangement (quiet <70, chorus, bridge, finale)
  const i = clamp(t * 10, 0, ENERGY.length - 1.001), k = Math.floor(i), f = i - k;
  const rms = ENERGY.length ? lerp(ENERGY[k], ENERGY[k + 1] ?? ENERGY[k], f) : .5;
  let sec = (P.energy && P.energy.base) ?? .22; for (const [a, b, d] of (P.energy && P.energy.ramps) || []) sec += d * ramp(t, a, b);   // the arrangement, from project.json
  return clamp(.55 * sec + .45 * rms);
}

// ======================= images =======================
const imgs = {};
function img(n) { if (imgs[n]) return imgs[n]; const s = A(n + '-sq') || A(n); const i = new Image(); if (s) i.src = s; imgs[n] = i; return i; }
const ok = im => im && im.complete && im.naturalWidth > 0;

// ======================= canvas + prebuilt layers =======================
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const L = {};  // prebuilt layers
function buildLayers() {
  const R = mulberry32(20241112);
  // god-ray texture: soft wedges around the centre, dark at the very core so the origin never blooms white
  { const S = 1024, c = mk(S, S), g = c.getContext('2d'); g.translate(S / 2, S / 2);
    const n = 22; for (let k = 0; k < n; k++) { const a = (k + R() * .6) / n * Math.PI * 2, w = .035 + R() * .06, al = .35 + R() * .65;
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, S / 2);
      gr.addColorStop(0, `rgba(255,236,190,0)`); gr.addColorStop(.06, `rgba(255,236,190,${al * .7})`); gr.addColorStop(.25, `rgba(255,226,170,${al * .55})`); gr.addColorStop(1, 'rgba(255,215,150,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, S / 2, a - w / 2, a + w / 2); g.closePath(); g.fill(); }
    const c2 = mk(S, S), g2 = c2.getContext('2d'); g2.filter = 'blur(7px)'; g2.drawImage(c, 0, 0); L.rayTex = c2; }
  L.rays = mk(540, 540);
  L.scn = mk(W, H); { const g = L.scn.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; }
  // dust sprites
  { const c = mk(64, 64), g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,240,200,1)'); gr.addColorStop(.18, 'rgba(255,220,150,.85)'); gr.addColorStop(.5, 'rgba(255,200,120,.22)'); gr.addColorStop(1, 'rgba(255,190,110,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); L.dust = c; }
  { const c = mk(128, 128), g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,226,170,.55)'); gr.addColorStop(.55, 'rgba(255,214,150,.3)'); gr.addColorStop(.8, 'rgba(255,205,140,.1)'); gr.addColorStop(1, 'rgba(255,200,130,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); L.bokeh = c; }
  { const S = 128, c = mk(S, S), g = c.getContext('2d'), m = S / 2;
    const core = g.createRadialGradient(m, m, 0, m, m, m * .5); core.addColorStop(0, 'rgba(255,255,245,1)'); core.addColorStop(.25, 'rgba(255,236,190,.9)'); core.addColorStop(1, 'rgba(255,210,140,0)');
    g.fillStyle = core; g.fillRect(0, 0, S, S);
    for (const [w, h, rot] of [[m * .8, m * .06, 0], [m * .8, m * .06, Math.PI / 2], [m * .42, m * .035, Math.PI / 4], [m * .42, m * .035, -Math.PI / 4]]) {
      g.save(); g.translate(m, m); g.rotate(rot); const lg = g.createLinearGradient(-w, 0, w, 0);
      lg.addColorStop(0, 'rgba(255,230,170,0)'); lg.addColorStop(.5, 'rgba(255,252,235,.95)'); lg.addColorStop(1, 'rgba(255,230,170,0)');
      g.fillStyle = lg; g.beginPath(); g.ellipse(0, 0, w, h, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
    L.star = c; }
  { const S = 256, c = mk(S, S), g = c.getContext('2d'), gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    gr.addColorStop(0, 'rgba(255,228,170,.9)'); gr.addColorStop(.35, 'rgba(255,214,150,.4)'); gr.addColorStop(.7, 'rgba(255,205,140,.1)'); gr.addColorStop(1, 'rgba(255,200,130,0)');
    g.fillStyle = gr; g.fillRect(0, 0, S, S); L.puff = c; }
  { const S = 256, c = mk(S, S), g = c.getContext('2d'), gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    gr.addColorStop(0, 'rgba(14,6,1,.5)'); gr.addColorStop(.45, 'rgba(14,6,1,.32)'); gr.addColorStop(.8, 'rgba(14,6,1,.08)'); gr.addColorStop(1, 'rgba(14,6,1,0)');
    g.fillStyle = gr; g.fillRect(0, 0, S, S); L.shade = c; }
  // vignette
  { const c = mk(W, H), g = c.getContext('2d'), gr = g.createRadialGradient(W / 2, H * .46, H * .3, W / 2, H * .5, H * .8);
    gr.addColorStop(0, 'rgba(8,4,0,0)'); gr.addColorStop(.55, 'rgba(8,4,0,.22)'); gr.addColorStop(1, 'rgba(8,4,0,.66)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H); L.vig = c; }
  // lyric band (soft dark gradient at the bottom)
  { const c = mk(W, 440), g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 440);
    for (let k = 0; k <= 10; k++) { const x = k / 10; gr.addColorStop(x, `rgba(14,7,2,${(.78 * sstep(x * 1.15)).toFixed(3)})`); }
    g.fillStyle = gr; g.fillRect(0, 0, W, 440); L.band = c; }
  // title veil (top)
  { const c = mk(W, 620), g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 620);
    gr.addColorStop(0, 'rgba(24,11,3,.62)'); gr.addColorStop(.55, 'rgba(24,11,3,.38)'); gr.addColorStop(1, 'rgba(14,7,2,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, 620); L.veil = c; }
  // centre veil (for MERCI and the credits)
  { const c = mk(W, H), g = c.getContext('2d'), gr = g.createRadialGradient(W / 2, H * .5, 0, W / 2, H * .5, W * .62);
    gr.addColorStop(0, 'rgba(20,9,2,.62)'); gr.addColorStop(.6, 'rgba(20,9,2,.36)'); gr.addColorStop(1, 'rgba(14,7,2,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H); L.cveil = c; }
  // warm glow (breathing + crossfade bloom)
  { const c = mk(W, H), g = c.getContext('2d'), gr = g.createRadialGradient(W / 2, H * .38, 0, W / 2, H * .45, W * .75);
    gr.addColorStop(0, 'rgba(255,214,150,1)'); gr.addColorStop(.5, 'rgba(255,190,120,.45)'); gr.addColorStop(1, 'rgba(255,170,100,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H); L.glow = c; }
  // film grain tiles (grey-centred noise, overlay)
  L.grain = []; for (let k = 0; k < 6; k++) { const S = 540, c = mk(S, S), g = c.getContext('2d'), d = g.createImageData(S, S);
    for (let p = 0; p < S * S; p++) { const v = 128 + ((R() + R() + R()) / 3 - .5) * 2 * 110; d.data[p * 4] = d.data[p * 4 + 1] = d.data[p * 4 + 2] = v; d.data[p * 4 + 3] = 255; }
    g.putImageData(d, 0, 0); L.grain.push(c); }
  // titles
  L.title = buildTitle(); L.merci = buildMerci(); L.credit = buildCredit();
}

// ----- gold text helpers (all drawn once into sprites) -----
const MIN = (w, px) => `${w} ${px}px 'MVMincho', serif`;
const CIN = (w, px) => `${w} ${px}px 'MVCinzel', serif`;
const SCR = px => `400 ${px}px 'MVScript', cursive`;
const SRF = (px, it) => `${it ? 'italic ' : ''}500 ${px}px 'MVSerif', serif`;
function goldFill(g, y0, y1) { const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, '#fff8e2'); gr.addColorStop(.45, '#f6d78f'); gr.addColorStop(.8, '#d79c3c'); gr.addColorStop(1, '#b67b25'); return gr; }
// draws one text item centred at (x, baseline y) with glow + dark shadow + gold
function goldText(g, txt, x, y, font, px, opt = {}) {
  g.save(); g.font = font; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.letterSpacing = (opt.ls || 0) + 'px'; x += (opt.ls || 0) / 2;
  const top = y - px * .9, bot = y + px * .15;
  // halo
  g.shadowColor = opt.halo || 'rgba(255,200,110,.9)'; g.shadowBlur = opt.haloBlur || px * .45; g.fillStyle = `rgba(255,214,140,${opt.haloA ?? .55})`;
  g.fillText(txt, x, y); g.fillText(txt, x, y);
  // depth shadow
  g.shadowColor = 'rgba(25,10,0,.5)'; g.shadowBlur = px * .3; g.shadowOffsetY = px * .015;
  g.fillStyle = 'rgba(40,18,0,.3)'; g.fillText(txt, x, y);
