name: Story video

# Story motions made by Claude Code (client decision 2026-10-20): design/story-video-queue.json changed →
# Seedance 2.5 on Runware makes each new item (scripts/story-video/make.mjs), saved to apps/web/public/onboarding.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main]
    paths: ['design/story-video-queue.json']

concurrency:
  group: story-video-${{ github.ref }}
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make
        run: |
          export RUNWARE_API_KEY="$(gcloud secrets versions access latest --secret=obolo-seedream-api-key)"
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          node scripts/story-video/make.mjs
      - name: Save to the branch
        if: always()
        run: |
          git config user.name "story-video"
          git config user.email "story-video@users.noreply.github.com"
          git add -f apps/web/public/onboarding/m*.mp4 apps/web/public/onboarding/m*.jpg docs/story-import/video-last-run.md design/story-video-queue.json
          git diff --cached --quiet && exit 0
          git commit -m "Story video: new motions [skip ci]"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
