name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obolo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Build API
        run: pnpm --filter @obolo/api build
      # before the tests: the Postgres-backed tests (*.pg.test.ts) read a database with every migration applied and do
      # not apply them themselves
      - name: API migrations apply cleanly
        run: pnpm --filter @obolo/api db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/obolo
      - run: pnpm test
        env:
          # the API's Postgres-backed tests: goods (a game case, a dachi work never opened by a stranger), 月で作る → 星
          # for each of the eight kinds (moon-to-planet.pg.test.ts) and the planets' readiness counts — skipped without it
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/obolo
      - run: pnpm typecheck
      - name: Build web
        run: pnpm --filter @obolo/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
