name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obolo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm test
      - run: pnpm typecheck
      - name: Build API
        run: pnpm --filter @obolo/api build
      - name: API migrations apply cleanly
        run: pnpm --filter @obolo/api db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/obolo
      - name: Build web
        run: pnpm --filter @obolo/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
