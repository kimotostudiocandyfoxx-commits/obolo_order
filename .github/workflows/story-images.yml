name: Story images

# Story image workshop (client request 2026-10-10): the story-design chat adds items to
# design/story-queue.json and pushes; this paints the new ones with Seedream 5.0 Pro and commits
# them to design/story/out/ on the same branch. See docs/handoff/story-images.md.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main]
    paths: ['design/story-queue.json']

concurrency:
  group: story-images-${{ github.ref }}
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paint
        run: |
          # needs (once): the key in Secret Manager as obolo-seedream-api-key, readable by the deploy SA;
          # variable SEEDREAM_PROVIDER = runware (default) or ark (BytePlus ModelArk)
          export SEEDREAM_API_KEY="$(gcloud secrets versions access latest --secret=obolo-seedream-api-key)"
          export SEEDREAM_PROVIDER="${{ vars.SEEDREAM_PROVIDER || 'runware' }}"
          export SEEDREAM_MODEL="${{ vars.SEEDREAM_MODEL }}"
          node scripts/story-images/generate.mjs
      - name: Save the pictures to the branch
        if: always()
        run: |
          git config user.name "story-images"
          git config user.email "story-images@users.noreply.github.com"
          mkdir -p design/story/out && git add -f design/story/out
          git diff --cached --quiet && exit 0
          git commit -m "Story images: new pictures [skip ci]"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
