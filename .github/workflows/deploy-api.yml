# Deploys apps/api to Google Cloud Run (Tokyo, asia-northeast1).
# Runs on pushes that touch the API, or manually from the GitHub "Actions" tab
# (works from an iPad: Actions → Deploy API → Run workflow).
# One-time setup: scripts/gcp-setup.sh, then only two repository variables are required
# (GCP_PROJECT_ID, GCP_PROJECT_NUMBER); everything else has a default below (P-INFRA-1).
name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main, claude/solar-system-home-planets-ew766y]
    paths: ['apps/api/**', 'packages/**', 'pnpm-lock.yaml']

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  REGION: asia-northeast1
  SERVICE: obolo-api
  REPO: obolo
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
  RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA || format('obolo-api-runtime@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
  CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE || format('{0}:asia-northeast1:obolo-pg', vars.GCP_PROJECT_ID) }}
  CORS_ORIGINS: ${{ vars.CORS_ORIGINS || '/^https://obolo[a-z0-9-]*[.]vercel[.]app$/' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Stripe (Day 9 payment) is switched on by the STRIPE_PUBLISHABLE_KEY variable, after
      # scripts/stripe-setup.sh stored the secret key. Without it the payment runs in demo mode.
      - name: Secrets
        id: sec
        run: |
          {
            echo 'list<<EOF'
            echo 'DATABASE_URL=obolo-database-url:latest'
            echo 'REDIS_URL=obolo-redis-url:latest'
            echo 'GEMINI_API_KEY=obolo-gemini-api-key:latest'
            echo 'BUNNY_STORAGE_KEY=obolo-bunny-storage-key:latest'
            echo 'ADMIN_TOKEN=obolo-admin-token:latest'
            if [ -n "${{ vars.STRIPE_PUBLISHABLE_KEY }}" ]; then
              echo 'STRIPE_SECRET_KEY=obolo-stripe-secret-key:latest'
              echo 'STRIPE_WEBHOOK_SECRET=obolo-stripe-webhook-secret:latest'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.RUNTIME_SA }}
            --add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }}
            --cpu=1 --memory=512Mi --concurrency=80 --min-instances=0 --max-instances=20
          env_vars: |
            NODE_ENV=production
            MIGRATE_ON_START=true
            QUEUE_DRIVER=inline
            CORS_ORIGINS=${{ env.CORS_ORIGINS }}
            WEB_ORIGIN=${{ vars.WEB_ORIGIN }}
            AUTH_DEMO_SHOW_CODE=${{ vars.AUTH_DEMO_SHOW_CODE || 'true' }}
            BUDDY_OVERAGE_ENABLED=false
            BUNNY_STORAGE_ZONE=${{ vars.BUNNY_STORAGE_ZONE }}
            BUNNY_STORAGE_ENDPOINT=${{ vars.BUNNY_STORAGE_ENDPOINT || 'sg.storage.bunnycdn.com' }}
            BUNNY_CDN_HOST=${{ vars.BUNNY_CDN_HOST }}
            STRIPE_PUBLISHABLE_KEY=${{ vars.STRIPE_PUBLISHABLE_KEY }}
            STRIPE_PRICE_ID=${{ vars.STRIPE_PRICE_ID }}
          secrets: ${{ steps.sec.outputs.list }}

      - name: Check it is up
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/readyz" && break; sleep 10; done
          echo "### API URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Vercel の NEXT_PUBLIC_API_URL にこの URL を入れてください" >> "$GITHUB_STEP_SUMMARY"
