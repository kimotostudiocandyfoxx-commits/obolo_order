# Deploys apps/api to Google Cloud Run (Tokyo, asia-northeast1).
# Runs on pushes that touch the API, or manually from the GitHub "Actions" tab
# (works from an iPad: Actions → Deploy API → Run workflow).
# One-time setup: scripts/gcp-setup.sh, then only two repository variables are required
# (GCP_PROJECT_ID, GCP_PROJECT_NUMBER); everything else has a default below (P-INFRA-1).
name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main, claude/solar-system-home-planets-ew766y]
    paths: ['apps/api/**', 'packages/**', 'pnpm-lock.yaml', 'RELEASE.md']

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  REGION: asia-northeast1
  SERVICE: obolo-api
  REPO: obolo
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
  RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA || format('obolo-api-runtime@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
  CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE || format('{0}:asia-northeast1:obolo-pg', vars.GCP_PROJECT_ID) }}
  CORS_ORIGINS: ${{ vars.CORS_ORIGINS || '/^https://obolo[a-z0-9-]*[.]vercel[.]app$/' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The launch version is pinned (2026-11-23): a push deploys only when its last commit says [release]
    # (made by scripts/release.sh), or when run by hand. Set the variable RELEASE_GATE=off to deploy every push again.
    if: ${{ vars.GCP_PROJECT_ID != '' && (github.event_name != 'push' || vars.RELEASE_GATE == 'off' || (startsWith(github.event.head_commit.message, 'Release R') && contains(github.event.head_commit.message, '[release]'))) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Cloudflare R2 (client 2026-11-25; docs/media.md): the GitHub secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY are
      # written to Secret Manager (obolo-r2-access-key-id / obolo-r2-secret-access-key: created when missing, a new version
      # only when the value changed; values are never printed) and reach Cloud Run from there, like the other keys.
      # R2_ACCOUNT_ID / R2_BUCKET / R2_PUBLIC_BASE are plain variables. Without them (or without the keys in Secret
      # Manager) the API stays on Bunny. The deployer needs Secret Manager rights for this (docs/media.md).
      - name: R2 keys
        id: r2
        env:
          KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT: ${{ vars.R2_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET }}
          BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: |
          put() {
            if ! gcloud secrets describe "$1" >/dev/null 2>&1; then
              gcloud secrets create "$1" --replication-policy=automatic --quiet >/dev/null 2>&1 || return 1
              echo "$1: created"
            fi
            if [ "$(gcloud secrets versions access latest --secret="$1" 2>/dev/null || true)" = "$(printf '%s' "$2")" ]; then
              echo "$1: unchanged"
              return 0
            fi
            printf '%s' "$2" | gcloud secrets versions add "$1" --data-file=- --quiet >/dev/null 2>&1 || return 1
            echo "$1: new version"
          }
          if [ -z "$ACCOUNT" ] || [ -z "$BUCKET" ] || [ -z "$BASE" ]; then
            echo "R2 variables not set: media stays on Bunny"
            echo "on=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$KEY_ID" ] && [ -n "$KEY_SECRET" ]; then
            if ! { put obolo-r2-access-key-id "$KEY_ID" && put obolo-r2-secret-access-key "$KEY_SECRET"; }; then
              echo "::warning::Could not write the R2 keys to Secret Manager (the deployer needs Secret Manager rights, docs/media.md)"
            fi
          fi
          if gcloud secrets versions describe latest --secret=obolo-r2-access-key-id >/dev/null 2>&1 && \
             gcloud secrets versions describe latest --secret=obolo-r2-secret-access-key >/dev/null 2>&1; then
            echo "R2: on (new files go to R2; keys from Secret Manager)"
            echo "on=true" >> "$GITHUB_OUTPUT"
            echo "mode=secret" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY_ID" ] && [ -n "$KEY_SECRET" ]; then
            # client 2026-11-25: the Google Cloud console can't be opened from where the client is, so the deployer can't
            # be given Secret Manager rights yet. Until then the keys go to Cloud Run as plain env vars from the GitHub
            # secrets (masked in the logs; visible only to the project's owners in the Cloud Run settings).
            echo "R2: on (new files go to R2; keys as Cloud Run env vars until Secret Manager rights exist)"
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "mode=env" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No R2 keys: media stays on Bunny"
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "mode=off" >> "$GITHUB_OUTPUT"
          fi

      # Stripe (the Eclipse payment, day 7) is switched on by the STRIPE_PUBLISHABLE_KEY variable, after
      # scripts/stripe-setup.sh stored the secret key. Without it the payment runs in demo mode.
      - name: Secrets
        id: sec
        run: |
          {
            echo 'list<<EOF'
            echo 'DATABASE_URL=obolo-database-url:latest'
            echo 'REDIS_URL=obolo-redis-url:latest'
            echo 'GEMINI_API_KEY=obolo-gemini-api-key:latest'
            echo 'BUNNY_STORAGE_KEY=obolo-bunny-storage-key:latest'
            # Cloudflare R2 (the step "R2 keys" above)
            if [ "${{ steps.r2.outputs.on }}" = "true" ]; then
              echo 'R2_ACCESS_KEY_ID=obolo-r2-access-key-id:latest'
              echo 'R2_SECRET_ACCESS_KEY=obolo-r2-secret-access-key:latest'
            fi
            echo 'ADMIN_TOKEN=obolo-admin-token:latest'
            # the looks and the Bati are painted by Seedream (client decision 2026-10-25)
            echo 'LOOK_RUNWARE_KEY=obolo-seedream-api-key:latest'
            # R17: songs are sung on Runware (ACE-Step 1.5 XL SFT; the secret spell: MiniMax Music 2.6) with the same key.
            # MUSIC_PROVIDER=gpu (variable) goes back to our own GPU; PREMIUM_SPELL=off turns the secret spell off;
            # PREMIUM_SPELL_WORDS sets its passphrases (separated by | — default 「上級魔法で」)
            echo 'MUSIC_RUNWARE_KEY=obolo-seedream-api-key:latest'
            # Fish Audio voices: switched on once the key is in Secret Manager (FISH_ENABLED=true).
            # The default cute voice (ダチ messages of members who are not recorded): the variable FISH_DEFAULT_VOICE_ID
            # (env_vars below), the model id printed by the "Default Bati voice" workflow (make-default-bati-voice.yml).
            # {bati}'s own voice (M-R342) is fixed by its egg: FISH_BATI_MOON_VOICE_ID / FISH_BATI_SUN_VOICE_ID below
            if [ "${{ vars.FISH_ENABLED }}" = "true" ]; then
              echo 'FISH_API_KEY=obolo-fish-api-key:latest'
            fi
            # Earth phone (Agora): switched on by the AGORA_APP_ID variable, after scripts/comms-setup.sh
            # stored the App Certificate
            if [ -n "${{ vars.AGORA_APP_ID }}" ]; then
              echo 'AGORA_APP_CERTIFICATE=obolo-agora-app-certificate:latest'
            fi
            # Mars MV キメ絵 by Novita AI: switched on by the NOVITA_MODEL variable, after the API key
            # was stored as obolo-novita-api-key
            if [ -n "${{ vars.NOVITA_MODEL }}" ]; then
              echo 'NOVITA_API_KEY=obolo-novita-api-key:latest'
            fi
            # Mars MV キメ絵 by Runware: switched on by the RUNWARE_MODEL variable, after the API key
            # was stored as obolo-runware-api-key (without it the Gemini image model draws them)
            if [ -n "${{ vars.RUNWARE_MODEL }}" ]; then
              echo 'RUNWARE_API_KEY=obolo-runware-api-key:latest'
            fi
            # MV plan A (docs/mv-plans.md): Seedream sheets on Runware, the key stored as obolo-seedream-api-key
            if [ "${{ vars.MV_PLAN }}" = "A" ]; then
              echo 'MV_RUNWARE_KEY=obolo-seedream-api-key:latest'
            fi
            # Bati's conversation on Claude Haiku 5.5 (client decision 2026-11-21): switched on by the
            # CLAUDE_BATI variable once the key is stored as obolo-anthropic-api-key (without it: Gemini)
            if [ "${{ vars.CLAUDE_BATI }}" = "true" ]; then
              echo 'ANTHROPIC_API_KEY=obolo-anthropic-api-key:latest'
            fi
            # Login codes and invitations by email (launch 2026-11-26): switched on by the EMAIL_FROM variable
            # (e.g. "OBOLO ORDER <no-reply@your-domain>", a domain verified at Resend), after the key was stored
            # as obolo-resend-api-key. Then the code is no longer shown on the screen.
            # (or, without Google Cloud console access: the GitHub Actions secret RESEND_API_KEY, passed below)
            if [ -n "${{ vars.EMAIL_FROM }}" ] && [ -z "${{ secrets.RESEND_API_KEY }}" ]; then
              echo 'RESEND_API_KEY=obolo-resend-api-key:latest'
            fi
            # (or, without Google Cloud console access: the GitHub Actions secrets STRIPE_SECRET_KEY and
            # STRIPE_WEBHOOK_SECRET, passed below)
            if [ -n "${{ vars.STRIPE_PUBLISHABLE_KEY }}" ] && [ -z "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
              echo 'STRIPE_SECRET_KEY=obolo-stripe-secret-key:latest'
              echo 'STRIPE_WEBHOOK_SECRET=obolo-stripe-webhook-secret:latest'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # The tester entrance (docs/本番の状態.md): the login emails / account ids in the repository variables
      # TESTER_EMAILS / TESTER_ACCOUNT_IDS (never written in the repository). The action splits env_vars on commas,
      # so the list is passed with ';' between the entries (the API reads ',', ';' and spaces alike).
      - name: Testers
        id: testers
        env:
          EMAILS: ${{ vars.TESTER_EMAILS }}
          IDS: ${{ vars.TESTER_ACCOUNT_IDS }}
        run: |
          clean() { printf '%s' "$1" | tr ',\n\r\t ' ';;;;;' | tr -s ';' | sed 's/^;//; s/;$//' | tr -cd 'A-Za-z0-9@._+;-'; }
          echo "emails=$(clean "$EMAILS")" >> "$GITHUB_OUTPUT"
          echo "ids=$(clean "$IDS")" >> "$GITHUB_OUTPUT"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.RUNTIME_SA }}
            --add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }}
            --cpu=2 --memory=2Gi --concurrency=80 --min-instances=0 --max-instances=20
            --timeout=900
          env_vars: |
            NODE_ENV=production
            MIGRATE_ON_START=true
            # background jobs (songs, MVs): Cloud Tasks once scripts/jobs-setup.sh made the queue and the
            # CLOUD_TASKS_QUEUE variable is set; until then they run in-process (inline)
            QUEUE_DRIVER=${{ vars.CLOUD_TASKS_QUEUE && 'cloudtasks' || 'inline' }}
            CLOUD_TASKS_QUEUE=${{ vars.CLOUD_TASKS_QUEUE }}
            JOBS_TARGET_URL=${{ format('https://{0}-{1}.{2}.run.app', env.SERVICE, vars.GCP_PROJECT_NUMBER, env.REGION) }}
            JOBS_INVOKER_SA=${{ env.RUNTIME_SA }}
            CORS_ORIGINS=${{ env.CORS_ORIGINS }}
            WEB_ORIGIN=${{ vars.WEB_ORIGIN || 'https://oboloorder-web.vercel.app' }}
            AUTH_DEMO_SHOW_CODE=${{ vars.AUTH_DEMO_SHOW_CODE || (vars.EMAIL_FROM && 'false') || 'true' }}
            EMAIL_DRIVER=${{ vars.EMAIL_FROM && 'resend' || 'console' }}
            EMAIL_FROM=${{ vars.EMAIL_FROM || 'Obolo Order <no-reply@example.com>' }}
            ${{ secrets.RESEND_API_KEY != '' && format('RESEND_API_KEY={0}', secrets.RESEND_API_KEY) || 'EMAIL_KEY_SOURCE=secret-manager' }}
            BUDDY_OVERAGE_ENABLED=false
            BUNNY_STORAGE_ZONE=${{ vars.BUNNY_STORAGE_ZONE }}
            BUNNY_STORAGE_ENDPOINT=${{ vars.BUNNY_STORAGE_ENDPOINT || 'sg.storage.bunnycdn.com' }}
            BUNNY_CDN_HOST=${{ vars.BUNNY_CDN_HOST }}
            # Cloudflare R2 (docs/media.md): new files go to R2 when these and the keys are there; R2_MIGRATE=true copies
            # the Bunny files over in the background (also POST /admin/media/r2/move or the workflow "Media to R2")
            R2_ACCOUNT_ID=${{ vars.R2_ACCOUNT_ID }}
            ${{ steps.r2.outputs.mode == 'env' && format('R2_ACCESS_KEY_ID={0}', secrets.R2_ACCESS_KEY_ID) || '# R2_ACCESS_KEY_ID: Secret Manager or off' }}
            ${{ steps.r2.outputs.mode == 'env' && format('R2_SECRET_ACCESS_KEY={0}', secrets.R2_SECRET_ACCESS_KEY) || '# R2_SECRET_ACCESS_KEY: Secret Manager or off' }}
            R2_BUCKET=${{ vars.R2_BUCKET }}
            R2_PUBLIC_BASE=${{ vars.R2_PUBLIC_BASE }}
            R2_MIGRATE=${{ vars.R2_MIGRATE || 'false' }}
            R2_MIGRATE_BATCH=${{ vars.R2_MIGRATE_BATCH || '25' }}
            STRIPE_PUBLISHABLE_KEY=${{ vars.STRIPE_PUBLISHABLE_KEY }}
            STRIPE_PRICE_ID=${{ vars.STRIPE_PRICE_ID }}
            ${{ secrets.STRIPE_SECRET_KEY != '' && format('STRIPE_SECRET_KEY={0}', secrets.STRIPE_SECRET_KEY) || 'STRIPE_KEY_SOURCE=secret-manager' }}
            ${{ secrets.STRIPE_SECRET_KEY != '' && format('STRIPE_WEBHOOK_SECRET={0}', secrets.STRIPE_WEBHOOK_SECRET || 'PLACEHOLDER') || 'STRIPE_WEBHOOK_SOURCE=secret-manager' }}
            COMMS_MEMBERS_ONLY=${{ vars.COMMS_MEMBERS_ONLY || 'true' }}
            AGORA_APP_ID=${{ vars.AGORA_APP_ID }}
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
            FIREBASE_WEB_API_KEY=${{ vars.FIREBASE_WEB_API_KEY }}
            FIREBASE_WEB_APP_ID=${{ vars.FIREBASE_WEB_APP_ID }}
            FIREBASE_SIGNER_SA=${{ env.RUNTIME_SA }}
            ANIME_ONNX_URL=${{ vars.ANIME_ONNX_URL }}
            MV_PLAN_MODEL=${{ vars.MV_PLAN_MODEL || 'gemini-flash-lite-latest' }}
            MV_KEY_CUTS=${{ vars.MV_KEY_CUTS || '2' }}
            MV_QWEN_SCENES=${{ vars.MV_QWEN_SCENES || '12' }}
            MV_PLAN=${{ vars.MV_PLAN }}
            MV_SHEET_SCENES=${{ vars.MV_SHEET_SCENES || '12' }}
            MV_PAINTER=${{ vars.MV_PAINTER || 'klein-4b' }}
            MV_GPU_PAINT=${{ vars.MV_GPU_PAINT || (vars.MV_PLAN == 'B' && 'true') || (vars.MUSIC_REGION && 'true') || 'false' }}
            MV_HERO_REF=${{ vars.MV_HERO_REF || '0.6' }}
            MV_PARALLAX=${{ vars.MV_PARALLAX || 'false' }}
            RUNWARE_MODEL=${{ vars.RUNWARE_MODEL }}
            NOVITA_MODEL=${{ vars.NOVITA_MODEL }}
            NOVITA_STRENGTH=${{ vars.NOVITA_STRENGTH || '0.5' }}
            NOVITA_SIDE=${{ vars.NOVITA_SIDE || '768' }}
            TESTER_EMAILS=${{ steps.testers.outputs.emails }}
            TESTER_ACCOUNT_IDS=${{ steps.testers.outputs.ids }}
            FISH_DEFAULT_VOICE_ID=${{ vars.FISH_DEFAULT_VOICE_ID }}
            # M-R342 (client 2026-11-27): {bati}'s fixed Fish voice 「活発なマスコットキャラ」 — the same for the Moon egg and
            # the Sun egg for now (ids, not secrets; another voice for an egg = the variable of the same name)
            FISH_BATI_MOON_VOICE_ID=${{ vars.FISH_BATI_MOON_VOICE_ID || '270c409c18d14a60a81ad8c2f24007b9' }}
            FISH_BATI_SUN_VOICE_ID=${{ vars.FISH_BATI_SUN_VOICE_ID || '270c409c18d14a60a81ad8c2f24007b9' }}
            # R17 (docs/マナの値段.md): the model of each picture use (a Runware AIR id or a Gemini image model) and the
            # pictures per round; the game tiers' chains. Empty = the defaults in apps/api/src/config.ts (R16's models)
            ART_MODEL=${{ vars.ART_MODEL || 'runware:400@2' }}
            LOOK_MODEL=${{ vars.LOOK_MODEL || 'runware:400@4' }}
            BATI_MODEL=${{ vars.BATI_MODEL || 'bytedance:seedream@5.0-flash' }}
            KORORIN_MODEL=${{ vars.KORORIN_MODEL || 'runware:400@4' }}
            SATURN_CHIBI_MODEL=${{ vars.SATURN_CHIBI_MODEL || 'runware:400@4' }}
            SATURN_BALL_MODEL=${{ vars.SATURN_BALL_MODEL || 'alibaba:qwen-image@2.1-turbo' }}
            PLANET_CHIBI_MODEL=${{ vars.PLANET_CHIBI_MODEL || 'alibaba:qwen-image@2.1-turbo' }}
            CUTOUT_MODEL=${{ vars.CUTOUT_MODEL || 'runware:109@1' }}
            LOOK_CANDIDATES=${{ vars.LOOK_CANDIDATES || '4' }}
            PAID_LOOK_CANDIDATES=${{ vars.PAID_LOOK_CANDIDATES || '2' }}
            KORORIN_CANDIDATES=${{ vars.KORORIN_CANDIDATES || '4' }}
            GAME_MODEL_TRIAL=${{ vars.GAME_MODEL_TRIAL || 'gemini:gemini-2.5-flash-lite?think=0,gemini:gemini-2.5-flash?think=0' }}
            GAME_MODEL_CHEAP=${{ vars.GAME_MODEL_CHEAP || 'gemini:gemini-2.5-flash?think=4096,gemini:gemini-flash-latest?think=4096' }}
            GAME_MODEL_FULL=${{ vars.GAME_MODEL_FULL || vars.GAME_MODEL || 'gemini:gemini-2.5-pro,gemini:gemini-2.5-flash' }}
            COST_REFINE_SINCE=${{ vars.COST_REFINE_SINCE || '2026-11-25' }}
            # docs/マナの値段.md: the price rule's knobs (defaults = the client's decision 2026-11-25)
            STRIPE_FEE_RATE=${{ vars.STRIPE_FEE_RATE || '0.036' }}
            STRIPE_FEE_FIXED_JPY=${{ vars.STRIPE_FEE_FIXED_JPY || '0' }}
            MANA_MARGIN=${{ vars.MANA_MARGIN || '0.08' }}
            FX_USD_JPY=${{ vars.FX_USD_JPY || '160' }}
            FX_RATES=${{ vars.FX_RATES }}
            GPU_SECOND_JPY=${{ vars.GPU_SECOND_JPY || '0.05' }}
            CPU_SECOND_JPY=${{ vars.CPU_SECOND_JPY || '0.01' }}
            # R18 (docs/マナの値段.md 13.): Bluena's room and 保存の魔法 (R2 storage price; included GB; the tiers' R2 operations)
            STORAGE_MEMBER_GB=${{ vars.STORAGE_MEMBER_GB || '5' }}
            STORAGE_FREE_GB=${{ vars.STORAGE_FREE_GB || '1' }}
            STORAGE_GB_MONTH_USD=${{ vars.STORAGE_GB_MONTH_USD || '0.015' }}
            STORAGE_CLASS_A_PER_GB=${{ vars.STORAGE_CLASS_A_PER_GB || '0' }}
            STORAGE_CLASS_B_PER_GB=${{ vars.STORAGE_CLASS_B_PER_GB || '0' }}
            STORAGE_GRACE_DAYS=${{ vars.STORAGE_GRACE_DAYS || '7' }}
            STORAGE_PRICE_MONTHS=${{ vars.STORAGE_PRICE_MONTHS || '12' }}
            MUSIC_URL=${{ vars.MUSIC_REGION && format('https://obolo-music-{0}.{1}.run.app', vars.GCP_PROJECT_NUMBER, vars.MUSIC_REGION) || '' }}
            MUSIC_PROVIDER=${{ vars.MUSIC_PROVIDER || 'runware' }}
            PREMIUM_SPELL=${{ vars.PREMIUM_SPELL || 'on' }}
            PREMIUM_SPELL_WORDS=${{ vars.PREMIUM_SPELL_WORDS }}
          secrets: ${{ steps.sec.outputs.list }}

      - name: Check it is up
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/readyz" && break; sleep 10; done
          echo "### API URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Vercel の NEXT_PUBLIC_API_URL にこの URL を入れてください" >> "$GITHUB_STEP_SUMMARY"
