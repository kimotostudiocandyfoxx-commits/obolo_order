name: KIMORIN art

# KIMORIN's story sprites painted again on chroma green with a fixed face (client 2026-11-22):
# design/kimorin-art-queue.json (scripts/kimorin/make-queue.py) → design/kimorin/<id>.jpg with
# scripts/ui-art/paint.mjs; scripts/kimorin/build.py then cuts them into apps/web/public/onboarding.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main]
    paths: ['design/kimorin-art-queue.json']

concurrency:
  group: kimorin-art-${{ github.ref }}
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paint
        run: |
          export SEEDREAM_API_KEY="$(gcloud secrets versions access latest --secret=obolo-seedream-api-key)"
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          MAX_PICTURES=120 LATE_MINUTES=45 node scripts/ui-art/paint.mjs design/kimorin-art-queue.json
      - name: Save the pictures to the branch
        if: always()
        run: |
          git config user.name "kimorin-art"
          git config user.email "kimorin-art@users.noreply.github.com"
          git add -f design/kimorin design/kimorin-art-queue.json
          git diff --cached --quiet && exit 0
          git commit -m "KIMORIN art: new pictures [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
