name: Smoke makers

# Runs scripts/smoke/makers.mjs against the deployed API as a one-off Cloud Run job with the API's own service
# account (it alone may read the admin token; the token never leaves Google Cloud). A fresh invited test account
# makes a NEO look, a Bati and kororin designs; the runner then fetches the pictures and uploads them.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/smoke/**', '.github/workflows/smoke.yml']

env:
  REGION: asia-northeast1
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
  RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA || format('obolo-api-runtime@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run the makers in Cloud Run
        run: |
          API="https://obolo-api-${{ vars.GCP_PROJECT_NUMBER }}.${REGION}.run.app"
          IMAGE=$(gcloud run services describe obolo-api --region "$REGION" --format='value(spec.template.spec.containers[0].image)')
          echo "image $IMAGE"
          gcloud run jobs deploy obolo-smoke --region "$REGION" --image "$IMAGE" --service-account "$RUNTIME_SA" \
            --set-secrets ADMIN_TOKEN=obolo-admin-token:latest \
            --set-env-vars "^##^API=$API##NO_SAVE=1##SCRIPT_B64=$(base64 -w0 scripts/smoke/makers.mjs)" \
            --command node --args "^##^--input-type=module##-e##await import('data:text/javascript;base64,' + process.env.SCRIPT_B64)" \
            --task-timeout 1200 --max-retries 0 --quiet
          EXEC=$(gcloud run jobs execute obolo-smoke --region "$REGION" --wait --format='value(metadata.name)' || true)
          echo "execution $EXEC"
          sleep 20
          gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=obolo-smoke AND labels.\"run.googleapis.com/execution_name\"=\"$EXEC\"" \
            --order=asc --limit=300 --format='value(textPayload)' > log.txt || true
          cat log.txt
          mkdir -p smoke-out
          grep '^IMG ' log.txt | while read -r _ name url; do curl -sfL "$url" -o "smoke-out/$name.img" || echo "fetch failed $name"; done
          cp log.txt smoke-out/
          # one contact sheet + the log on the branch (the session that runs this cannot reach the CDN)
          mkdir -p docs/smoke
          pip install -q pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageDraw
          fs = sorted(glob.glob('smoke-out/*.img'))
          if fs:
              W, cols = 300, 4
              rows = (len(fs) + cols - 1) // cols
              S = Image.new('RGB', (W * cols, (W + 24) * rows), '#222')
              d = ImageDraw.Draw(S)
              for i, f in enumerate(fs):
                  try:
                      im = Image.open(f).convert('RGBA')
                      bg = Image.new('RGBA', im.size, (60, 60, 70, 255)); bg.alpha_composite(im)
                      im = bg.convert('RGB'); im.thumbnail((W, W))
                      x, y = (i % cols) * W, (i // cols) * (W + 24)
                      S.paste(im, (x, y + 24)); d.text((x + 6, y + 4), os.path.basename(f)[:-4], fill='white')
                  except Exception as e:
                      print('skip', f, e)
              S.save('docs/smoke/latest.jpg', quality=82)
          PY
          grep -v '^IMG ' log.txt | grep -v '^$' > docs/smoke/latest.txt || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/smoke
          git diff --cached --quiet || git commit -m "Smoke makers: pictures and log [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-out
          path: smoke-out
