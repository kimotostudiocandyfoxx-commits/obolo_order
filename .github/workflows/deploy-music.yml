# Deploys gpu/music (Mercury instrumentals) to Cloud Run with an NVIDIA L4 GPU.
# One-time setup: scripts/music-setup.sh (Cloud Shell), then the repository variable MUSIC_REGION.
# Runs on pushes that touch gpu/music, or manually: Actions → Deploy Music GPU → Run workflow.
name: Deploy Music GPU

on:
  workflow_dispatch:
  push:
    branches: [main, claude/solar-system-home-planets-ew766y]
    paths: ['gpu/music/**']

concurrency:
  group: deploy-music
  cancel-in-progress: false

env:
  REGION: ${{ vars.MUSIC_REGION }}
  REPO_REGION: asia-northeast1
  SERVICE: obolo-music
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
  MUSIC_SA: ${{ format('obolo-music-runtime@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
  # model cache next to the GPU (cross-region reads would be billed on every cold start)
  BUCKET: ${{ format('{0}-models-{1}', vars.GCP_PROJECT_ID, vars.MUSIC_REGION) }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.MUSIC_REGION != '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # the PyTorch + CUDA image is large; make room on the runner
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: Build & push image
        run: |
          IMAGE="${REPO_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/obolo/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REPO_REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" gpu/music
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy (GPU)
        run: |
          gcloud beta run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --quiet \
            --no-allow-unauthenticated --service-account "$MUSIC_SA" \
            --gpu 1 --gpu-type nvidia-l4 --no-gpu-zonal-redundancy \
            --cpu 4 --memory 16Gi --no-cpu-throttling \
            --concurrency 1 --min-instances 0 --max-instances 1 --timeout 900 \
            --add-volume name=models,type=cloud-storage,bucket="$BUCKET" \
            --add-volume-mount volume=models,mount-path=/models \
            --set-env-vars HF_HOME=/models/hf,ACESTEP_CHECKPOINTS_DIR=/models/ace15,MUSIC_ENGINE=${{ vars.MUSIC_ENGINE || 'acestep15' }},ACE15_MODEL=${{ vars.ACE15_MODEL || 'acestep-v15-turbo' }},ACE_REF_STRENGTH=${{ vars.ACE_REF_STRENGTH || '0' }}
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "### Music GPU: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "次に Actions → Deploy API → Run workflow を実行してください（API がこの URL を使い始めます）" >> "$GITHUB_STEP_SUMMARY"
