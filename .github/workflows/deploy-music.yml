# Deploys gpu/music (Mercury instrumentals) to Cloud Run with an NVIDIA L4 GPU.
# One-time setup: scripts/music-setup.sh (Cloud Shell), then the repository variable MUSIC_REGION.
# Runs on pushes that touch gpu/music, or manually: Actions → Deploy Music GPU → Run workflow.
name: Deploy Music GPU

on:
  workflow_dispatch:
    inputs:
      refresh_weights:
        description: 'モデルを入れ直し、正しい一式以外のファイルを消す'
        type: boolean
        default: false
  push:
    branches: [main, claude/solar-system-home-planets-ew766y]
    paths: ['gpu/music/**']

concurrency:
  group: deploy-music
  cancel-in-progress: false

env:
  REGION: ${{ vars.MUSIC_REGION }}
  REPO_REGION: asia-northeast1
  SERVICE: obolo-music
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
  MUSIC_SA: ${{ format('obolo-music-runtime@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
  # model cache next to the GPU (cross-region reads would be billed on every cold start)
  BUCKET: ${{ format('{0}-models-{1}', vars.GCP_PROJECT_ID, vars.MUSIC_REGION) }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.MUSIC_REGION != '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # the PyTorch + CUDA image is large; make room on the runner
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: Build & push image
        run: |
          IMAGE="${REPO_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/obolo/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REPO_REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" gpu/music
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Model weights go into the bucket from here: download on the runner (fast, visible in this log)
      # and copy with parallel uploads. Skipped once a marker for this model exists in the bucket.
      - name: Model weights → bucket
        run: |
          MODEL="${{ vars.ACE15_MODEL || 'acestep-v15-turbo' }}"
          MARK="gs://$BUCKET/ace15/.ready-$MODEL"
          REFRESH="${{ inputs.refresh_weights || false }}"
          if [ "$REFRESH" != "true" ] && gcloud storage ls "$MARK" >/dev/null 2>&1; then echo "weights already in the bucket"; exit 0; fi
          sudo mkdir -p /mnt/ace15 /mnt/hf && sudo chmod 777 /mnt/ace15 /mnt/hf
          docker run --rm -e ACESTEP_CHECKPOINTS_DIR=/ckpt -e HF_HOME=/hf -e ACE15_MODEL="$MODEL" \
            -v /mnt/ace15:/ckpt -v /mnt/hf:/hf "$IMAGE" python /app/app.py download
          du -sh /mnt/ace15
          # refresh: also delete leftovers (partial downloads) that are not part of the model set
          if [ "$REFRESH" = "true" ]; then DEL=--delete-unmatched-destination-objects; else DEL=; fi
          gcloud storage rsync -r $DEL /mnt/ace15 "gs://$BUCKET/ace15"
          echo ok | gcloud storage cp - "$MARK"

      # MUSIC_MIN_INSTANCES=1 keeps one GPU awake (no cold start, billed around the clock)
      - name: Deploy (GPU)
        run: |
          gcloud beta run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --quiet \
            --no-allow-unauthenticated --service-account "$MUSIC_SA" \
            --gpu 1 --gpu-type nvidia-l4 --no-gpu-zonal-redundancy \
            --cpu 4 --memory 16Gi --no-cpu-throttling \
            --concurrency 1 --min-instances ${{ vars.MUSIC_MIN_INSTANCES || '0' }} --max-instances 1 --timeout 900 \
            --add-volume name=models,type=cloud-storage,bucket="$BUCKET" \
            --add-volume-mount volume=models,mount-path=/models \
            --set-env-vars HF_HOME=/models/hf,ACESTEP_CHECKPOINTS_DIR=/models/ace15,MUSIC_ENGINE=${{ vars.MUSIC_ENGINE || 'acestep15' }},ACE15_MODEL=${{ vars.ACE15_MODEL || 'acestep-v15-turbo' }},ACE_REF_STRENGTH=${{ vars.ACE_REF_STRENGTH || '0' }}
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "### Music GPU: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "次に Actions → Deploy API → Run workflow を実行してください（API がこの URL を使い始めます）" >> "$GITHUB_STEP_SUMMARY"
