name: Story assets

# Story people and places without a picture (client plan 2026-10-13, design/story/README.md):
#  - design/story-assets-queue.json changed → candidates painted with Seedream 5.0 Pro
#    (scripts/story/paint-assets.mjs) into apps/web/public/story/candidates/
#  - design/story-picks.json changed → the picks cut out / cropped into the app's places
#    (scripts/story/promote-assets.py) — apps/web/public/story/cast/, places/
# then the asset list (public/story/assets.json, docs/story-import/assets.md) is refreshed.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main]
    paths: ['design/story-assets-queue.json', 'design/story-picks.json', 'design/story/cast/**', 'design/story/places/**']

concurrency:
  group: story-assets-${{ github.ref }}
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Asset list (with the story chat's sheets)
        run: bash scripts/story/assets.sh
      - name: Paint candidates
        run: |
          export SEEDREAM_API_KEY="$(gcloud secrets versions access latest --secret=obolo-seedream-api-key)"
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          node scripts/story/paint-assets.mjs
      - name: Promote the picks
        run: |
          pip install -q "rembg[cpu]==2.0.67" pillow
          python scripts/story/promote-assets.py
      - name: Asset list again
        if: always()
        run: bash scripts/story/assets.sh
      - name: Save to the branch
        if: always()
        run: |
          git config user.name "story-assets"
          git config user.email "story-assets@users.noreply.github.com"
          # only the paths that exist (one missing path makes git add refuse them all)
          for p in apps/web/public/story/candidates apps/web/public/story/cast apps/web/public/story/places apps/web/public/story/assets.json apps/web/public/story/promoted.json docs/story-import/assets.md docs/story-import/assets-paint-last-run.md docs/story-import/assets-promote-last-run.md; do
            [ -e "$p" ] && git add -f "$p"
          done
          git diff --cached --quiet && exit 0
          git commit -m "Story assets: candidates / picks [skip ci]"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
