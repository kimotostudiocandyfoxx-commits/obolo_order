name: MV art

# MV art (2026-11-12, the Mars studio MV prototype): the pictures listed in design/mv-art-queue.json are
# painted with Seedream 5.0 Pro (scripts/mv-art/paint.mjs) and saved to the folder the queue names (queue.out).
# Only names-free pictures go here: the song, the lyrics and any real person's photo stay out of this public repo.
# A person's reference photo is never stored here: it comes in as the `ref` input (base64 JPEG), is read from the
# event file (never echoed) and written to /tmp only. Run by hand (workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      key:
        description: 'key for design/mv-art/photos.enc (encrypted photos; never stored in the repo)'
        required: false
        default: ''
      sums:
        description: 'md5 of each decoded photo, comma separated in ref order (a photo that does not match is dropped)'
        required: false
        default: ''
      set:
        description: 'name of this batch of photos: ref<n> is saved as /tmp/mv-<set>-<n>.jpg (default person)'
        required: false
        default: 'person'
      ref:
        description: 'reference photo (base64 jpeg)'
        required: false
        default: ''
      ref1:
        description: 'reference photo 1 (base64 jpeg)'
        required: false
        default: ''
      ref2:
        description: 'reference photo 2 (base64 jpeg)'
        required: false
        default: ''
      ref3:
        description: 'reference photo 3 (base64 jpeg)'
        required: false
        default: ''
      ref4:
        description: 'reference photo 4 (base64 jpeg)'
        required: false
        default: ''
      ref5:
        description: 'reference photo 5 (base64 jpeg)'
        required: false
        default: ''
      ref6:
        description: 'reference photo 6 (base64 jpeg)'
        required: false
        default: ''

concurrency:
  group: mv-art-${{ github.ref }}
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reference photo (to /tmp only)
        run: |
          jq -r '.inputs.ref // empty' "$GITHUB_EVENT_PATH" | base64 -d > /tmp/mv-person.jpg 2>/dev/null || true
          [ -s /tmp/mv-person.jpg ] && echo "reference ready" || rm -f /tmp/mv-person.jpg
          # encrypted photos (AES-256, the key only comes in as an input) -> /tmp/mv-<set>-<n>.jpg
          K="$(jq -r '.inputs.key // ""' "$GITHUB_EVENT_PATH")"
          if [ -n "$K" ] && [ -f design/mv-art/photos.enc ]; then
            echo "::add-mask::$K"
            K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in design/mv-art/photos.enc | tar -x -C /tmp && ls /tmp | grep -c '^mv-.*\.jpg$' || echo "photos.enc could not be opened"
          fi
          SET="$(jq -r '.inputs.set // "person"' "$GITHUB_EVENT_PATH" | tr -cd 'a-z0-9')"; SET="${SET:-person}"
          for i in 1 2 3 4 5 6; do
            R="$(jq -r ".inputs.ref$i // empty" "$GITHUB_EVENT_PATH")"
            [ -z "$R" ] && continue
            printf '%s' "$R" | base64 -d > /tmp/mv-$SET-$i.jpg 2>/dev/null || true
            # only a real JPEG counts (a broken or placeholder input is dropped, so its picture waits instead)
            [ "$(head -c 3 /tmp/mv-$SET-$i.jpg 2>/dev/null | od -An -tx1 | tr -d ' ')" = "ffd8ff" ] || rm -f /tmp/mv-$SET-$i.jpg
            # with sums given, a photo whose md5 differs from the one sent (a copy error) is dropped too
            WANT="$(jq -r '.inputs.sums // ""' "$GITHUB_EVENT_PATH" | cut -d, -f$i | tr -cd '0-9a-f')"
            if [ -s /tmp/mv-$SET-$i.jpg ] && [ -n "$WANT" ] && [ "$(md5sum < /tmp/mv-$SET-$i.jpg | cut -c1-32)" != "$WANT" ]; then echo "reference $SET-$i does not match its sum: dropped"; rm -f /tmp/mv-$SET-$i.jpg; fi
            [ -s /tmp/mv-$SET-$i.jpg ] && echo "reference $SET-$i ready" || true
          done
      - name: Paint
        run: |
          export SEEDREAM_API_KEY="$(gcloud secrets versions access latest --secret=obolo-seedream-api-key)"
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          MAX_PICTURES=40 node scripts/mv-art/paint.mjs design/mv-art-queue.json
      - name: Save the pictures to the branch
        if: always()
        run: |
          git config user.name "mv-art"
          git config user.email "mv-art@users.noreply.github.com"
          # the encrypted photos are used once, then removed from the branch
          [ -n "$(jq -r '.inputs.key // ""' "$GITHUB_EVENT_PATH")" ] && git rm -q --ignore-unmatch design/mv-art/photos.enc || true
          git add -f design/mv-art design/mv-art-queue.json
          git diff --cached --quiet && exit 0
          git commit -m "MV art: new pictures [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
