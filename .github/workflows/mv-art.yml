name: MV art

# MV art (2026-11-12, the Mars studio MV prototype): the pictures listed in design/mv-art-queue.json are
# painted with Seedream 5.0 Pro (scripts/mv-art/paint.mjs) and saved to the folder the queue names (queue.out).
# Only names-free pictures go here: the song, the lyrics and any real person's photo stay out of this public repo.
# A person's reference photo is never stored here: it comes in as the `ref` input (base64 JPEG), is read from the
# event file (never echoed) and written to /tmp only. Run by hand (workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'reference photo (base64 jpeg)'
        required: false
        default: ''
      ref1:
        description: 'reference photo 1 (base64 jpeg)'
        required: false
        default: ''
      ref2:
        description: 'reference photo 2 (base64 jpeg)'
        required: false
        default: ''
      ref3:
        description: 'reference photo 3 (base64 jpeg)'
        required: false
        default: ''
      ref4:
        description: 'reference photo 4 (base64 jpeg)'
        required: false
        default: ''

concurrency:
  group: mv-art-${{ github.ref }}
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reference photo (to /tmp only)
        run: |
          jq -r '.inputs.ref // empty' "$GITHUB_EVENT_PATH" | base64 -d > /tmp/mv-person.jpg 2>/dev/null || true
          [ -s /tmp/mv-person.jpg ] && echo "reference ready" || rm -f /tmp/mv-person.jpg
          for i in 1 2 3 4; do
            jq -r ".inputs.ref$i // empty" "$GITHUB_EVENT_PATH" | base64 -d > /tmp/mv-person-$i.jpg 2>/dev/null || true
            [ -s /tmp/mv-person-$i.jpg ] && echo "reference $i ready" || rm -f /tmp/mv-person-$i.jpg
          done
      - name: Paint
        run: |
          export SEEDREAM_API_KEY="$(gcloud secrets versions access latest --secret=obolo-seedream-api-key)"
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          MAX_PICTURES=40 node scripts/mv-art/paint.mjs design/mv-art-queue.json
      - name: Save the pictures to the branch
        if: always()
        run: |
          git config user.name "mv-art"
          git config user.email "mv-art@users.noreply.github.com"
          git add -f design/mv-art design/mv-art-queue.json
          git diff --cached --quiet && exit 0
          git commit -m "MV art: new pictures [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
