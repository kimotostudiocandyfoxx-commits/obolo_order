name: MV lab

# MV quality loop (client request 2026-10-09): makes story MVs from studio-lab songs and a hero
# picture exactly as the app does (apps/api/scripts/mv-lab.ts), has Gemini watch and judge them,
# and commits art/lab/mv/<round>/. A round is started by changing scripts/mv-lab/round.json.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/mv-lab/**', '.github/workflows/mv-lab.yml', 'apps/api/scripts/mv-lab.ts']

concurrency:
  group: mv-lab
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
  MUSIC_URL: ${{ format('https://obolo-music-{0}.{1}.run.app', vars.GCP_PROJECT_NUMBER, vars.MUSIC_REGION) }}

jobs:
  songs:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Wait for the round's songs (made by the Studio lab)
        run: |
          SONGS=$(node -e "console.log(require('./scripts/mv-lab/round.json').songs)")
          for i in $(seq 1 120); do [ -f "$SONGS" ] && break; sleep 60; git pull -q origin "${GITHUB_REF_NAME}"; done
          test -f "$SONGS"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: idtok
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ env.MUSIC_URL }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pnpm install --frozen-lockfile
          pnpm build:packages
      - name: Make and judge the MVs
        env:
          MUSIC_TOKEN: ${{ steps.idtok.outputs.id_token }}
        run: |
          export GEMINI_API_KEY="$(gcloud secrets versions access latest --secret=obolo-gemini-api-key 2>/dev/null || true)"
          export NOVITA_API_KEY="$(gcloud secrets versions access latest --secret=obolo-novita-api-key 2>/dev/null || true)"
          [ -n "$GEMINI_API_KEY" ] || echo "::warning::no access to obolo-gemini-api-key: storyboards by rule, no judging"
          cd apps/api && npx --yes tsx@4.19.2 scripts/mv-lab.ts
      - name: Save the round to the branch
        if: always()
        run: |
          git config user.name "mv-lab"
          git config user.email "mv-lab@users.noreply.github.com"
          git add -f art/lab/mv
          git diff --cached --quiet && exit 0
          git commit -m "MV lab: round results [skip ci]"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
