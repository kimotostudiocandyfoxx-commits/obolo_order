name: Look lab

# Look / Bati lab (client 2026-10-25): design/look-lab-queue.json changed → the same prompts painted by
# Seedream and Gemini side by side (scripts/look-lab/run.mjs), to choose before the app changes.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main]
    paths: ['design/look-lab-queue.json']

concurrency:
  group: look-lab-${{ github.ref }}
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make
        run: |
          export RUNWARE_API_KEY="$(gcloud secrets versions access latest --secret=obolo-seedream-api-key)"
          export GEMINI_API_KEY="$(gcloud secrets versions access latest --secret=obolo-gemini-api-key)"
          node scripts/look-lab/run.mjs
      - name: Save to the branch
        if: always()
        run: |
          git config user.name "look-lab"
          git config user.email "look-lab@users.noreply.github.com"
          git add -f design/look-lab design/look-lab-queue.json
          git diff --cached --quiet && exit 0
          git commit -m "Look lab: new pictures [skip ci]"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
