name: Art workshop

# Claude Code designs the UI art (art/queue.json); Gemini (images) and Veo (videos) paint it.
# The results are committed back to the branch under art/out/ (client request 2026-10-07).
on:
  workflow_dispatch:
  push:
    branches: [main, claude/solar-system-home-planets-ew766y]
    paths: ['art/queue.json']

concurrency:
  group: art
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paint
        run: |
          # needs: gcloud secrets add-iam-policy-binding obolo-gemini-api-key --member=serviceAccount:<deploy SA> --role=roles/secretmanager.secretAccessor
          export GEMINI_API_KEY="$(gcloud secrets versions access latest --secret=obolo-gemini-api-key)"
          node scripts/art/generate.mjs
      - name: Save the results to the branch
        if: always()
        run: |
          git config user.name "art-workshop"
          git config user.email "art-workshop@users.noreply.github.com"
          mkdir -p art/out
          git add art/out
          git diff --cached --quiet && exit 0
          git commit -m "Art workshop: new images / videos [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
