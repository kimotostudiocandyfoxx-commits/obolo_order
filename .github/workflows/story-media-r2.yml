name: Story media to R2

# Copies story media kept out of the public repository (the client's private Google Cloud Storage) to Cloudflare R2,
# served at https://media.obolo.life/<key> (docs/media.md "物語の非公開メディア"). From the Actions tab, by hand.
#  - every object under `gcs_prefix` goes to `r2_prefix` + its path below the prefix, with its content-type and a
#    long Cache-Control (a changed file should get a new name: the CDN and browsers keep the old one for a year)
#  - then the public URLs are printed and each is checked with an HTTP HEAD (status, content-type, content-length);
#    the run fails if one does not answer 200 with the right type and size
# Google Cloud: the deployer service account (roles/storage.objectAdmin on the bucket; only object list/get are used,
# not buckets.get). R2: the same secrets / variables as deploy-api.yml (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_ACCOUNT_ID, R2_BUCKET, R2_PUBLIC_BASE).
on:
  workflow_dispatch:
    inputs:
      gcs_prefix:
        description: 'Google Cloud Storage prefix to copy (gs://bucket/path/)'
        default: 'gs://obolo-order-models-asia-southeast1/story/rocket-song/'
      r2_prefix:
        description: 'R2 key prefix the files go to (no leading slash)'
        default: 'story/rocket-song/'
      cache_control:
        description: 'Cache-Control of the copied files'
        default: 'public, max-age=31536000, immutable'

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  copy:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Download from Google Cloud Storage
        env:
          GCS_PREFIX: ${{ inputs.gcs_prefix }}
          R2_PREFIX: ${{ inputs.r2_prefix }}
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          echo "::add-mask::$TOKEN"
          export TOKEN
          mkdir -p media
          # the JSON API's objects.list / objects.get only (the deployer may not read the bucket itself)
          python3 - <<'PY'
          import json, os, re, sys, urllib.parse, urllib.request
          src = os.environ['GCS_PREFIX'].strip()
          dst = os.environ['R2_PREFIX'].strip().lstrip('/')
          m = re.fullmatch(r'gs://([a-z0-9._-]+)/(.*)', src)
          if not m:
              sys.exit('::error::gcs_prefix must look like gs://bucket/path/')
          bucket, prefix = m.group(1), m.group(2)
          if prefix and not prefix.endswith('/'):
              prefix += '/'
          if dst and not dst.endswith('/'):
              dst += '/'
          if '..' in dst.split('/') or not re.fullmatch(r'[A-Za-z0-9._/-]*', dst):
              sys.exit('::error::r2_prefix may hold only letters, digits, . _ - and /')
          h = {'Authorization': 'Bearer ' + os.environ['TOKEN']}
          base = 'https://storage.googleapis.com/storage/v1/b/' + urllib.parse.quote(bucket, safe='') + '/o'
          names, page = [], None
          while True:
              q = {'prefix': prefix, 'fields': 'items(name,size,contentType),nextPageToken'}
              if page:
                  q['pageToken'] = page
              with urllib.request.urlopen(urllib.request.Request(base + '?' + urllib.parse.urlencode(q), headers=h)) as r:
                  j = json.load(r)
              names += [o for o in j.get('items', []) if not o['name'].endswith('/')]
              page = j.get('nextPageToken')
              if not page:
                  break
          if not names:
              sys.exit('::error::no objects under ' + src)
          plan = []
          for o in names:
              rel = o['name'][len(prefix):]
              if not re.fullmatch(r'[A-Za-z0-9._/-]+', rel) or '..' in rel.split('/'):
                  sys.exit('::error::unexpected object name: ' + o['name'])
              path = os.path.join('media', rel)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              url = base + '/' + urllib.parse.quote(o['name'], safe='') + '?alt=media'
              with urllib.request.urlopen(urllib.request.Request(url, headers=h)) as r, open(path, 'wb') as f:
                  while chunk := r.read(1 << 20):
                      f.write(chunk)
              size = os.path.getsize(path)
              if size != int(o['size']):
                  sys.exit(f'::error::{o["name"]}: downloaded {size} bytes, expected {o["size"]}')
              plan.append({'file': path, 'key': dst + rel, 'size': size, 'gcsType': o.get('contentType', '')})
              print(f'got {o["name"]} ({size} bytes)')
          json.dump(plan, open('plan.json', 'w'))
          PY

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 and the newer AWS CLI's default checksums: only when an operation needs them
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ACCOUNT: ${{ vars.R2_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET }}
          CACHE: ${{ inputs.cache_control }}
        run: |
          set -euo pipefail
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$ACCOUNT" ] || [ -z "$BUCKET" ]; then
            echo "::error::R2 secrets / variables missing (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID, R2_BUCKET)"
            exit 1
          fi
          echo "::add-mask::$ACCOUNT"
          ENDPOINT="https://${ACCOUNT}.r2.cloudflarestorage.com"
          python3 - > uploads.tsv <<'PY'
          import json, mimetypes
          types = {'.mp3': 'audio/mpeg', '.m4a': 'audio/mp4', '.wav': 'audio/wav', '.ogg': 'audio/ogg', '.mp4': 'video/mp4',
                   '.webm': 'video/webm', '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.png': 'image/png', '.webp': 'image/webp',
                   '.json': 'application/json', '.vtt': 'text/vtt'}
          for p in json.load(open('plan.json')):
              ext = '.' + p['file'].rsplit('.', 1)[-1].lower() if '.' in p['file'] else ''
              t = types.get(ext) or mimetypes.guess_type(p['file'])[0] or p['gcsType'] or 'application/octet-stream'
              print('\t'.join([p['file'], p['key'], t, str(p['size'])]))
          PY
          while IFS=$'\t' read -r FILE KEY TYPE SIZE; do
            aws s3api put-object --endpoint-url "$ENDPOINT" --bucket "$BUCKET" --key "$KEY" --body "$FILE" \
              --content-type "$TYPE" --cache-control "$CACHE" --output text --query 'ETag' < /dev/null > /dev/null
            echo "put $KEY ($TYPE, $SIZE bytes)"
          done < uploads.tsv

      - name: Check the public URLs
        env:
          BASE: ${{ vars.R2_PUBLIC_BASE || 'https://media.obolo.life' }}
        run: |
          set -euo pipefail
          BASE="${BASE%/}"
          FAIL=0
          { echo "| URL | status | content-type | content-length |"; echo "|---|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r FILE KEY TYPE SIZE; do
            URL="$BASE/$KEY"
            STATUS=""; CT=""; LEN=""
            for TRY in 1 2 3 4 5; do
              HEAD=$(curl -sSI -o - --max-time 30 "$URL" || true)
              STATUS=$(printf '%s' "$HEAD" | awk 'toupper($1) ~ /^HTTP\// {s=$2} END {print s}')
              CT=$(printf '%s' "$HEAD" | awk -F': ' 'tolower($1)=="content-type" {v=$2} END {print v}' | tr -d '\r')
              LEN=$(printf '%s' "$HEAD" | awk -F': ' 'tolower($1)=="content-length" {v=$2} END {print v}' | tr -d '\r')
              [ "$STATUS" = "200" ] && break
              sleep $(( TRY * 5 ))
            done
            echo "$URL  status=$STATUS  content-type=$CT  content-length=$LEN"
            echo "| $URL | $STATUS | $CT | $LEN |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$STATUS" != "200" ] || [ "${CT%%;*}" != "$TYPE" ] || [ "$LEN" != "$SIZE" ]; then
              echo "::error::$URL: expected 200, $TYPE, $SIZE bytes"
              FAIL=1
            fi
          done < uploads.tsv
          exit $FAIL
