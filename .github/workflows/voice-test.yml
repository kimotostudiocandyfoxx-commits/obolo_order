name: Voice try-out

# Voice try-out (2026-11-24, Saturn prototype): reads the korolin lines in the client's own voice with Fish Audio,
# like the app does with a member's registered voice. The recording comes in encrypted (design/voice-test/voice.enc,
# AES-256; the key is only an input, never stored), the spoken lines go back encrypted with the same key
# (design/voice-test/out.enc), and the recording is removed from the branch after the run. Run by hand.
on:
  workflow_dispatch:
    inputs:
      key:
        description: 'key for design/voice-test/voice.enc (never stored in the repo)'
        required: true
        default: ''

concurrency:
  group: voice-test-${{ github.ref }}
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  speak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open the recording (to /tmp only)
        run: |
          K="$(jq -r '.inputs.key // ""' "$GITHUB_EVENT_PATH")"
          echo "::add-mask::$K"
          mkdir -p /tmp/voice
          K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in design/voice-test/voice.enc | tar -x -C /tmp/voice
          ls /tmp/voice
      - name: Speak
        run: |
          export FISH_API_KEY="$(gcloud secrets versions access latest --secret=obolo-fish-api-key)"
          echo "::add-mask::$FISH_API_KEY"
          node scripts/voice-test/speak.mjs
      - name: Save the lines (encrypted) and remove the recording
        if: always()
        run: |
          K="$(jq -r '.inputs.key // ""' "$GITHUB_EVENT_PATH")"
          if ls /tmp/voice-out/*.mp3 >/dev/null 2>&1; then
            tar -C /tmp/voice-out -c . | K="$K" openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -out design/voice-test/out.enc
          fi
          git config user.name "voice-test"
          git config user.email "voice-test@users.noreply.github.com"
          git rm -q --ignore-unmatch design/voice-test/voice.enc
          git add -f design/voice-test
          git diff --cached --quiet && exit 0
          git commit -m "Voice try-out: spoken lines (encrypted) [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
          rm -rf /tmp/voice /tmp/voice-out
