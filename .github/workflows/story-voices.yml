name: Story voices

# Story voices (client plan 2026-10-13): design/story-voices.json changed → auditions (several voices
# per person) and, for people whose voice is chosen, every spoken line (apps/web/scripts/story-voices.ts),
# saved to apps/web/public/story/voices/.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main]
    paths: ['design/story-voices.json']

concurrency:
  group: story-voices-${{ github.ref }}
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Voices
        run: |
          export GEMINI_API_KEY="$(gcloud secrets versions access latest --secret=obolo-gemini-api-key)"
          # KIMORIN is cloned from a recording with Fish Audio (if the key is in Secret Manager)
          export FISH_API_KEY="$(gcloud secrets versions access latest --secret=obolo-fish-api-key 2>/dev/null || true)"
          sudo apt-get install -y -qq rubberband-cli >/dev/null 2>&1 || true
          ffmpeg -hide_banner -filters | grep -q rubberband || echo "::warning::ffmpeg has no rubberband filter"
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          npx --yes tsx@4.19.2 apps/web/scripts/story-voices.ts
      - name: Save to the branch
        if: always()
        run: |
          # keep what this run made, move onto the branch as it is now, then commit (no rebase conflicts)
          OUT="$(mktemp -d)"
          for p in apps/web/public/story/voices docs/story-import/voices-last-run.md design/story-voices.json; do
            [ -e "$p" ] && mkdir -p "$OUT/$(dirname "$p")" && cp -r "$p" "$OUT/$(dirname "$p")/"
          done
          git config user.name "story-voices"
          git config user.email "story-voices@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
            cp -r "$OUT"/. .
            for p in apps/web/public/story/voices docs/story-import/voices-last-run.md design/story-voices.json; do
              [ -e "$p" ] && git add -f "$p"
            done
            git diff --cached --quiet && exit 0
            git commit -q -m "Story voices: new takes [skip ci]"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
