name: ONNX lab

# Plan A step 3 (client decision 2026-10-09): check which models of the music studio run in ONNX
# Runtime — HTDemucs (via demucs.onnx, MIT) and the parts of Seed-VC — same output? faster?
# Results → art/lab/onnx/ (committed back to the branch).
on:
  workflow_dispatch:
  push:
    branches: [claude/solar-system-home-planets-ew766y]
    paths: ['scripts/onnx-lab/**', '.github/workflows/onnx-lab.yml']

concurrency:
  group: onnx-lab
  cancel-in-progress: true

jobs:
  htdemucs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (demucs.onnx's demucs, CPU torch)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          git clone -q --depth 1 https://github.com/sevagh/demucs.onnx.git /tmp/demucsonnx
          pip install --quiet "torch==2.4.1" "torchaudio==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "onnx==1.16.2" "onnxruntime==1.19.2" "numpy<2" -e /tmp/demucsonnx/demucs-for-onnx
      - name: Export htdemucs_ft_vocals and compare with PyTorch
        run: |
          REPORT=art/lab/onnx/htdemucs.md python scripts/onnx-lab/htdemucs_onnx.py /tmp/onnx/htdemucs_ft_vocals.onnx
      - name: Save the report
        if: always()
        run: |
          git config user.name "onnx-lab" && git config user.email "onnx-lab@users.noreply.github.com"
          mkdir -p art/lab/onnx && git add -f art/lab/onnx && (git diff --cached --quiet && exit 0 || git commit -m "ONNX lab: HTDemucs [skip ci]")
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done

  seedvc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Seed-VC (same pins as gpu/music/Dockerfile, CPU torch)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          git clone -q https://github.com/Plachtaa/seed-vc.git /tmp/seedvc && cd /tmp/seedvc && git checkout -q 51383efd921027683c89e5348211d93ff12ac2a8
          pip install --quiet "torch==2.4.0" "torchaudio==2.4.0" --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "scipy==1.13.1" "librosa==0.10.2" "huggingface-hub>=0.28.1" "munch==4.0.0" "einops==0.8.0" \
            "descript-audio-codec==1.0.0" "transformers==4.46.3" "soundfile==0.12.1" "numpy==1.26.4" pyyaml matplotlib tqdm
          # descript-audio-codec pins an old protobuf; ONNX needs a newer one (only the lab needs both)
          pip install --quiet --no-deps "onnx==1.16.2" "onnxruntime==1.19.2"
          pip install --quiet "protobuf>=3.20.2,<5" flatbuffers coloredlogs sympy packaging
      - name: Export the parts and compare with PyTorch
        run: |
          cd /tmp/seedvc && REPORT=$GITHUB_WORKSPACE/art/lab/onnx/seedvc.md python $GITHUB_WORKSPACE/scripts/onnx-lab/seedvc_onnx.py
      - name: Save the report
        if: always()
        run: |
          git config user.name "onnx-lab" && git config user.email "onnx-lab@users.noreply.github.com"
          mkdir -p art/lab/onnx && git add -f art/lab/onnx && (git diff --cached --quiet && exit 0 || git commit -m "ONNX lab: Seed-VC [skip ci]")
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
