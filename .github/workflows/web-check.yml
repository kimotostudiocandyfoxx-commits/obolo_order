name: Web check

# What Vercel did with the latest commits (their statuses and deployments on GitHub) and whether the production site
# answers the pages. For Claude to read in the job log; nothing is committed.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/web-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      statuses: read
    steps:
      - name: Vercel statuses and the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          for sha in $(gh api "repos/$R/commits?sha=${{ github.ref_name }}&per_page=6" --jq '.[].sha'); do
            echo "== $sha"; gh api "repos/$R/commits/$sha/status" --jq '.statuses[] | "\(.context) \(.state) \(.description) \(.target_url)"' || true
          done
          echo "== deployments"
          gh api "repos/$R/deployments?per_page=8" --jq '.[] | "\(.created_at) \(.environment) \(.ref) \(.sha[0:8])"' || true
          for id in $(gh api "repos/$R/deployments?per_page=4" --jq '.[].id'); do gh api "repos/$R/deployments/$id/statuses" --jq '.[0] | "  \(.state) \(.environment_url) \(.description)"' || true; done
          echo "== site"
          for p in / /kakunin-5798f28713 /kakunin-5798f28713/bati-chat /invite/5qfNCg8JHs7Jymzs; do
            echo "$p $(curl -s -o /dev/null -w '%{http_code}' https://oboloorder-web.vercel.app$p)"
          done
