name: Bati model test

# Bati's chat answered by Claude Haiku 5.5 and Gemini Flash-Lite with the same prompts and cases (scripts/bati-test).
# Keys come from Secret Manager (obolo-gemini-api-key, obolo-anthropic-api-key) or the repository secret ANTHROPIC_API_KEY;
# a missing key skips that model.
# Runs when scripts/bati-test/run.txt is pushed (a line effort=low|medium sets Haiku's effort).
# The cases hold no names or personal data. Results are committed to scripts/bati-test/results.json and report.md.
on:
  push:
    paths:
      - scripts/bati-test/run.txt
  workflow_dispatch:
    inputs:
      haiku_effort:
        description: 'Haiku 5.5 effort (low / medium)'
        required: false
        default: 'low'

concurrency:
  group: bati-model-test-${{ github.ref }}
  cancel-in-progress: false

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github/providers/github', vars.GCP_PROJECT_NUMBER) }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || format('obolo-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare
        env:
          HAIKU_EFFORT: ${{ inputs.haiku_effort }}
          RUN_FILE: scripts/bati-test/run.txt
          GH_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          G="$(gcloud secrets versions access latest --secret=obolo-gemini-api-key 2>/dev/null || true)"
          A="$(gcloud secrets versions access latest --secret=obolo-anthropic-api-key 2>/dev/null || true)"
          [ -z "$A" ] && A="$GH_ANTHROPIC"   # or the repository secret ANTHROPIC_API_KEY
          [ -n "$G" ] && echo "::add-mask::$G"; [ -n "$A" ] && echo "::add-mask::$A"
          echo "gemini key: $([ -n "$G" ] && echo yes || echo no) / anthropic key: $([ -n "$A" ] && echo yes || echo no)"
          npm init -y >/dev/null && npm install --no-save --silent @anthropic-ai/sdk
          [ -z "$HAIKU_EFFORT" ] && HAIKU_EFFORT="$(grep -o 'effort=[a-z]*' "$RUN_FILE" 2>/dev/null | cut -d= -f2)"
          export HAIKU_EFFORT="${HAIKU_EFFORT:-low}"
          export GEMINI_IN=0.30 GEMINI_OUT=2.50   # gemini-3.5-flash-lite (what gemini-flash-lite-latest served on 2026-11-21)
          GEMINI_API_KEY="$G" ANTHROPIC_API_KEY="$A" node scripts/bati-test/compare.mjs
      - name: Save the results
        if: always()
        run: |
          git config user.name "bati-test"
          git config user.email "bati-test@users.noreply.github.com"
          git add scripts/bati-test/results.json scripts/bati-test/report.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Bati model test: results [skip ci]"
          git reset -q --hard HEAD && git clean -qfd
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
